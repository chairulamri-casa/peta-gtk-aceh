function RombelKelasEditor({ target, data, setData, title, activeYear }) {
  const kelasOpts = KELAS_OPTIONS[target.jenjang] || [];
  const [draft, setDraft] = useState({});
  const [saved, setSaved] = useState(false);
  const targetKey = regKey(target.nsm, target.madrasah, target.kabkota);
  const matchYear = (r) => (r.tahunAjaran || defaultTahunAjaran()) === activeYear;
  const paralelLabel = (i) => String.fromCharCode(65 + i); // 0->A, 1->B, dst.

  useEffect(() => {
    const next = {};
    kelasOpts.forEach((k) => {
      const existing = data.find((r) => regKey(r.nsm, r.madrasah, r.kabkota) === targetKey && r.jenjang === target.jenjang && r.kelas === k && matchYear(r));
      if (existing && Array.isArray(existing.siswaParalel) && existing.siswaParalel.length > 0) {
        next[k] = { id: existing.id, siswaParalel: existing.siswaParalel.map((v) => String(v)) };
      } else if (existing) {
        // Data lama (belum dirinci per paralel) — taruh totalnya di kotak pertama supaya tidak hilang,
        // admin tinggal pecah manual ke kotak-kotak paralel sesuai kelas sungguhan.
        const n = Math.max(1, Number(existing.jumlahRombel) || 1);
        const arr = new Array(n).fill("");
        arr[0] = existing.jumlahSiswa;
        next[k] = { id: existing.id, siswaParalel: arr };
      } else {
        next[k] = { id: null, siswaParalel: [""] };
      }
    });
    setDraft(next);
  }, [targetKey, target.jenjang, activeYear]);

  const setParalelValue = (kelas, idx, val) => {
    const arr = [...(draft[kelas] ? draft[kelas].siswaParalel : [""])];
    arr[idx] = val;
    setDraft({ ...draft, [kelas]: { ...draft[kelas], siswaParalel: arr } });
  };
  const addParalel = (kelas) => {
    const arr = [...(draft[kelas] ? draft[kelas].siswaParalel : []), ""];
    setDraft({ ...draft, [kelas]: { ...draft[kelas], siswaParalel: arr } });
  };
  const removeParalel = (kelas, idx) => {
    const arr = (draft[kelas] ? draft[kelas].siswaParalel : []).filter((_, i) => i !== idx);
    setDraft({ ...draft, [kelas]: { ...draft[kelas], siswaParalel: arr } });
  };

  const kelasTotal = (k) => {
    const arr = (draft[k] && draft[k].siswaParalel) || [];
    return { rombel: arr.length, siswa: arr.reduce((s, v) => s + (Number(v) || 0), 0) };
  };
  const totalRombel = kelasOpts.reduce((s, k) => s + kelasTotal(k).rombel, 0);
  const totalSiswa = kelasOpts.reduce((s, k) => s + kelasTotal(k).siswa, 0);

  const saveAll = () => {
    let next = [...data];
    kelasOpts.forEach((k) => {
      const d = draft[k];
      if (!d) return;
      const idx = next.findIndex((r) => regKey(r.nsm, r.madrasah, r.kabkota) === targetKey && r.jenjang === target.jenjang && r.kelas === k && matchYear(r));
      const { rombel, siswa } = kelasTotal(k);
      if (rombel === 0) {
        if (idx >= 0) next.splice(idx, 1);
        return;
      }
      const record = {
        id: d.id || uid(), nsm: target.nsm, madrasah: target.madrasah, kabkota: target.kabkota, jenjang: target.jenjang, kelas: k,
        jumlahRombel: String(rombel), jumlahSiswa: String(siswa), siswaParalel: d.siswaParalel.map((v) => Number(v) || 0),
        tahunAjaran: activeYear
      };
      if (idx >= 0) next[idx] = record; else next.push(record);
    });
    setData(next);
    setSaved(true);
    setTimeout(() => setSaved(false), 2500);
  };
  if (kelasOpts.length === 0) return <Card className="p-5 text-sm text-stone-500">Jenjang {target.jenjang} belum punya daftar tingkat kelas baku di aplikasi ini.</Card>;
  return (
    <Card className="p-5">
      <h3 className="font-semibold mb-1 font-display">{title || `Rombel & Siswa — ${target.madrasah}`}</h3>
      <p className="text-xs text-stone-500 mb-4">Isi jumlah siswa <strong>per kelas paralel</strong> (mis. Kelas 1A, 1B, 1C) — sistem otomatis merekap jumlah rombel dan total siswa per tingkat kelas.</p>
      <div className="space-y-4">
        {kelasOpts.map((k) => {
          const arr = (draft[k] && draft[k].siswaParalel) || [];
          const { rombel, siswa } = kelasTotal(k);
          return (
            <div key={k} className="border border-stone-200 rounded-lg p-3">
              <div className="flex items-center justify-between mb-2">
                <p className="font-medium text-stone-700 text-sm">Kelas {k}</p>
                <p className="text-xs text-stone-400">{rombel} rombel · {siswa} siswa</p>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                {arr.map((v, idx) => (
                  <div key={idx} className="flex items-center gap-1.5">
                    <span className="text-xs text-stone-400 w-14 shrink-0">Kelas {k}{paralelLabel(idx)}</span>
                    <input type="number" className={inputCls.replace("w-full ", "") + " text-right"} placeholder="siswa" value={v} onChange={(e) => setParalelValue(k, idx, e.target.value)} />
                    {arr.length > 1 && (
                      <button onClick={() => removeParalel(k, idx)} className="text-stone-300 hover:text-rose-600 shrink-0" title="Hapus kelas paralel ini"><Icon name="trash" size={13} /></button>
                    )}
                  </div>
                ))}
              </div>
              <button onClick={() => addParalel(k)} className="text-xs text-[#0B4D3E] hover:underline mt-2 flex items-center gap-1"><Icon name="plus" size={12} /> Tambah Kelas Paralel</button>
            </div>
          );
        })}
        <div className="flex items-center justify-between px-3 py-2.5 bg-stone-50 rounded-lg font-semibold text-sm text-stone-700">
          <span>Total Keseluruhan</span><span>{totalRombel} rombel · {totalSiswa} siswa</span>
        </div>
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={saveAll} className="px-4 py-2 text-sm rounded-lg bg-[#0B4D3E] text-white hover:bg-[#0d5c4a]">Simpan Semua</button>
        {saved && <span className="text-xs text-emerald-700 flex items-center gap-1"><Icon name="check" size={13} /> Tersimpan</span>}
      </div>
    </Card>
  );
}
function MadrasahDrilldown({ masterList, fallbackList, onPick }) {

  );
}
function DataRombelTab({ list, lockIdentity, masterList, activeYear }) {
  const { data, setData } = list;
  const [modal, setModal] = useState(null);
  const [filterKab, setFilterKab] = useState("");
  const [importMsg, setImportMsg] = useState("");
  const [page, setPage] = useState(1);
  const PER_PAGE = 100;
  const [pickedMadrasah, setPickedMadrasah] = useState(null);
  const [showTable, setShowTable] = useState(false);
  const fallbackList = useMemo(() => {
    const map = {};
    data.filter((r) => (r.tahunAjaran || defaultTahunAjaran()) === activeYear).forEach((r) => {
      const key = regKey(r.nsm, r.madrasah, r.kabkota) + "|" + r.jenjang;
      if (!map[key]) map[key] = { id: key, nsm: r.nsm, nama: r.madrasah, kabkota: r.kabkota, jenjang: r.jenjang };
    });
    return Object.values(map);
  }, [data, activeYear]);

  const scopedData = useMemo(() => {
    let base = data.filter((r) => (r.tahunAjaran || defaultTahunAjaran()) === activeYear);
    if (!lockIdentity) return base;
    const target = regKey(lockIdentity.nsm, lockIdentity.madrasah, lockIdentity.kabkota);
    return base.filter((r) => regKey(r.nsm, r.madrasah, r.kabkota) === target);
  }, [data, lockIdentity, activeYear]);
  const filtered = useMemo(() => scopedData.filter((r) => lockIdentity || !filterKab || r.kabkota === filterKab), [scopedData, filterKab, lockIdentity]);
  useEffect(() => { setPage(1); }, [filterKab]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  const currentPage = Math.min(page, totalPages);
  const pageRows = useMemo(() => filtered.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE), [filtered, currentPage]);

  const save = (form) => {
    const exists = data.some((d) => d.id === form.id);
    setData(exists ? data.map((d) => (d.id === form.id ? form : d)) : [...data, form]);
    setModal(null);
  };
  const remove = (id) => setData(data.filter((d) => d.id !== id));
  const newEntry = () => {
    const base = emptyRombel(activeYear);
    if (lockIdentity) return { ...base, nsm: lockIdentity.nsm, madrasah: lockIdentity.madrasah, kabkota: lockIdentity.kabkota, jenjang: lockIdentity.jenjang };
    return base;
  };

  const [importing, setImporting] = useState(false);
  const handleFile = (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setImporting(true);
    let allMapped = [];
    let filesLeft = files.length;
    let hadError = false;
    files.forEach((file) => {
      parseSheet(file, (rows) => {
        filesLeft -= 1;
        if (!rows) { hadError = true; }
        else {
          const mapped = rows.map((r) => ({
            id: uid(), madrasah: r.Madrasah || r.madrasah || "", nsm: String(r.NSM || r.nsm || ""),
            kabkota: normalizeKabKota(r["Kab/Kota"] || r.kabkota || KABKOTA_LIST[0]),
            jenjang: normalizeJenjang(r.Jenjang || r.jenjang || "MI"), kelas: String(r.Kelas || r.kelas || ""),
            jumlahRombel: String(r["Jumlah Rombel"] || ""), jumlahSiswa: String(r["Jumlah Siswa"] || ""),
            tahunAjaran: r["Tahun Ajaran"] || activeYear
          })).filter((r) => r.madrasah);
          allMapped = allMapped.concat(mapped);
        }
        if (filesLeft === 0) {
          setImporting(false);
          if (allMapped.length) setData([...data, ...allMapped]);
          setImportMsg(hadError ? `Berhasil mengimpor ${allMapped.length} baris (sebagian file gagal dibaca).` : `Berhasil mengimpor ${allMapped.length} baris dari ${files.length} file rekap.`);
        }
      });
    });
    e.target.value = "";
  };

  if (lockIdentity) {
    return (
      <div className="space-y-4">
        <RombelKelasEditor target={lockIdentity} data={data} setData={setData} activeYear={activeYear} />
      </div>
    );
  }

  return (
    <div className="space-y-4">
      {!pickedMadrasah ? (
        <MadrasahDrilldown masterList={masterList} fallbackList={fallbackList} onPick={setPickedMadrasah} />
      ) : (
        <div>
          <button onClick={() => setPickedMadrasah(null)} className="text-xs text-stone-400 hover:text-stone-600 mb-2">← Pilih madrasah lain</button>
          <RombelKelasEditor target={pickedMadrasah} data={data} setData={setData} activeYear={activeYear} />
        </div>
      )}

      <button onClick={() => setShowTable((s) => !s)} className="text-xs text-stone-500 hover:text-stone-700 hover:underline">
        {showTable ? "▲ Sembunyikan" : "▼ Lihat"} semua data (tabel) &amp; Import/Export Excel
      </button>

      {showTable && (
        <>
          <div className="flex flex-wrap items-center gap-2 justify-between">
            <select className={inputCls + " w-48"} value={filterKab} onChange={(e) => setFilterKab(e.target.value)}>
              <option value="">Semua Kab/Kota</option>{KABKOTA_LIST.map((k) => <option key={k}>{k}</option>)}
            </select>
            <div className="flex gap-2">
              <label className="px-3 py-2 text-sm rounded-lg border border-stone-300 hover:bg-stone-50 cursor-pointer flex items-center gap-1.5">
                <Icon name="upload" size={14} /> Import Rekap (bisa banyak file)
                <input type="file" accept=".xlsx,.xls,.csv" multiple className="hidden" onChange={handleFile} />
              </label>
              <button onClick={() => downloadTemplate("rombel")} className="px-3 py-2 text-sm rounded-lg border border-stone-300 hover:bg-stone-50 flex items-center gap-1.5"><Icon name="download" size={14} /> Template</button>
              <button onClick={() => exportData(filtered, "Data_Rombel_Siswa.xlsx", (r) => ({ NSM: r.nsm || "", Madrasah: r.madrasah, "Kab/Kota": r.kabkota, Jenjang: r.jenjang, Kelas: r.kelas || "", "Jumlah Rombel": r.jumlahRombel, "Jumlah Siswa": r.jumlahSiswa, "Tahun Ajaran": r.tahunAjaran || "" }))} className="px-3 py-2 text-sm rounded-lg border border-stone-300 hover:bg-stone-50 flex items-center gap-1.5"><Icon name="sheet" size={14} /> Export</button>
              <button onClick={() => setModal("add")} className="px-3 py-2 text-sm rounded-lg bg-[#0B4D3E] text-white hover:bg-[#0d5c4a] flex items-center gap-1.5"><Icon name="plus" size={14} /> Tambah Baris Manual</button>
            </div>
          </div>
          {importing && <p className="text-xs text-stone-500 flex items-center gap-1.5"><Icon name="loader" size={12} className="animate-spin" /> Mengimpor...</p>}
          {importMsg && <p className="text-xs text-emerald-700">{importMsg}</p>}
          <Card className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-stone-50 text-stone-500 text-xs uppercase">
                <tr>
                  <th className="text-left px-4 py-2.5 font-medium">Madrasah</th><th className="text-left px-4 py-2.5 font-medium">Kab/Kota</th>
                  <th className="text-left px-4 py-2.5 font-medium">Jenjang</th><th className="text-left px-4 py-2.5 font-medium">Kelas</th><th className="text-right px-4 py-2.5 font-medium">Jml Rombel</th>
                  <th className="text-right px-4 py-2.5 font-medium">Jml Siswa</th><th className="text-right px-4 py-2.5 font-medium">Aksi</th>
                </tr>
              </thead>
              <tbody>
                {pageRows.map((r) => (
                  <tr key={r.id} className="border-t border-stone-100 hover:bg-stone-50/60">
                    <td className="px-4 py-2.5 font-medium text-stone-700">{r.madrasah}</td>
                    <td className="px-4 py-2.5 text-stone-600">{r.kabkota}</td>
                    <td className="px-4 py-2.5"><Badge>{r.jenjang}</Badge></td>
                    <td className="px-4 py-2.5 text-stone-500">{r.kelas ? `Kelas ${r.kelas}` : "Semua"}</td>
                    <td className="px-4 py-2.5 text-right text-stone-600">{r.jumlahRombel}</td>
                    <td className="px-4 py-2.5 text-right text-stone-600">{r.jumlahSiswa}</td>
                    <td className="px-4 py-2.5 text-right whitespace-nowrap">
                      <button onClick={() => setModal({ edit: r })} className="text-stone-400 hover:text-[#0B4D3E] p-1"><Icon name="edit" size={14} /></button>
                      <button onClick={() => remove(r.id)} className="text-stone-400 hover:text-rose-600 p-1"><Icon name="trash" size={14} /></button>
                    </td>
                  </tr>
                ))}
                {filtered.length === 0 && <tr><td colSpan={7} className="text-center py-10 text-stone-400 text-sm">Tidak ada data rombel/siswa.</td></tr>}
              </tbody>
            </table>
          </Card>
          <div className="flex items-center justify-between">
            <p className="text-xs text-stone-400">Menampilkan {filtered.length === 0 ? 0 : (currentPage - 1) * PER_PAGE + 1}–{Math.min(currentPage * PER_PAGE, filtered.length)} dari {filtered.length} baris (total {data.length}).</p>
            {totalPages > 1 && (
              <div className="flex items-center gap-2">
                <button onClick={() => setPage((p) => Math.max(1, p - 1))} disabled={currentPage <= 1} className="px-3 py-1.5 text-xs rounded-lg border border-stone-300 hover:bg-stone-50 disabled:opacity-40">Sebelumnya</button>
                <span className="text-xs text-stone-500">Halaman {currentPage} / {totalPages}</span>
                <button onClick={() => setPage((p) => Math.min(totalPages, p + 1))} disabled={currentPage >= totalPages} className="px-3 py-1.5 text-xs rounded-lg border border-stone-300 hover:bg-stone-50 disabled:opacity-40">Berikutnya</button>
              </div>
            )}
          </div>
        </>
      )}

      {modal && (
        <Modal title={modal === "add" ? "Tambah Data Rombel & Siswa" : "Edit Data"} onClose={() => setModal(null)}>
          <RombelForm initial={modal === "add" ? newEntry() : modal.edit} onSave={save} onCancel={() => setModal(null)} masterList={masterList} />
        </Modal>
      )}
    </div>
  );
}

      <div className="border border-dashed border-stone-300 rounded-lg p-4 text-center text-xs text-stone-400">

      </div>

      <Badge tone={row.status === "kurang" ? "good" : row.status === "lebih" ? "bad" : "warn"}>
        <Icon name={row.status === "kurang" ? "check" : "alert"} size={11} /> {row.status === "kurang" ? "Tersedia Slot Mutasi" : row.status === "lebih" ? "Tidak Direkomendasikan" : "Pas / Perlu Kehati-hatian"}
      </Badge>
      <p className="text-xs text-stone-600 mt-2">{verdictText}</p>
      <div className="grid grid-cols-3 gap-2 text-xs text-stone-500 mt-3 pt-2 border-t border-stone-200/70">
        <p>Rombel: <span className="font-medium text-stone-700">{row.rombel}</span></p>
        <p>Kebutuhan: <span className="font-medium text-stone-700">{row.kebutuhan}</span></p>
        <p>Guru ada: <span className="font-medium text-stone-700">{row.tersedia}</span></p>
      </div>
    </div>
  );
}
function MutasiChecker({ mapelAnalysis, rombelData, settings }) {
  const [jenjangAsal, setJenjangAsal] = useState("MI");
  const [jenjangTujuan, setJenjangTujuan] = useState("MI");
  const mapelOptionsAsal = analysisMapelOptions(settings, jenjangAsal);
  const mapelOptionsTujuan = analysisMapelOptions(settings, jenjangTujuan);
  const [mapelAsal, setMapelAsal] = useState(mapelOptionsAsal[0] || "");
  const [mapelTujuan, setMapelTujuan] = useState(mapelOptionsTujuan[0] || "");
  const [asal, setAsal] = useState("");
  const [tujuan, setTujuan] = useState("");

  useEffect(() => {
    const opts = analysisMapelOptions(settings, jenjangAsal);
    setMapelAsal(opts[0] || "");
    setAsal("");
  }, [jenjangAsal]);

  useEffect(() => {
    const opts = analysisMapelOptions(settings, jenjangTujuan);
    const gkNames = GURU_KELAS_MAPEL_CLUSTER_MI.map(norm);
    const suggestGuruKelas = jenjangTujuan === "MI" && (gkNames.includes(norm(mapelAsal)) || mapelAsal === GURU_KELAS_LABEL);
    setMapelTujuan(suggestGuruKelas ? GURU_KELAS_LABEL : (opts[0] || ""));
    setTujuan("");
  }, [jenjangTujuan]);

  const madrasahOptionsFor = (jenjang) => {
    const map = {};
    rombelData.filter((r) => r.jenjang === jenjang).forEach((r) => {
      const key = regKey(r.nsm, r.madrasah, r.kabkota);
      if (!map[key]) map[key] = { value: key, label: `${r.madrasah} — ${r.kabkota}${r.nsm ? " (NSM " + r.nsm + ")" : ""}`, nsm: r.nsm, madrasah: r.madrasah, kabkota: r.kabkota };
    });
    return Object.values(map).sort((a, b) => a.madrasah.localeCompare(b.madrasah));
  };
  const madrasahOptionsAsal = useMemo(() => madrasahOptionsFor(jenjangAsal), [rombelData, jenjangAsal]);
  const madrasahOptionsTujuan = useMemo(() => madrasahOptionsFor(jenjangTujuan), [rombelData, jenjangTujuan]);

  const findRow = (key, jenjang, mapel, options) => {
    const opt = options.find((m) => m.value === key);
    if (!opt) return null;
    return mapelAnalysis.find((r) => regKey(r.nsm, r.madrasah, r.kabkota) === key && r.jenjang === jenjang && norm(r.mapel) === norm(mapel));
  };
  const rowAsal = asal ? findRow(asal, jenjangAsal, mapelAsal, madrasahOptionsAsal) : null;
  const rowTujuan = tujuan ? findRow(tujuan, jenjangTujuan, mapelTujuan, madrasahOptionsTujuan) : null;

  const blockedTujuan = mapelAsal === GURU_KELAS_LABEL && (jenjangTujuan === "MTs" || jenjangTujuan === "MA")
    ? "Guru Kelas tidak memiliki posisi setara di MTs/MA — jenjang ini memakai sistem guru mata pelajaran, bukan guru kelas. Guru bersertifikasi/bertugas Guru Kelas tidak dapat dimutasi ke jenjang ini."
    : null;

  return (

      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

/* ============================== KEPALA MADRASAH MASIH TERCATAT MENGAJAR MAPEL ==============================
   Kepala Madrasah dikecualikan dari kewajiban mengajar mapel tertentu (PMA 24/2018). Kalau kolom Mapel
   masih terisi, guru itu ikut terhitung sebagai "guru tersedia" di analisis kebutuhan — bisa membuat
   angka kekurangan guru se-provinsi tertutupi (understated), khususnya untuk yang mapelnya bahkan
   sudah tidak ada di jenjang madrasah tempat dia sekarang (indikasi kuat dia sudah pindah tugas). */
function findKepalaMadrasahDenganMapel(guruData, settings) {
  return guruData
    .filter((g) => isKepalaMadrasahTugas(g.tugas) && g.mapel && g.statusAktif !== "Non-Aktif")
    .map((g) => {
      const names = MAPEL_JENJANG_LIST.includes(g.jenjang) ? validGuruMapelNames(settings, g.jenjang) : [];
      const cocokJenjang = names.some((m) => norm(m) === norm(g.mapel));
      return { ...g, cocokJenjang };
    })
    .sort((a, b) => (a.cocokJenjang === b.cocokJenjang ? a.nama.localeCompare(b.nama) : a.cocokJenjang ? 1 : -1));
}
function KepalaMadrasahMapelPanel({ guruData, setGuruData, settings }) {

    setSavedMsg(`Mapel "${g.mapel}" milik ${g.nama} dipindahkan ke Latar Belakang Mapel, Jam Mengajar diset 0.`);
    setTimeout(() => setSavedMsg(""), 4000);

  const pindahkanSemua = () => {
    if (!window.confirm(`Pindahkan Mapel ke Latar Belakang untuk SEMUA ${daftar.length} Kepala Madrasah dalam daftar ini? Mapel mereka akan dikosongkan (tidak ikut dihitung sebagai guru tersedia), Jam Mengajar diset 0, dan mapel lama dicatat sebagai riwayat. Tindakan ini bisa dibatalkan satu-satu lewat Edit Data Guru kalau ada yang keliru.`)) return;
    const ids = new Set(daftar.map((g) => g.id));
    setGuruData(guruData.map((x) => (ids.has(x.id) ? { ...x, mapelLatarBelakang: x.mapel, mapel: "", jamMengajar: "0" } : x)));
    setSavedMsg(`${daftar.length} data Kepala Madrasah dipindahkan Mapel-nya ke Latar Belakang, Jam Mengajar diset 0.`);
    setTimeout(() => setSavedMsg(""), 4000);
  };

  return (
    <Card className="p-5 border-amber-200">
      <h3 className="font-semibold mb-1 flex items-center gap-2 text-amber-800 font-display"><Icon name="alert" size={16} /> Kepala Madrasah Masih Tercatat Mengajar Mapel ({daftar.length})</h3>
      <p className="text-xs text-stone-500 mb-1">Kepala Madrasah tidak wajib mengajar mapel tertentu (PMA 24/2018) — selama kolom Mapel masih terisi, mereka ikut dihitung sebagai <strong>guru tersedia</strong> di analisis kebutuhan, yang bisa membuat kekurangan guru sebenarnya jadi tertutupi.</p>

      </p>
      <div className="overflow-x-auto">

function findUnmatchedMapel(guruData, settings) {
  const map = {};
  const namesByJenjang = {};
  MAPEL_JENJANG_LIST.forEach((j) => { namesByJenjang[j] = validGuruMapelNames(settings, j); });
  guruData.forEach((g) => {
    if (!MAPEL_JENJANG_LIST.includes(g.jenjang) || !g.mapel) return;
    const names = namesByJenjang[g.jenjang] || [];
    const matched = names.some((m) => norm(m) === norm(g.mapel));
    if (!matched) {
      const key = g.jenjang + "|" + norm(g.mapel);
      if (!map[key]) map[key] = { jenjang: g.jenjang, mapel: g.mapel, count: 0 };
      map[key].count += 1;
    }
  });
  return Object.values(map).sort((a, b) => b.count - a.count);
}
function UnmatchedMapelPanel({ guruData, setGuruData, settings, onUpdateSettings }) {
  const unmatched = useMemo(() => findUnmatchedMapel(guruData, settings), [guruData, settings]);
  const [merge, setMerge] = useState({});
  const [savedMsg, setSavedMsg] = useState("");
  if (unmatched.length === 0) return null;

  // Untuk MA, sertakan juga katalog resmi Mapel Pilihan Kelas 11-12 (Biologi, Fisika, Kimia, dst)
  // sebagai pilihan penyamaan — supaya tidak perlu "Tambahkan sebagai Mapel Baru" yang keliru membuatnya
  // jadi mapel WAJIB di semua kelas (termasuk Kelas 10, yang seharusnya belum ada peminatan).
  const optionsFor = (jenjang) => {
    const wajib = validGuruMapelNames(settings, jenjang).map((m) => ({ label: m, value: m, group: "Wajib (semua kelas)" }));
    if (jenjang !== "MA") return wajib;
    const pilihan = MAPEL_PILIHAN_MA_11_12.map((m) => ({ label: m.nama, value: m.nama, group: "Pilihan (Kelas 11-12 saja)" }));
    return [...wajib, ...pilihan];
  };

  const addAsNew = (row) => {
    const jenjangTable = settings.jtmMapel[row.jenjang] || {};
    const nextJenjangTable = {};
    Object.entries(jenjangTable).forEach(([kelas, table]) => { nextJenjangTable[kelas] = { ...table, [row.mapel]: 2 }; });
    const next = { ...settings, jtmMapel: { ...settings.jtmMapel, [row.jenjang]: nextJenjangTable } };
    onUpdateSettings(next);
    setSavedMsg(`"${row.mapel}" ditambahkan sebagai mapel WAJIB di semua tingkat kelas ${row.jenjang} (JTM default 2 jam/minggu — sesuaikan per tingkat di Pengaturan).`);
    setTimeout(() => setSavedMsg(""), 5000);
  };
  const mergeInto = (row) => {
    const key = row.jenjang + "|" + norm(row.mapel);
    const target = merge[key];
    if (!target) return;
    const nextGuru = guruData.map((g) => (g.jenjang === row.jenjang && norm(g.mapel) === norm(row.mapel) ? { ...g, mapel: target } : g));
    setGuruData(nextGuru);
    setSavedMsg(`${row.count} guru dengan mapel "${row.mapel}" disamakan menjadi "${target}".`);
    setTimeout(() => setSavedMsg(""), 4000);
  };

  return (
    <Card className="p-5 border-amber-200">
      <h3 className="font-semibold mb-1 flex items-center gap-2 text-amber-800 font-display"><Icon name="alert" size={16} /> Mapel Belum Cocok ({unmatched.length})</h3>
      <p className="text-xs text-stone-500 mb-4">Nama mata pelajaran ini ada di Data Guru tapi belum ada di tabel JTM (Pengaturan) — guru dengan mapel ini <strong>tidak ikut terhitung</strong> di analisis Kebutuhan per Mapel. Pilih salah satu perbaikan per baris. <strong>Untuk MA:</strong> kalau mapelnya termasuk peminatan (Biologi, Fisika, Kimia, dst), pilih dari grup "Pilihan (Kelas 11-12 saja)" di dropdown — <strong>jangan</strong> pakai "Tambahkan sebagai Mapel Baru" untuk itu, karena itu akan membuatnya jadi mapel wajib di semua kelas MA termasuk Kelas 10.</p>
      <div className="space-y-3">
        {unmatched.map((row) => {
          const key = row.jenjang + "|" + norm(row.mapel);
          const options = optionsFor(row.jenjang);
          const groups = Array.from(new Set(options.map((o) => o.group)));
          return (
            <div key={key} className="border border-stone-200 rounded-lg p-3 flex flex-wrap items-center gap-2">
              <div className="flex-1 min-w-[180px]">
                <p className="text-sm font-medium text-stone-700">{row.mapel} <Badge>{row.jenjang}</Badge></p>
                <p className="text-xs text-stone-400">{row.count} guru terdampak</p>
              </div>
              <select className={inputCls + " w-64"} value={merge[key] || ""} onChange={(e) => setMerge({ ...merge, [key]: e.target.value })}>
                <option value="">— samakan dengan mapel yang sudah ada —</option>
                {groups.map((g) => (
                  <optgroup key={g} label={g}>
                    {options.filter((o) => o.group === g).map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
                  </optgroup>
                ))}
              </select>
              <button onClick={() => mergeInto(row)} disabled={!merge[key]} className="px-3 py-2 text-xs rounded-lg border border-stone-300 hover:bg-stone-50 disabled:opacity-40">Terapkan Penyamaan</button>
              <button onClick={() => { if (row.jenjang === "MA" && !window.confirm(`"${row.mapel}" akan ditambahkan sebagai mapel WAJIB di SEMUA kelas MA (10, 11, DAN 12) — bukan cuma Kelas 11-12. Kalau ini sebenarnya mapel peminatan, batalkan dan pilih dari dropdown grup "Pilihan (Kelas 11-12 saja)" di atas. Lanjutkan sebagai mapel wajib?`)) return; addAsNew(row); }} className="px-3 py-2 text-xs rounded-lg bg-[#0B4D3E] text-white hover:bg-[#0d5c4a]">Tambahkan sebagai Mapel Baru (Wajib)</button>
            </div>
          );
        })}
      </div>
      {savedMsg && <p className="text-xs text-emerald-700 mt-3">{savedMsg}</p>}
    </Card>
  );
}

          <div className="border border-stone-200 rounded-lg p-3">
            <p className="text-[10px] uppercase text-stone-400 font-medium">Total Pasangan</p>
            <p className="text-xl font-semibold text-stone-800 font-display">{filtered.length}</p>
          </div>
          <div className="border border-stone-200 rounded-lg p-3">
            <p className="text-[10px] uppercase text-stone-400 font-medium">Total Guru Disarankan Pindah</p>
            <p className="text-xl font-semibold text-stone-800 font-display">{totalGuruPindah}</p>
          </div>
          <div className="border border-stone-200 rounded-lg p-3">
            <p className="text-[10px] uppercase text-emerald-600 font-medium">Dalam Kab/Kota Sama</p>
            <p className="text-xl font-semibold text-emerald-700 font-display">{totalSamaKab}</p>
          </div>
          <div className="border border-stone-200 rounded-lg p-3">
            <p className="text-[10px] uppercase text-amber-600 font-medium">Lintas Kab/Kota</p>
            <p className="text-xl font-semibold text-amber-700 font-display">{totalGuruPindah - totalSamaKab}</p>
          </div>
        </div>
        <div className="flex flex-wrap items-center gap-2">
          <div className="relative">
            <span className="absolute left-2.5 top-2.5 text-stone-400"><Icon name="search" size={14} /></span>
            <input placeholder="Cari madrasah / mapel" value={q} onChange={(e) => setQ(e.target.value)} className={inputCls + " pl-8 w-56"} />
          </div>
          <select className={inputCls + " w-28"} value={filterJenjang} onChange={(e) => setFilterJenjang(e.target.value)}>
            <option value="">Semua Jenjang</option>{MAPEL_JENJANG_LIST.map((j) => <option key={j}>{j}</option>)}
          </select>
          <select className={inputCls + " w-44"} value={filterKab} onChange={(e) => setFilterKab(e.target.value)}>
            <option value="">Semua Kab/Kota</option>{KABKOTA_LIST.map((k) => <option key={k}>{k}</option>)}
          </select>
          <select className={inputCls + " w-40"} value={filterPrioritas} onChange={(e) => setFilterPrioritas(e.target.value)}>
            <option value="">Semua Prioritas</option><option value="Sama Kab/Kota">Sama Kab/Kota</option><option value="Lintas Kab/Kota">Lintas Kab/Kota</option>
          </select>
          <button onClick={doExport} disabled={filtered.length === 0} className="ml-auto px-3 py-2 text-xs rounded-lg border border-stone-300 hover:bg-stone-50 disabled:opacity-40 flex items-center gap-1.5"><Icon name="download" size={13} /> Ekspor Excel</button>
        </div>
      </Card>
      <Card className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-stone-50 text-stone-500 text-xs uppercase">
            <tr>
              <th className="text-left px-4 py-2.5 font-medium">Jenjang</th><th className="text-left px-4 py-2.5 font-medium">Mapel</th>
              <th className="text-left px-4 py-2.5 font-medium">Dari (Kelebihan)</th><th className="text-left px-4 py-2.5 font-medium">Ke (Kekurangan)</th>
              <th className="text-right px-4 py-2.5 font-medium">Jumlah Disarankan</th><th className="text-left px-4 py-2.5 font-medium">Prioritas</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map((r, i) => (
              <tr key={i} className="border-t border-stone-100 hover:bg-stone-50/60">
                <td className="px-4 py-2.5"><Badge>{r.jenjang}</Badge></td>
                <td className="px-4 py-2.5 text-stone-600">{r.mapel} {r.isCluster && <Badge tone="gold">rumpun</Badge>}</td>
                <td className="px-4 py-2.5">
                  <p className="font-medium text-stone-700">{r.asalMadrasah}</p>
                  <p className="text-xs text-stone-400">{r.asalKabkota} · sisa kelebihan {r.asalSisaSebelum}</p>
                </td>
                <td className="px-4 py-2.5">
                  <p className="font-medium text-stone-700">{r.tujuanMadrasah}</p>
                  <p className="text-xs text-stone-400">{r.tujuanKabkota} · sisa kekurangan {r.tujuanSisaSebelum}</p>
                </td>
                <td className="px-4 py-2.5 text-right font-semibold text-stone-700">{r.jumlah}</td>
                <td className="px-4 py-2.5"><Badge tone={r.prioritas === "Sama Kab/Kota" ? "good" : "warn"}>{r.prioritas}</Badge></td>
              </tr>
            ))}
            {filtered.length === 0 && <tr><td colSpan={6} className="text-center py-10 text-stone-400 text-sm">Tidak ada rekomendasi — belum ada pasangan kelebihan/kekurangan guru yang cocok pada jenjang &amp; mapel yang sama, atau data belum lengkap.</td></tr>}
          </tbody>
        </table>
      </Card>
      <Card className="p-4 text-xs text-stone-500 leading-relaxed">
        <strong className="text-stone-600">Catatan:</strong> rekomendasi ini murni berdasarkan selisih kebutuhan vs ketersediaan guru per mapel di tab Kebutuhan per Mapel. Sistem <strong>tidak</strong> mempertimbangkan jarak tempuh riil, kompetensi individu guru, status kepegawaian, atau kesediaan pindah — gunakan sebagai titik awal, lalu verifikasi tiap pasangan secara manual.
      </Card>
    </div>
  );
}

/* ============================== ISIAN KEBUTUHAN GURU (MANUAL) ============================== */

function downloadIsianKebutuhanTemplate(rows, madrasah, kabkota, jenjang) {
  const data = rows.map((r) => ({
    NSM: r.nsm || "", Madrasah: madrasah, "Kab/Kota": kabkota, Jenjang: jenjang, Mapel: r.mapel,
    Rombel: r.rombel, "Total Jam/Mgu": r.jamMgg, "Kebutuhan Terhitung": r.kebutuhan,
    "PNS Kemenag - Sudah Sertifikasi": "", "PNS Kemenag - Belum Sertifikasi": "",
    "PNS Dinas - Sudah Sertifikasi": "", "PNS Dinas - Belum Sertifikasi": "",
    "PPPK - Sudah Sertifikasi": "", "PPPK - Belum Sertifikasi": "",
    "Non ASN - Belum Sertifikasi": "", "Non ASN - Sudah Inpassing": "", "Non ASN - Belum Inpassing": "",
    "Kebutuhan Guru Berdasar Madrasah": "", Catatan: ""
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Isian");
  XLSX.writeFile(wb, `Isian_Kebutuhan_Guru_${madrasah.replace(/\s+/g, "_")}.xlsx`);
}

function IsianKebutuhanTab({ mapelAnalysis, rombelData, guruData, isianList, setIsianList, pilihanList, setPilihanList, settings, lockIdentity, activeYear }) {
  const madrasahOptionsAll = useMemo(() => {
    const map = {};
    rombelData.forEach((r) => {
      if (!MAPEL_JENJANG_LIST.includes(r.jenjang)) return;
      const key = regKey(r.nsm, r.madrasah, r.kabkota);
      if (!map[key]) map[key] = { key, madrasah: r.madrasah, nsm: r.nsm, kabkota: r.kabkota, jenjang: r.jenjang };
    });
    return Object.values(map).sort((a, b) => a.madrasah.localeCompare(b.madrasah));
  }, [rombelData]);
  const lockKey = lockIdentity ? regKey(lockIdentity.nsm, lockIdentity.madrasah, lockIdentity.kabkota) : null;
  const madrasahOptions = lockKey ? madrasahOptionsAll.filter((m) => m.key === lockKey) : madrasahOptionsAll;

  const [selected, setSelected] = useState(madrasahOptions[0] ? madrasahOptions[0].key : "");
  const current = madrasahOptions.find((m) => m.key === selected);
  const [draft, setDraft] = useState({});
  const [importing, setImporting] = useState(false);
  const [msg, setMsg] = useState("");
  const [expandedMapel, setExpandedMapel] = useState(null);

  const rows = current
    ? mapelAnalysis.filter((r) => regKey(r.nsm, r.madrasah, r.kabkota) === current.key && r.jenjang === current.jenjang)
    : [];

  // Kepala Madrasah di madrasah ini yang di Data Guru (EMIS) masih/pernah tercatat dengan mapel
  // tertentu — sekadar PENGINGAT untuk admin madrasah, karena Kepala Madrasah tidak wajib mengajar
  // (PMA 24/2018) dan TIDAK seharusnya ikut dihitung di kotak isian manual di bawah ini.
  const kepalaMadrasahByMapel = useMemo(() => {
    if (!current) return {};
    const map = {};
    guruData.forEach((g) => {
      if (!isKepalaMadrasahTugas(g.tugas) || g.statusAktif === "Non-Aktif") return;
      if (regKey(g.nsm, g.madrasah, g.kabkota) !== current.key) return;
      const label = g.mapel || g.mapelLatarBelakang;
      if (!label) return;
      const key = norm(label);
      if (!map[key]) map[key] = [];
      map[key].push({ nama: g.nama, statusMapel: g.mapel ? "masih terisi di Data Guru" : "sudah di Latar Belakang" });
    });
    return map;
  }, [guruData, current && current.key]);

  // Migrasi data lama: kalau isian tersimpan sebagai angka polos (sebelum ada rincian), taruh
  // angka itu di kotak "Belum Sertifikasi" sebagai posisi netral — tidak hilang, tinggal admin
  // pindahkan manual ke kotak yang sesuai begitu tahu status sertifikasinya.
  const emptyKemenagDinasPppk = () => ({ sertifikasi: "", belumSertifikasi: "" });
  const emptyNonAsn = () => ({ belumSertifikasi: "", sudahInpassing: "", belumInpassing: "" });
  const toKemenagDinasPppk = (val) => {
    if (val && typeof val === "object") return { sertifikasi: val.sertifikasi ?? "", belumSertifikasi: val.belumSertifikasi ?? "" };
    const obj = emptyKemenagDinasPppk();
    if (val) obj.belumSertifikasi = val;
    return obj;
  };
  const toNonAsn = (val) => {
    if (val && typeof val === "object") return { belumSertifikasi: val.belumSertifikasi ?? "", sudahInpassing: val.sudahInpassing ?? "", belumInpassing: val.belumInpassing ?? "" };
    const obj = emptyNonAsn();
    if (val) obj.belumSertifikasi = val;
    return obj;
  };

  useEffect(() => {
    if (!current) return;
    const next = {};
    rows.forEach((r) => {
      const existing = findIsianGuru(isianList, current.nsm, current.madrasah, current.kabkota, current.jenjang, r.mapel, activeYear);
      next[r.mapel] = existing
        ? {
            pnsKemenag: toKemenagDinasPppk(existing.pnsKemenag), pnsDinas: toKemenagDinasPppk(existing.pnsDinas),
            pppk: toKemenagDinasPppk(existing.pppk), nonAsn: toNonAsn(existing.nonAsn),
            kebutuhanManual: existing.kebutuhanManual, catatan: existing.catatan, penyebabUtama: existing.penyebabUtama || ""
          }
        : { pnsKemenag: emptyKemenagDinasPppk(), pnsDinas: emptyKemenagDinasPppk(), pppk: emptyKemenagDinasPppk(), nonAsn: emptyNonAsn(), kebutuhanManual: "", catatan: "", penyebabUtama: "" };
    });
    setDraft(next);
  }, [selected]);

  if (!current) {
    return (
      <Card className="p-8 text-center">
        <Icon name="clipboard" size={36} className="mx-auto text-stone-300 mb-3" />
        <p className="text-stone-500 text-sm">Belum ada data rombel tahun ajaran {activeYear} untuk madrasah manapun. Lengkapi data di tab Rombel & Siswa terlebih dahulu.</p>
      </Card>
    );
  }

  const setField = (mapel, field, value) => setDraft({ ...draft, [mapel]: { ...draft[mapel], [field]: value } });
  const setSubField = (mapel, category, subfield, value) => setDraft({ ...draft, [mapel]: { ...draft[mapel], [category]: { ...draft[mapel][category], [subfield]: value } } });
  const catTotal = (mapel, category) => Object.values((draft[mapel] && draft[mapel][category]) || {}).reduce((s, v) => s + (Number(v) || 0), 0);

  const saveAll = () => {
    let nextList = [...isianList];
    rows.forEach((r) => {
      const d = draft[r.mapel] || {};
      const existing = findIsianGuru(nextList, current.nsm, current.madrasah, current.kabkota, current.jenjang, r.mapel, activeYear);
      const record = {
        id: existing ? existing.id : uid(),
        nsm: current.nsm, madrasah: current.madrasah, kabkota: current.kabkota, jenjang: current.jenjang, mapel: r.mapel,
        tahunAjaran: activeYear,
        pnsKemenag: d.pnsKemenag || emptyKemenagDinasPppk(), pnsDinas: d.pnsDinas || emptyKemenagDinasPppk(),
        pppk: d.pppk || emptyKemenagDinasPppk(), nonAsn: d.nonAsn || emptyNonAsn(),
        kebutuhanManual: d.kebutuhanManual || "", catatan: d.catatan || "", penyebabUtama: d.penyebabUtama || ""
      };
      nextList = existing ? nextList.map((i) => (i.id === existing.id ? record : i)) : [...nextList, record];
    });
    setIsianList(nextList);
    setMsg("Isian kebutuhan guru tersimpan.");
    setTimeout(() => setMsg(""), 3000);
  };

  const deleteOne = (mapel) => {
    const existing = findIsianGuru(isianList, current.nsm, current.madrasah, current.kabkota, current.jenjang, mapel, activeYear);
    if (existing) setIsianList(isianList.filter((i) => i.id !== existing.id));
    setDraft({ ...draft, [mapel]: { pnsKemenag: emptyKemenagDinasPppk(), pnsDinas: emptyKemenagDinasPppk(), pppk: emptyKemenagDinasPppk(), nonAsn: emptyNonAsn(), kebutuhanManual: "", catatan: "", penyebabUtama: "" } });
  };

  const [confirmClearAll, setConfirmClearAll] = useState(false);
  const clearAllForMadrasah = () => {
    const targetKey = regKey(current.nsm, current.madrasah, current.kabkota);
    setIsianList(isianList.filter((i) => !(regKey(i.nsm, i.madrasah, i.kabkota) === targetKey && i.jenjang === current.jenjang && (i.tahunAjaran || defaultTahunAjaran()) === activeYear)));
    setDraft({});
    setConfirmClearAll(false);
    setMsg(`Semua isian untuk ${current.madrasah} (TA ${activeYear}) sudah dihapus.`);
    setTimeout(() => setMsg(""), 4000);
  };

  const handleImport = (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setImporting(true);
    let allRows = [];
    let filesLeft = files.length;
    files.forEach((file) => {
      parseSheet(file, (parsed) => {
        filesLeft -= 1;
        if (parsed) allRows = allRows.concat(parsed);
        if (filesLeft === 0) {
          setImporting(false);
          let nextList = [...isianList];
          let count = 0;
          allRows.forEach((r) => {
            const nsm = String(r.NSM || "");
            const madrasah = r.Madrasah || "";
            const kabkota = normalizeKabKota(r["Kab/Kota"] || "");
            const jenjang = normalizeJenjang(r.Jenjang || "");
            const mapel = r.Mapel || "";
            const tahunAjaran = r["Tahun Ajaran"] || activeYear;
            if (!madrasah || !mapel) return;
            const existing = findIsianGuru(nextList, nsm, madrasah, kabkota, jenjang, mapel, tahunAjaran);
            const readCat = (labelPrefix, flatLabel) => {
              const sert = r[`${labelPrefix} - Sudah Sertifikasi`];
              const belum = r[`${labelPrefix} - Belum Sertifikasi`];
              if (sert !== undefined || belum !== undefined) return { sertifikasi: String(sert || ""), belumSertifikasi: String(belum || "") };
              return String(r[flatLabel] || "");
            };
            const nonAsnDetail = (() => {
              const belum = r["Non ASN - Belum Sertifikasi"];
              const inpass = r["Non ASN - Sudah Inpassing"];
              const belumInpass = r["Non ASN - Belum Inpassing"];
              if (belum !== undefined || inpass !== undefined || belumInpass !== undefined) {
                return { belumSertifikasi: String(belum || ""), sudahInpassing: String(inpass || ""), belumInpassing: String(belumInpass || "") };
              }
              return String(r["Non ASN"] || "");
            })();
            const record = {
              id: existing ? existing.id : uid(),
              nsm, madrasah, kabkota, jenjang, mapel, tahunAjaran,
              pnsKemenag: readCat("PNS Kemenag", "PNS Kemenag"), pnsDinas: readCat("PNS Dinas", "PNS Dinas"),
              pppk: readCat("PPPK", "PPPK"), nonAsn: nonAsnDetail,
              kebutuhanManual: String(r["Kebutuhan Guru Berdasar Madrasah"] || ""), catatan: r.Catatan || ""
            };
            nextList = existing ? nextList.map((i) => (i.id === existing.id ? record : i)) : [...nextList, record];
            count += 1;
          });
          setIsianList(nextList);
          setMsg(`Berhasil mengimpor ${count} baris isian dari ${files.length} file.`);
        }
      });
    });
    e.target.value = "";
  };

  return (
    <div className="space-y-4">
      <Card className="p-4 flex flex-wrap items-center gap-3">
        <Field label="Pilih Madrasah">
          <select className={inputCls + " w-96"} value={selected} onChange={(e) => setSelected(e.target.value)}>
            {madrasahOptions.map((m) => <option key={m.key} value={m.key}>{m.madrasah} ({m.jenjang}) — {m.kabkota}{m.nsm ? ` · NSM ${m.nsm}` : ""}</option>)}
          </select>
        </Field>
        <button onClick={() => downloadIsianKebutuhanTemplate(rows, current.madrasah, current.kabkota, current.jenjang)} className="px-3 py-2 text-sm rounded-lg border border-stone-300 hover:bg-stone-50 flex items-center gap-1.5 mt-5"><Icon name="download" size={14} /> Unduh Template Excel</button>
        <label className="px-3 py-2 text-sm rounded-lg border border-stone-300 hover:bg-stone-50 cursor-pointer flex items-center gap-1.5 mt-5">
          <Icon name="upload" size={14} /> Import Excel (bisa banyak file)
          <input type="file" accept=".xlsx,.xls,.csv" multiple className="hidden" onChange={handleImport} />
        </label>
        <button onClick={saveAll} className="px-4 py-2 text-sm rounded-lg bg-[#0B4D3E] text-white hover:bg-[#0d5c4a] mt-5">Simpan Isian</button>
        <button onClick={() => setConfirmClearAll(true)} className="px-4 py-2 text-sm rounded-lg border border-rose-300 text-rose-600 hover:bg-rose-50 mt-5 flex items-center gap-1.5">
          <Icon name="trash" size={14} /> Hapus Semua Isian Madrasah Ini
        </button>
      </Card>

      {confirmClearAll && (
        <div className="p-4 border border-rose-300 bg-rose-50 rounded-lg">
          <p className="text-sm font-semibold text-rose-800 mb-1">Konfirmasi Hapus Semua Isian</p>
          <p className="text-xs text-rose-700 mb-3">
            Semua isian kebutuhan guru untuk <strong>{current.madrasah}</strong> tahun ajaran <strong>{activeYear}</strong> akan dihapus —
            baik yang diisi manual maupun hasil import Excel. Data guru, rombel, dan mapel pilihan tidak ikut terhapus. Tindakan ini tidak bisa dibatalkan.
          </p>
          <div className="flex gap-2">
            <button onClick={() => setConfirmClearAll(false)} className="px-3 py-1.5 text-xs rounded-lg border border-stone-300 hover:bg-stone-50">Batal</button>
            <button onClick={clearAllForMadrasah} className="px-3 py-1.5 text-xs rounded-lg bg-rose-600 text-white hover:bg-rose-700">Ya, Hapus Semua</button>
          </div>
        </div>
      )}

      {importing && <p className="text-xs text-stone-500 flex items-center gap-1.5"><Icon name="loader" size={12} className="animate-spin" /> Mengimpor...</p>}
      {msg && <p className="text-xs text-emerald-700">{msg}</p>}

      {current.jenjang === "MA" && (
        <KatalogPilihanMadrasah target={current} pilihanList={pilihanList} setPilihanList={setPilihanList} />
      )}

      <Card className="p-3 text-xs text-stone-500 flex items-start gap-2">
        <Icon name="info" size={14} className="shrink-0 mt-0.5" />
        <span>Kolom "Guru Ada (EMIS)" hanya pembanding dari Data Guru yang sudah diimpor — <strong>bukan</strong> dasar keputusan.
        Yang menentukan status kekurangan/kelebihan adalah isian manual (PNS Kemenag + PNS Dinas + PPPK + Non ASN) dan "Kebutuhan Berdasar Madrasah" bila diisi.
        Kalau ada peringatan kuning "Kepala Madrasah" di bawah nama mapel, itu tandanya Kepala Madrasah madrasah ini tercatat EMIS dengan mapel tersebut — karena Kepala Madrasah tidak wajib mengajar (PMA 24/2018), <strong>jangan</strong> beliau ikut dimasukkan ke kotak isian mapel itu kecuali memang masih aktif mengajar sukarela.</span>
      </Card>

      <Card className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-stone-50 text-stone-500 text-xs uppercase">
            <tr>
              <th className="text-left px-3 py-2.5 font-medium">Mapel</th>
              <th className="text-right px-2 py-2.5 font-medium">Rombel</th>
              <th className="text-right px-2 py-2.5 font-medium">Total Jam/Mgg</th>
              <th className="text-right px-2 py-2.5 font-medium">Butuh (hitung)</th>
              <th className="text-right px-2 py-2.5 font-medium">EMIS</th>
              <th className="text-right px-2 py-2.5 font-medium w-20">PNS Kmg</th>
              <th className="text-right px-2 py-2.5 font-medium w-20">PNS Dinas</th>
              <th className="text-right px-2 py-2.5 font-medium w-20">PPPK</th>
              <th className="text-right px-2 py-2.5 font-medium w-20">Non ASN</th>
              <th className="text-right px-2 py-2.5 font-medium w-16">JML</th>
              <th className="text-right px-2 py-2.5 font-medium w-24">Butuh (madrasah)</th>
              <th className="text-right px-2 py-2.5 font-medium w-16">+/-</th>
              <th className="text-left px-2 py-2.5 font-medium w-32">Catatan</th>
              <th className="text-center px-2 py-2.5 font-medium">Aksi</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r) => {
              const d = draft[r.mapel] || {};
              const jml = catTotal(r.mapel, "pnsKemenag") + catTotal(r.mapel, "pnsDinas") + catTotal(r.mapel, "pppk") + catTotal(r.mapel, "nonAsn");
              const kebFinal = d.kebutuhanManual !== "" && d.kebutuhanManual !== undefined ? Number(d.kebutuhanManual) : r.kebutuhan;
              const selisih = jml - kebFinal;
              return (
                <React.Fragment key={r.mapel}>
                <tr className="border-t border-stone-100 hover:bg-stone-50/60">
                  <td className="px-3 py-1.5 font-medium text-stone-700">
                    <button type="button" onClick={() => setExpandedMapel(expandedMapel === r.mapel ? null : r.mapel)} className="text-left hover:underline flex items-center gap-1">
                      <span className="text-stone-400 text-[10px]">{expandedMapel === r.mapel ? "▼" : "▶"}</span> {r.mapel}
                    </button>
                    {r.isCluster && <Badge tone="gold">rumpun</Badge>}
                    {(kepalaMadrasahByMapel[norm(r.mapel)] || []).length > 0 && (
                      <p className="text-[10px] text-amber-700 bg-amber-50 border border-amber-200 rounded px-1.5 py-0.5 mt-1 leading-snug max-w-[220px]">
                        ⚠ {kepalaMadrasahByMapel[norm(r.mapel)].map((k) => k.nama).join(", ")} tercatat sebagai <strong>Kepala Madrasah</strong> untuk mapel ini di Data Guru — beliau <strong>tidak wajib mengajar</strong>, jangan ikut dihitung di kotak isian di bawah kecuali memang masih aktif mengajar sukarela.

                  <td className="px-2 py-1.5 text-right text-stone-500">{r.jamMgg}</td>
                  <td className="px-2 py-1.5 text-right text-stone-500">{r.kebutuhan}</td>
                  <td className="px-2 py-1.5 text-right text-stone-400">{r.tersedia}</td>
                  <td className="px-2 py-1.5 text-right text-stone-600" title="Klik ▶ untuk isi rincian sertifikasi/inpassing">{catTotal(r.mapel, "pnsKemenag")}</td>
                  <td className="px-2 py-1.5 text-right text-stone-600" title="Klik ▶ untuk isi rincian sertifikasi/inpassing">{catTotal(r.mapel, "pnsDinas")}</td>
                  <td className="px-2 py-1.5 text-right text-stone-600" title="Klik ▶ untuk isi rincian sertifikasi/inpassing">{catTotal(r.mapel, "pppk")}</td>
                  <td className="px-2 py-1.5 text-right text-stone-600" title="Klik ▶ untuk isi rincian sertifikasi/inpassing">{catTotal(r.mapel, "nonAsn")}</td>
                  <td className="px-2 py-1.5 text-right font-medium text-stone-700">{jml}</td>
                  <td className="px-1 py-1"><input type="number" placeholder={String(r.kebutuhan)} className={inputCls.replace("w-full ", "") + " w-20 text-right"} value={d.kebutuhanManual} onChange={(e) => setField(r.mapel, "kebutuhanManual", e.target.value)} /></td>
                  <td className={`px-2 py-1.5 text-right font-semibold ${selisih < 0 ? "text-rose-600" : selisih > 0 ? "text-amber-600" : "text-emerald-600"}`}>{selisih > 0 ? "+" : ""}{selisih}</td>
                  <td className="px-1 py-1"><input className={inputCls.replace("w-full ", "") + " w-32"} value={d.catatan} onChange={(e) => setField(r.mapel, "catatan", e.target.value)} /></td>
                  <td className="px-2 py-1.5 text-center">
                    <button onClick={() => { if (window.confirm(`Hapus isian "${r.mapel}" untuk ${current.madrasah}?`)) deleteOne(r.mapel); }} className="text-stone-300 hover:text-rose-600 p-1" title="Hapus isian mapel ini"><Icon name="trash" size={14} /></button>
                  </td>
                </tr>
                {expandedMapel === r.mapel && (
                  <tr className="bg-stone-50/70">
                    <td colSpan={14} className="px-6 py-3">
                      {r.breakdown && r.breakdown.length > 0 ? (
                        <table className="text-xs w-full max-w-md">
                          <thead className="text-stone-400">
                            <tr>
                              <th className="text-left font-medium pb-1">Tingkat Kelas</th>
                              <th className="text-right font-medium pb-1">Rombel</th>
                              {!r.isGuruKelas && <th className="text-right font-medium pb-1">Jam/mgu</th>}
                              <th className="text-right font-medium pb-1">Kebutuhan</th>
                            </tr>
                          </thead>
                          <tbody>
                            {r.breakdown.map((b, i) => (
                              <tr key={i} className="border-t border-stone-200">
                                <td className="py-1 text-stone-600">{b.kelas === "_agregat_" ? "Semua Tingkat (agregat)" : `Kelas ${b.kelas}`}</td>
                                <td className="py-1 text-right text-stone-600">{b.rombel}</td>
                                {!r.isGuruKelas && <td className="py-1 text-right text-stone-600">{b.jam}</td>}
                                <td className="py-1 text-right font-medium text-stone-700">{b.kebutuhan}</td>
                              </tr>
                            ))}
                            <tr className="border-t border-stone-300 font-semibold">
                              <td className="py-1 text-stone-700">Total</td>
                              <td className="py-1 text-right text-stone-700">{r.rombel}</td>
                              {!r.isGuruKelas && <td className="py-1 text-right text-stone-700">{r.jamMgg}</td>}
                              <td className="py-1 text-right text-stone-700">{r.kebutuhan}</td>
                            </tr>
                          </tbody>
                        </table>
                      ) : (
                        <p className="text-xs text-stone-400">Belum ada rincian per tingkat kelas — data rombel diisi agregat, bukan per tingkat.</p>
                      )}
                      <div className="mt-3 pt-3 border-t border-stone-200">
                        <p className="text-[11px] font-medium text-stone-500 mb-2">Rincian Status Sertifikasi &amp; Kepegawaian</p>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-2xl">
                          {["pnsKemenag", "pnsDinas", "pppk"].map((cat) => (
                            <div key={cat}>
                              <p className="text-[11px] text-stone-500 mb-1">{{ pnsKemenag: "PNS Kemenag", pnsDinas: "PNS Dinas", pppk: "PPPK" }[cat]}</p>
                              <label className="text-[10px] text-stone-400 block">Sudah Sertifikasi</label>
                              <input type="number" className={inputCls.replace("w-full ", "") + " w-full text-right mb-1"} value={(d[cat] || {}).sertifikasi} onChange={(e) => setSubField(r.mapel, cat, "sertifikasi", e.target.value)} />
                              <label className="text-[10px] text-stone-400 block">Belum Sertifikasi</label>
                              <input type="number" className={inputCls.replace("w-full ", "") + " w-full text-right"} value={(d[cat] || {}).belumSertifikasi} onChange={(e) => setSubField(r.mapel, cat, "belumSertifikasi", e.target.value)} />
                            </div>
                          ))}
                          <div>
                            <p className="text-[11px] text-stone-500 mb-1">Non ASN</p>
                            <label className="text-[10px] text-stone-400 block">Belum Sertifikasi</label>
                            <input type="number" className={inputCls.replace("w-full ", "") + " w-full text-right mb-1"} value={(d.nonAsn || {}).belumSertifikasi} onChange={(e) => setSubField(r.mapel, "nonAsn", "belumSertifikasi", e.target.value)} />
                            <label className="text-[10px] text-stone-400 block">Sudah Sertifikasi + Inpassing</label>
                            <input type="number" className={inputCls.replace("w-full ", "") + " w-full text-right mb-1"} value={(d.nonAsn || {}).sudahInpassing} onChange={(e) => setSubField(r.mapel, "nonAsn", "sudahInpassing", e.target.value)} />
                            <label className="text-[10px] text-stone-400 block">Sudah Sertifikasi, Belum Inpassing</label>
                            <input type="number" className={inputCls.replace("w-full ", "") + " w-full text-right"} value={(d.nonAsn || {}).belumInpassing} onChange={(e) => setSubField(r.mapel, "nonAsn", "belumInpassing", e.target.value)} />
                          </div>
                        </div>
                      </div>
                      {selisih !== 0 && (
                        <div className="mt-3 pt-3 border-t border-stone-200 max-w-xs">
                          <label className="text-[11px] font-medium text-stone-500">Penyebab Utama {selisih < 0 ? "Kekurangan" : "Kelebihan"} Guru</label>
                          <select className={inputCls.replace("w-full ", "") + " w-full mt-1"} value={d.penyebabUtama || ""} onChange={(e) => setField(r.mapel, "penyebabUtama", e.target.value)}>
                            <option value="">— pilih penyebab —</option>
                            {PENYEBAB_LIST.map((p) => <option key={p}>{p}</option>)}
                          </select>
                        </div>
                      )}
                    </td>
                  </tr>
                )}
                </React.Fragment>
              );
            })}
            {rows.length === 0 && <tr><td colSpan={14} className="text-center py-10 text-stone-400 text-sm">Belum ada mapel untuk madrasah ini di tabel JTM.</td></tr>}
          </tbody>
        </table>
      </Card>
    </div>
  );
}

/* ============================== CETAK DOKUMEN RESMI ============================== */
function ProfilForm({ profil, onChange }) {
  const set = (k) => (e) => onChange({ ...profil, [k]: e.target.value });
  return (
    <div className="grid grid-cols-2 gap-x-4">
      <Field label="NSM"><input className={inputCls} value={profil.nsm} onChange={set("nsm")} /></Field>
      <Field label="Jumlah Ruang Belajar"><input className={inputCls} value={profil.jlhRuangBelajar} onChange={set("jlhRuangBelajar")} /></Field>
      <Field label="Jumlah Ruang Keterampilan"><input className={inputCls} value={profil.jlhRuangKeterampilan} onChange={set("jlhRuangKeterampilan")} /></Field>
      <div />
      <Field label="Nama Kepala Madrasah"><input className={inputCls} value={profil.namaKepala} onChange={set("namaKepala")} /></Field>
      <Field label="NIP Kepala Madrasah"><input className={inputCls} value={profil.nipKepala} onChange={set("nipKepala")} /></Field>
      <Field label="Tempat Lahir"><input className={inputCls} value={profil.tempatLahirKepala} onChange={set("tempatLahirKepala")} /></Field>
      <Field label="Tanggal Lahir"><input className={inputCls} placeholder="dd-mm-yyyy" value={profil.tglLahirKepala} onChange={set("tglLahirKepala")} /></Field>
      <Field label="SK Kepala Madrasah"><input className={inputCls} value={profil.skKepala} onChange={set("skKepala")} /></Field>
      <Field label="Tanggal SK"><input className={inputCls} placeholder="dd-mm-yyyy" value={profil.tglSkKepala} onChange={set("tglSkKepala")} /></Field>
      <Field label="Pangkat/Golongan Ruang"><input className={inputCls} value={profil.pangkatKepala} onChange={set("pangkatKepala")} /></Field>
      <Field label="TMT"><input className={inputCls} placeholder="dd-mm-yyyy" value={profil.tmtKepala} onChange={set("tmtKepala")} /></Field>
    </div>
  );
}
const cellStyle = { border: "1px solid #000", padding: "3px 5px", textAlign: "left", verticalAlign: "middle" };
const cellStyleCenter = { border: "1px solid #000", padding: "3px 5px", textAlign: "center", verticalAlign: "middle" };

function CetakTab({ rombelData, guruData, isianList, pilihanList, settings, profilList, setProfilList, lockIdentity }) {
  const madrasahOptionsAll = useMemo(() => {
    const map = {};
    rombelData.forEach((r) => {
      if (!MAPEL_JENJANG_LIST.includes(r.jenjang)) return;
      const key = regKey(r.nsm, r.madrasah, r.kabkota);
      if (!map[key]) map[key] = { key, madrasah: r.madrasah, nsm: r.nsm, kabkota: r.kabkota, jenjang: r.jenjang };
    });
    return Object.values(map).sort((a, b) => a.madrasah.localeCompare(b.madrasah));
  }, [rombelData]);
  const lockKey = lockIdentity ? regKey(lockIdentity.nsm, lockIdentity.madrasah, lockIdentity.kabkota) : null;
  const madrasahOptions = lockKey ? madrasahOptionsAll.filter((m) => m.key === lockKey) : madrasahOptionsAll;

  const [selected, setSelected] = useState(madrasahOptions[0] ? madrasahOptions[0].key : "");
  const current = madrasahOptions.find((m) => m.key === selected);
  const [draftProfil, setDraftProfil] = useState(current ? emptyProfil(current.madrasah, current.kabkota, current.jenjang) : emptyProfil());
  const [showProfilForm, setShowProfilForm] = useState(false);
  const [saved, setSaved] = useState(false);

  useEffect(() => {
    if (!current) return;
    const sp = profilList.find((p) => regKey(p.nsm, p.madrasah, p.kabkota) === current.key && p.jenjang === current.jenjang);
    setDraftProfil(sp || { ...emptyProfil(current.madrasah, current.kabkota, current.jenjang), nsm: current.nsm || "" });
    setShowProfilForm(false);
  }, [selected]);

  if (!current) {
    return (
      <Card className="p-8 text-center">
        <Icon name="printer" size={36} className="mx-auto text-stone-300 mb-3" />
        <p className="text-stone-500 text-sm">Belum ada data rombel untuk madrasah manapun. Lengkapi data di tab Rombel & Siswa terlebih dahulu untuk bisa mencetak dokumen.</p>
      </Card>
    );
  }

  const mapelRows = buildMapelAnalysis(guruData, rombelData, settings, [], pilihanList)
    .filter((r) => regKey(r.nsm, r.madrasah, r.kabkota) === current.key && r.jenjang === current.jenjang)
    .map((r) => {
      const gender = countGuruGender(guruData, current.nsm, current.madrasah, current.kabkota, current.jenjang, r.mapel);
      const jamMgg = r.jamMgg;
      const totalJam = jamMgg * (settings.totalJamFactor || 4);
      const isian = findIsianGuru(isianList, current.nsm, current.madrasah, current.kabkota, current.jenjang, r.mapel);
      const isianHasData = isian && (categoryTotal(isian.pnsKemenag) > 0 || categoryTotal(isian.pnsDinas) > 0 || categoryTotal(isian.pppk) > 0 || categoryTotal(isian.nonAsn) > 0);
      const jmlFinal = isianHasData ? isianJml(isian) : gender.jlh;
      const kebutuhanFinal = isian && isian.kebutuhanManual !== "" && isian.kebutuhanManual !== undefined ? Number(isian.kebutuhanManual) : r.kebutuhan;
      const selisihFinal = jmlFinal - kebutuhanFinal;
      return {
        ...r, gender, jamMgg, totalJam, isian, isianHasData, jmlFinal, kebutuhanFinal,
        kurang: selisihFinal < 0 ? Math.abs(selisihFinal) : 0, lebih: selisihFinal > 0 ? selisihFinal : 0
      };
    });

  const totals = mapelRows.reduce((acc, r) => ({
    jamMgg: acc.jamMgg + r.jamMgg, totalJam: acc.totalJam + r.totalJam,
    lk: acc.lk + r.gender.lk, pr: acc.pr + r.gender.pr, jlh: acc.jlh + r.jmlFinal,
    kebutuhan: acc.kebutuhan + r.kebutuhanFinal, kurang: acc.kurang + r.kurang, lebih: acc.lebih + r.lebih
  }), { jamMgg: 0, totalJam: 0, lk: 0, pr: 0, jlh: 0, kebutuhan: 0, kurang: 0, lebih: 0 });

  const siswaPerKelas = rombelData.filter((r) => regKey(r.nsm, r.madrasah, r.kabkota) === current.key && r.jenjang === current.jenjang && r.kelas);
  const totalSiswa = rombelData.filter((r) => regKey(r.nsm, r.madrasah, r.kabkota) === current.key && r.jenjang === current.jenjang).reduce((s, r) => s + (Number(r.jumlahSiswa) || 0), 0);

  const saveProfil = () => {
    const exists = profilList.some((p) => p.id === draftProfil.id);
    setProfilList(exists ? profilList.map((p) => (p.id === draftProfil.id ? draftProfil : p)) : [...profilList, draftProfil]);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const today = new Date();
  const tanggalCetak = `${today.getDate()} ${["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][today.getMonth()]} ${today.getFullYear()}`;

  return (
    <div className="space-y-4">
      <style>{`
        @media print {
          body * { visibility: hidden; }
          #print-area, #print-area * { visibility: visible; }
          #print-area { position: absolute; left: 0; top: 0; width: 100%; }
          .no-print { display: none !important; }
        }
      `}</style>
      <Card className="p-4 flex flex-wrap items-center gap-3 no-print">
        <Field label="Pilih Madrasah">
          <select className={inputCls + " w-96"} value={selected} onChange={(e) => setSelected(e.target.value)}>
            {madrasahOptions.map((m) => <option key={m.key} value={m.key}>{m.madrasah} ({m.jenjang}) — {m.kabkota}{m.nsm ? ` · NSM ${m.nsm}` : ""}</option>)}
          </select>
        </Field>
        <button onClick={() => setShowProfilForm((s) => !s)} className="px-3 py-2 text-sm rounded-lg border border-stone-300 hover:bg-stone-50 mt-5">{showProfilForm ? "Tutup Form Profil" : "Lengkapi Profil Madrasah"}</button>
        <button onClick={() => window.print()} className="px-3 py-2 text-sm rounded-lg bg-[#0B4D3E] text-white hover:bg-[#0d5c4a] flex items-center gap-1.5 mt-5"><Icon name="printer" size={14} /> Cetak / Simpan PDF</button>
      </Card>
      {showProfilForm && (
        <Card className="p-5 no-print">
          <h3 className="font-semibold mb-1 font-display">Profil Madrasah &amp; Kepala Madrasah</h3>
          <p className="text-xs text-stone-500 mb-4">Data ini hanya untuk kop dokumen cetak, tersimpan di browser ini dan dipakai ulang tiap kali madrasah ini dicetak.</p>
          <ProfilForm profil={draftProfil} onChange={setDraftProfil} />
          <div className="flex items-center gap-3 mt-2 pt-3 border-t border-stone-100">
            <button onClick={saveProfil} className="px-4 py-2 text-sm rounded-lg bg-[#0B4D3E] text-white hover:bg-[#0d5c4a]">Simpan Profil</button>
            {saved && <span className="text-xs text-emerald-700 flex items-center gap-1"><Icon name="check" size={13} /> Tersimpan</span>}
          </div>
        </Card>
      )}
      <Card className="p-0 overflow-hidden">
        <div id="print-area" className="bg-white p-8 text-[11px] leading-snug text-stone-900 mx-auto" style={{ maxWidth: "820px", fontFamily: "Arial, Helvetica, sans-serif" }}>
          <div className="text-right text-[10px] mb-1">Tipe: 1.4</div>
          <h2 className="text-center font-bold text-sm mb-4 uppercase tracking-wide">Daftar Kebutuhan Guru</h2>
          <div className="grid grid-cols-2 gap-x-8 mb-3">
            <table><tbody>
              <tr><td className="pr-2 py-0.5 align-top w-36">Nama Madrasah</td><td className="pr-1">:</td><td className="font-medium">{current.madrasah}</td></tr>
              <tr><td className="pr-2 py-0.5">NSM</td><td className="pr-1">:</td><td>{draftProfil.nsm || "-"}</td></tr>
              <tr><td className="pr-2 py-0.5">Jlh. Ruang Belajar</td><td className="pr-1">:</td><td>{draftProfil.jlhRuangBelajar || "-"}</td></tr>
              <tr><td className="pr-2 py-0.5">Jlh. R. Keterampilan</td><td className="pr-1">:</td><td>{draftProfil.jlhRuangKeterampilan || "-"}</td></tr>
            </tbody></table>
            <table><tbody>
              <tr><td className="pr-2 py-0.5 align-top w-36">Nama Kep. Madrasah</td><td className="pr-1">:</td><td>{draftProfil.namaKepala || "-"}</td></tr>
              <tr><td className="pr-2 py-0.5">Tempat/Tgl. Lahir</td><td className="pr-1">:</td><td>{draftProfil.tempatLahirKepala || "-"}{draftProfil.tglLahirKepala ? ", " + draftProfil.tglLahirKepala : ""}</td></tr>
              <tr><td className="pr-2 py-0.5">NIP</td><td className="pr-1">:</td><td>{draftProfil.nipKepala || "-"}</td></tr>
              <tr><td className="pr-2 py-0.5">SK. Kep. Madrasah</td><td className="pr-1">:</td><td>{draftProfil.skKepala || "-"}</td></tr>
              <tr><td className="pr-2 py-0.5">Tanggal</td><td className="pr-1">:</td><td>{draftProfil.tglSkKepala || "-"}</td></tr>
              <tr><td className="pr-2 py-0.5">Pangk/Gol. Ruang</td><td className="pr-1">:</td><td>{draftProfil.pangkatKepala || "-"}</td></tr>
              <tr><td className="pr-2 py-0.5">TMT</td><td className="pr-1">:</td><td>{draftProfil.tmtKepala || "-"}</td></tr>
            </tbody></table>
          </div>
          <div className="mb-3">
            <p className="font-semibold mb-0.5">Jumlah Siswa Per Kelas:</p>
            {siswaPerKelas.length > 0 ? siswaPerKelas.map((r, i) => <p key={i}>Kelas {r.kelas} : {r.jumlahSiswa} Orang</p>) : <p className="text-stone-400 italic">(rincian per kelas belum diinput — hanya total)</p>}
            <p className="font-medium">Jlh : {totalSiswa} Orang</p>
          </div>
          <table className="w-full border-collapse text-[10px]" style={{ border: "1px solid #000" }}>
            <thead>
              <tr>
                <th rowSpan={2} style={cellStyle}>No</th><th rowSpan={2} style={cellStyle}>Bidang Studi</th>
                <th colSpan={2} style={cellStyle}>Jumlah</th><th colSpan={3} style={cellStyle}>Guru Yang Ada</th>
                <th rowSpan={2} style={cellStyle}>Butuh</th><th rowSpan={2} style={cellStyle}>Kurang</th><th rowSpan={2} style={cellStyle}>Lebih</th><th rowSpan={2} style={cellStyle}>Ket</th>
              </tr>
              <tr>
                <th style={cellStyle}>Rombel</th><th style={cellStyle}>Jam/MGG</th>
                <th style={cellStyle}>Lk</th><th style={cellStyle}>Pr</th><th style={cellStyle}>Jlh</th>
              </tr>
            </thead>
            <tbody>
              {mapelRows.map((r, i) => (
                <tr key={i}>
                  <td style={cellStyleCenter}>{i + 1}</td><td style={cellStyle}>{r.mapel}</td>
                  <td style={cellStyleCenter}>{r.rombel}</td><td style={cellStyleCenter}>{r.jamMgg}</td>
                  <td style={cellStyleCenter}>{r.gender.lk || "-"}</td><td style={cellStyleCenter}>{r.gender.pr || "-"}</td><td style={cellStyleCenter}>{r.jmlFinal || "-"}</td>
                  <td style={cellStyleCenter}>{r.kebutuhanFinal}</td><td style={cellStyleCenter}>{r.kurang || "-"}</td><td style={cellStyleCenter}>{r.lebih || "-"}</td>
                  <td style={cellStyle}></td>
                </tr>
              ))}
              <tr className="font-semibold">
                <td colSpan={2} style={cellStyleCenter}>Jumlah</td><td style={cellStyleCenter}></td><td style={cellStyleCenter}>{totals.jamMgg}</td>
                <td style={cellStyleCenter}>{totals.lk}</td><td style={cellStyleCenter}>{totals.pr}</td><td style={cellStyleCenter}>{totals.jlh}</td>
                <td style={cellStyleCenter}>{totals.kebutuhan}</td><td style={cellStyleCenter}>{totals.kurang}</td><td style={cellStyleCenter}>{totals.lebih}</td><td style={cellStyle}></td>
              </tr>
            </tbody>
          </table>
          <div className="flex justify-end mt-10">
            <div className="text-center text-[11px]">
              <p>{current.kabkota.replace("Kota ", "").replace("Kabupaten ", "")}, {tanggalCetak}</p>
              <p className="mt-1">Kepala Madrasah</p>
              <div style={{ height: 60 }}></div>
              <p className="font-semibold underline">{draftProfil.namaKepala || "___________________"}</p>
              <p>NIP. {draftProfil.nipKepala || "___________________"}</p>
            </div>
          </div>
        </div>
      </Card>
      <p className="text-xs text-stone-400 leading-relaxed no-print">Kolom "Butuh" dihitung per tingkat kelas lalu dijumlahkan agar sesuai cara perhitungan dokumen resmi. Kolom "Jlh" & "Butuh" mengutamakan <strong>Isian Kebutuhan Guru manual</strong> (tab Isian Kebutuhan Guru) bila sudah diisi untuk madrasah ini; kalau belum diisi, dipakai data Data Guru (EMIS) sebagai cadangan. Kolom Lk/Pr tetap dari EMIS, untuk kelengkapan dokumen saja. Klik "Cetak / Simpan PDF" lalu pilih "Save as PDF" di dialog cetak browser untuk menyimpan sebagai file PDF.</p>
    </div>
  );
}

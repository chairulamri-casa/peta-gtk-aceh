function MasterMadrasahTab({ masterList, setMasterList }) {
  const [importing, setImporting] = useState(false);
  const [importMsg, setImportMsg] = useState("");
  const [filterKab, setFilterKab] = useState("");
  const [filterJenjang, setFilterJenjang] = useState("");
  const [filterStatus, setFilterStatus] = useState("");
  const [q, setQ] = useState("");
  const [downloadKab, setDownloadKab] = useState(KABKOTA_LIST[0]);
  const [downloadJenjang, setDownloadJenjang] = useState("");
  const [modal, setModal] = useState(null);
  const saveMaster = (form) => {
    const exists = masterList.some((m) => m.id === form.id);
    setMasterList(exists ? masterList.map((m) => (m.id === form.id ? form : m)) : [...masterList, form]);
    setModal(null);
  };
  const removeMaster = (id) => {
    if (window.confirm("Hapus madrasah ini dari Master Madrasah? Data guru/rombel/tendik yang sudah tercatat untuk madrasah ini tidak ikut terhapus.")) {
      setMasterList(masterList.filter((m) => m.id !== id));
    }
  };

  // Cocokkan lewat NSM (kunci utama madrasah) supaya impor ulang memperbarui data yang sudah ada,
  // bukan selalu bikin ID baru — akreditasi yang sudah dicatat manual tidak ikut tertimpa.
  const MASTER_LOCAL_FIELDS = ["akreditasi", "nilaiAkreditasi", "tanggalSelesaiAkreditasi"];
  const mergeMasterImport = (fullData, importedRows) => {
    const byNsm = new Map();
    fullData.forEach((m) => { if (m.nsm) byNsm.set(m.nsm, m); });
    const matchedIds = new Set();
    let updatedCount = 0, newCount = 0;
    const resultNew = importedRows.map((row) => {
      if (row.nsm && byNsm.has(row.nsm)) {
        const existing = byNsm.get(row.nsm);
        matchedIds.add(existing.id);
        updatedCount++;
        const merged = { ...row, id: existing.id };
        MASTER_LOCAL_FIELDS.forEach((f) => { merged[f] = existing[f]; });
        return merged;
      }
      newCount++;
      return row;
    });
    const untouched = fullData.filter((m) => !matchedIds.has(m.id));
    return { merged: [...untouched, ...resultNew], updatedCount, newCount };
  };

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImporting(true);
    parseSheet(file, (rows) => {
      setImporting(false);
      if (!rows) { setImportMsg("Gagal membaca file. Pastikan format Excel valid."); return; }
      const mapped = rows.map((r) => ({
        id: uid(), npsn: String(r.NPSN || ""), nsm: String(r.NSM || ""), nama: r.Nama || r.nama || "",
        jenjang: normalizeJenjang(r.Jenjang || "MI"), jenisSekolah: r["Jenis Sekolah"] || "", status: r.Status || "Aktif",
        alamat: r.Alamat || "", kabkota: normalizeKabKota(r["Kab/Kota"] || KABKOTA_LIST[0]), provinsi: r.Provinsi || "Aceh",
        akreditasi: AKREDITASI_LIST.find((a) => norm(a) === norm(r.Akreditasi || "")) || "Belum Terakreditasi",
        nilaiAkreditasi: String(r["Nilai Akreditasi"] || ""),
        tanggalSelesaiAkreditasi: r["Masa Berlaku Akreditasi"] || r["Tanggal Selesai Akreditasi"] || ""
      })).filter((r) => r.nama);
      const { merged, updatedCount, newCount } = mergeMasterImport(masterList, mapped);
      setMasterList(merged);
      setImportMsg(`${newCount} madrasah baru ditambahkan, ${updatedCount} yang sudah ada diperbarui (dicocokkan lewat NSM) — akreditasi yang sudah dicatat sebelumnya tidak ikut tertimpa.`);
    });
    e.target.value = "";
  };

  const filtered = masterList.filter((m) =>
    (!filterKab || m.kabkota === filterKab) && (!filterJenjang || m.jenjang === filterJenjang) &&
    (!filterStatus || (filterStatus === "Aktif" ? norm(m.status) === "aktif" : norm(m.status) !== "aktif")) &&
    (!q || m.nama.toLowerCase().includes(q.toLowerCase()) || m.nsm.includes(q) || m.npsn.includes(q))
  );
  const perKabCount = useMemo(() => {
    const map = {};
    masterList.forEach((m) => { map[m.kabkota] = (map[m.kabkota] || 0) + 1; });
    return map;
  }, [masterList]);

  const downloadIsianTemplate = () => {
    const rows = masterList.filter((m) => m.kabkota === downloadKab && (!downloadJenjang || m.jenjang === downloadJenjang) && norm(m.status) === "aktif");
    const data = rows.map((m) => ({ NSM: m.nsm, Madrasah: m.nama, "Kab/Kota": m.kabkota, Jenjang: m.jenjang, Kelas: "", "Jumlah Rombel": "", "Jumlah Siswa": "" }));
    if (data.length === 0) { setImportMsg("Tidak ada madrasah aktif untuk kombinasi kab/kota & jenjang tersebut."); return; }
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Isian");
    XLSX.writeFile(wb, `Isian_Rombel_${downloadKab.replace(/\s+/g, "_")}${downloadJenjang ? "_" + downloadJenjang : ""}.xlsx`);
  };

  return (
    <div className="space-y-4">
      <Card className="p-5">
        <h3 className="font-semibold mb-1 flex items-center gap-2 font-display"><Icon name="sheet" size={16} /> Master Data Madrasah</h3>
        <p className="text-xs text-stone-500 mb-4">Unggah daftar master madrasah (dari EMIS: NPSN, NSM, Nama, Jenjang, Kab/Kota, dst). Data ini jadi acuan NSM + validasi, dan dipakai untuk membuat template isian rombel/siswa yang sudah pre-filled per kab/kota.</p>
        <div className="flex flex-wrap items-center gap-2">
          <label className="px-3 py-2 text-sm rounded-lg border border-stone-300 hover:bg-stone-50 cursor-pointer flex items-center gap-1.5">
            <Icon name="upload" size={14} /> Unggah Master Madrasah (Excel)
            <input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleFile} />
          </label>
          <button onClick={() => setModal("add")} className="px-3 py-2 text-sm rounded-lg bg-[#0B4D3E] text-white hover:bg-[#0d5c4a] flex items-center gap-1.5">
            <Icon name="plus" size={14} /> Tambah Madrasah
          </button>
          <span className="text-xs text-stone-400">{masterList.length > 0 ? `${masterList.length} madrasah termuat` : "Belum ada data master"}</span>
        </div>
        {importing && <p className="text-xs text-stone-500 flex items-center gap-1.5 mt-2"><Icon name="loader" size={12} className="animate-spin" /> Memuat...</p>}
        {importMsg && <p className="text-xs text-emerald-700 mt-2">{importMsg}</p>}
      </Card>
      {masterList.length > 0 && (
        <Card className="p-5">
          <h3 className="font-semibold mb-1 font-display">Unduh Template Isian per Kab/Kota</h3>
          <p className="text-xs text-stone-500 mb-4">NSM &amp; nama madrasah sudah terisi otomatis — kab/kota atau madrasah tinggal mengisi Kelas, Jumlah Rombel, dan Jumlah Siswa, lalu file ini bisa langsung diimpor kembali di tab Rombel &amp; Siswa.</p>
          <div className="flex flex-wrap items-end gap-2">
            <Field label="Kabupaten/Kota">
              <select className={inputCls + " w-56"} value={downloadKab} onChange={(e) => setDownloadKab(e.target.value)}>
                {KABKOTA_LIST.map((k) => <option key={k}>{k} ({perKabCount[k] || 0})</option>)}
              </select>
            </Field>
            <Field label="Jenjang (opsional)">
              <select className={inputCls + " w-32"} value={downloadJenjang} onChange={(e) => setDownloadJenjang(e.target.value)}>
                <option value="">Semua</option>{JENJANG_LIST.map((j) => <option key={j}>{j}</option>)}
              </select>
            </Field>
            <button onClick={downloadIsianTemplate} className="px-4 py-2 text-sm rounded-lg bg-[#0B4D3E] text-white hover:bg-[#0d5c4a] flex items-center gap-1.5"><Icon name="download" size={14} /> Unduh Template Isian</button>
          </div>
        </Card>
      )}
      {masterList.length > 0 && (
        <>
          <Card className="p-4 flex flex-wrap items-center gap-2">
            <div className="relative">
              <span className="absolute left-2.5 top-2.5 text-stone-400"><Icon name="search" size={14} /></span>
              <input placeholder="Cari nama / NSM / NPSN" value={q} onChange={(e) => setQ(e.target.value)} className={inputCls + " pl-8 w-64"} />
            </div>
            <select className={inputCls + " w-44"} value={filterKab} onChange={(e) => setFilterKab(e.target.value)}>
              <option value="">Semua Kab/Kota</option>{KABKOTA_LIST.map((k) => <option key={k}>{k}</option>)}
            </select>
            <select className={inputCls + " w-28"} value={filterJenjang} onChange={(e) => setFilterJenjang(e.target.value)}>
              <option value="">Semua Jenjang</option>{JENJANG_LIST.map((j) => <option key={j}>{j}</option>)}
            </select>
            <select className={inputCls + " w-32"} value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
              <option value="">Semua Status</option>
              <option value="Aktif">Aktif</option>
              <option value="Non-Aktif">Non-Aktif</option>
            </select>
          </Card>
          <Card className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-stone-50 text-stone-500 text-xs uppercase">
                <tr><th className="text-left px-4 py-2.5 font-medium">Nama Madrasah</th><th className="text-left px-4 py-2.5 font-medium">NSM</th><th className="text-left px-4 py-2.5 font-medium">Jenjang</th><th className="text-left px-4 py-2.5 font-medium">Kab/Kota</th><th className="text-left px-4 py-2.5 font-medium">Status</th><th className="text-left px-4 py-2.5 font-medium">Akreditasi</th><th className="text-right px-4 py-2.5 font-medium">Aksi</th></tr>
              </thead>
              <tbody>
                {filtered.slice(0, 300).map((m) => (
                  <tr key={m.id} className="border-t border-stone-100 hover:bg-stone-50/60">
                    <td className="px-4 py-2.5 font-medium text-stone-700">{m.nama}</td>
                    <td className="px-4 py-2.5 text-stone-500">{m.nsm}</td>
                    <td className="px-4 py-2.5"><Badge>{m.jenjang}</Badge></td>
                    <td className="px-4 py-2.5 text-stone-600">{m.kabkota}</td>
                    <td className="px-4 py-2.5">
                      <select
                        value={norm(m.status) === "aktif" ? "Aktif" : "Non-Aktif"}
                        onChange={(e) => setMasterList(masterList.map((x) => (x.id === m.id ? { ...x, status: e.target.value } : x)))}
                        className={`text-xs rounded-lg border px-2 py-1 focus:outline-none ${norm(m.status) === "aktif" ? "border-emerald-200 bg-emerald-50 text-emerald-700" : "border-stone-300 bg-stone-100 text-stone-500"}`}
                      >
                        <option value="Aktif">Aktif</option>
                        <option value="Non-Aktif">Non-Aktif</option>
                      </select>
                    </td>
                    <td className="px-4 py-2.5">
                      <select
                        value={m.akreditasi || "Belum Terakreditasi"}
                        onChange={(e) => setMasterList(masterList.map((x) => (x.id === m.id ? { ...x, akreditasi: e.target.value } : x)))}
                        className="text-xs rounded-lg border border-stone-200 bg-stone-50 text-stone-600 px-2 py-1 focus:outline-none"
                      >
                        {AKREDITASI_LIST.map((a) => <option key={a}>{a}</option>)}
                      </select>
                    </td>
                    <td className="px-4 py-2.5 text-right whitespace-nowrap">
                      <button onClick={() => setModal({ edit: m })} className="text-stone-400 hover:text-[#0B4D3E] p-1"><Icon name="edit" size={14} /></button>
                      <button onClick={() => removeMaster(m.id)} className="text-stone-400 hover:text-rose-600 p-1"><Icon name="trash" size={14} /></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            {filtered.length > 300 && <p className="text-xs text-stone-400 p-3">Menampilkan 300 dari {filtered.length} hasil — gunakan pencarian/filter untuk mempersempit.</p>}
          </Card>
        </>
      )}

      {modal && (
        <Modal title={modal === "add" ? "Tambah Madrasah" : "Edit Madrasah"} onClose={() => setModal(null)}>
          <MasterMadrasahForm initial={modal === "add" ? emptyMasterMadrasah() : modal.edit} onSave={saveMaster} onCancel={() => setModal(null)} />
        </Modal>
      )}
    </div>
  );
}

function LaporanTab({ masterList, guruData, tendikList, pengawasList, analysis, mapelAnalysis, ipg, kompetensiSummary, rekapPenyebab, kebutuhanPengawas, settings, activeYear }) {
  const madrasahAktif = masterList.filter((m) => norm(m.status) !== norm("Non-Aktif"));

  const totalMadrasah = madrasahAktif.length;
  const totalGuru = guruData.length;
  const kualifikasiS1 = guruData.filter((g) => ["S1", "S2", "S3", "D-IV", "D4"].some((k) => norm(g.pendidikan).includes(norm(k)))).length;
  const tendikAktif = tendikList.filter((t) => (t.tahunAjaran || defaultTahunAjaran()) === activeYear && t.statusAktif !== "Non-Aktif");
  const tendikPerJenis = getJenisTendikOptions(tendikList).filter((j) => tendikAktif.some((t) => t.jenisTendik === j)).map((j) => ({ jenis: j, jumlah: tendikAktif.filter((t) => t.jenisTendik === j).length }));
  const pengawasAktif = pengawasList.filter((p) => (p.tahunAjaran || defaultTahunAjaran()) === activeYear && p.statusAktif !== "Non-Aktif");
  const totalKebutuhanGuru = mapelAnalysis.reduce((s, r) => s + r.kebutuhanEfektif, 0);
  const totalTersediaGuru = mapelAnalysis.reduce((s, r) => s + r.tersedia, 0);
  const totalKekuranganGuru = mapelAnalysis.filter((r) => r.status === "kurang").reduce((s, r) => s + Math.abs(r.selisih), 0);
  const totalKelebihanGuru = mapelAnalysis.filter((r) => r.status === "lebih").reduce((s, r) => s + r.selisih, 0);

        <button onClick={() => window.print()} className="px-4 py-2 text-sm rounded-lg bg-[#0B4D3E] text-white hover:bg-[#0d5c4a] flex items-center gap-1.5 shrink-0"><Icon name="printer" size={14} /> Cetak / Simpan PDF</button>
      </Card>
      <div id="laporan-print-area" className="bg-white p-8 rounded-xl border border-stone-200">
        <div className="text-center mb-6 pb-4 border-b-2 border-[#0B4D3E]">

function PetaGeografisMap({ perKab }) {
  const mapDivRef = useRef(null);
  const mapInstanceRef = useRef(null);
  const markersRef = useRef([]);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    if (!window.L || !mapDivRef.current || mapInstanceRef.current) return;
    const map = window.L.map(mapDivRef.current, { scrollWheelZoom: false, attributionControl: true }).setView([4.5, 96.7], 8);
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 12,
    }).addTo(map);
    mapInstanceRef.current = map;
    setReady(true);
    setTimeout(() => map.invalidateSize(), 200);
    return () => { map.remove(); mapInstanceRef.current = null; };
  }, []);

  useEffect(() => {
    const map = mapInstanceRef.current;
    if (!map || !window.L || !ready) return;
    markersRef.current.forEach((m) => map.removeLayer(m));
    markersRef.current = [];
    const colorFor = (status) => (status === "kurang" ? "#be123c" : status === "lebih" ? "#b45309" : "#047857");
    perKab.forEach((k) => {
      const coord = KABKOTA_COORDS[k.kabkota];
      if (!coord) return;
      const radius = Math.max(9, Math.min(30, 9 + k.kurangCount * 2));
      const marker = window.L.circleMarker(coord, {
        radius, color: colorFor(k.status), fillColor: colorFor(k.status), fillOpacity: 0.55, weight: 2,
      }).addTo(map);
      marker.bindTooltip(
        `<div style="font-family:'Plus Jakarta Sans',sans-serif;min-width:170px">
          <strong>${k.kabkota}</strong><br/>
          Status: <strong>${statusLabel[k.status]}</strong><br/>
          Kebutuhan: ${k.kebutuhan} &middot; Tersedia: ${k.tersedia}<br/>
          Selisih: ${k.selisih > 0 ? "+" : ""}${k.selisih}<br/>
          <span style="color:#be123c">${k.kurangCount} mapel kurang</span> &middot; <span style="color:#b45309">${k.lebihCount} mapel lebih</span>
        </div>`,
        { direction: "top", sticky: true }
      );
      markersRef.current.push(marker);
    });
  }, [perKab, ready]);

  return <div ref={mapDivRef} className="w-full rounded-xl border border-stone-200" style={{ height: 440, zIndex: 0 }} />;
}

function TrenTahunanChart({ data }) {
  if (!data || data.length === 0) return <p className="text-sm text-stone-400 py-8 text-center">Belum ada data untuk ditampilkan.</p>;
  const W = 640, H = 220, padL = 40, padR = 16, padT = 16, padB = 30;
  const maxVal = Math.max(1, ...data.map((d) => Math.max(d.kebutuhan, d.tersedia)));
  const stepX = data.length > 1 ? (W - padL - padR) / (data.length - 1) : 0;
  const xFor = (i) => padL + i * stepX;
  const yFor = (v) => padT + (1 - v / maxVal) * (H - padT - padB);
  const lineFor = (key) => data.map((d, i) => `${i === 0 ? "M" : "L"} ${xFor(i)} ${yFor(d[key])}`).join(" ");
  const gridLines = [0, 0.25, 0.5, 0.75, 1];

  return (
    <div className="overflow-x-auto">
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ minWidth: Math.max(400, data.length * 90) }}>
        {gridLines.map((g, i) => (
          <g key={i}>
            <line x1={padL} x2={W - padR} y1={padT + g * (H - padT - padB)} y2={padT + g * (H - padT - padB)} stroke="#f0ede6" strokeWidth="1" />
            <text x={padL - 6} y={padT + g * (H - padT - padB) + 3} textAnchor="end" fontSize="9" fill="#a8a29e">{Math.round(maxVal * (1 - g))}</text>
          </g>
        ))}
        <path d={lineFor("kebutuhan")} fill="none" stroke="#be123c" strokeWidth="2" />
        <path d={lineFor("tersedia")} fill="none" stroke="#0B4D3E" strokeWidth="2" />
        {data.map((d, i) => (
          <g key={i}>
            <circle cx={xFor(i)} cy={yFor(d.kebutuhan)} r="3.5" fill="#be123c" />
            <circle cx={xFor(i)} cy={yFor(d.tersedia)} r="3.5" fill="#0B4D3E" />
            <text x={xFor(i)} y={H - 8} textAnchor="middle" fontSize="10" fill="#78716c">{d.tahun}</text>
          </g>
        ))}
      </svg>
      <div className="flex items-center gap-4 justify-center mt-1 text-xs text-stone-500">
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-[#be123c] inline-block" /> Kebutuhan</span>
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-[#0B4D3E] inline-block" /> Tersedia</span>
      </div>
    </div>
  );
}

function PetaTab({ analysis, mapelAnalysis, guruData, rombelData, isianData, pilihanData, settings }) {
  const [jenjangFilter, setJenjangFilter] = useState("");
  const perKab = useMemo(() => KABKOTA_LIST.map((k) => {
    const rows = mapelAnalysis.filter((r) => r.kabkota === k && (!jenjangFilter || r.jenjang === jenjangFilter));
    const kebutuhan = rows.reduce((s, r) => s + (r.kebutuhanEfektif || 0), 0);
    const tersedia = rows.reduce((s, r) => s + (r.tersedia || 0), 0);
    const kurangCount = rows.filter((r) => r.status === "kurang").length;
    const lebihCount = rows.filter((r) => r.status === "lebih").length;
    let status = "ideal";
    if (kurangCount > lebihCount && kurangCount > 0) status = "kurang";
    else if (lebihCount > kurangCount && lebihCount > 0) status = "lebih";
    return { kabkota: k, kebutuhan, tersedia, selisih: tersedia - kebutuhan, kurangCount, lebihCount, status, totalMapel: rows.length };
  }).sort((a, b) => a.selisih - b.selisih), [mapelAnalysis, jenjangFilter]);

  const tren = useMemo(() => buildTrendPerTahun(guruData, rombelData, isianData, pilihanData, settings), [guruData, rombelData, isianData, pilihanData, settings]);

  return (
    <div className="space-y-4">
      <Card className="p-5">
        <div className="flex items-start justify-between flex-wrap gap-3 mb-1">

/* ============================== DATA SISWA INKLUSI TAB ============================== */
function SiswaInklusiForm({ initial, onSave, onCancel, lockIdentity, masterList, guruData, activeYear }) {
  const [form, setForm] = useState(initial);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const [madrasahText, setMadrasahText] = useState(form.madrasah || "");
  const setFungsional = (key, level) => setForm({ ...form, fungsional: { ...form.fungsional, [key]: level } });
  const toggleKetunaan = (jenis) => {
    const cur = form.jenisKetunaan || [];
    setForm({ ...form, jenisKetunaan: cur.includes(jenis) ? cur.filter((j) => j !== jenis) : [...cur, jenis] });
  };
  const potensiDisabilitas = deteksiKemungkinanDisabilitas(form);

  const guruMadrasahIni = useMemo(() => {
    if (!guruData || !form.nsm) return [];
    return guruData.filter((g) =>
      regKey(g.nsm, g.madrasah, g.kabkota) === regKey(form.nsm, form.madrasah, form.kabkota) &&
      (g.tahunAjaran || defaultTahunAjaran()) === activeYear && g.statusAktif !== "Non-Aktif"
    ).sort((a, b) => a.nama.localeCompare(b.nama));
  }, [guruData, form.nsm, form.madrasah, form.kabkota, activeYear]);
  const [gpkModeManual, setGpkModeManual] = useState(!guruMadrasahIni.some((g) => g.nama === form.namaGPK));

  return (
    <div>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="Nama Lengkap"><input className={inputCls} value={form.nama} onChange={set("nama")} /></Field>
        <Field label="NISN"><input className={inputCls} value={form.nisn} onChange={set("nisn")} /></Field>
        <Field label="NIS Lokal (opsional)"><input className={inputCls} value={form.nisLokal} onChange={set("nisLokal")} /></Field>
        <Field label="Jenis Kelamin">
          <select className={inputCls} value={form.jenisKelamin} onChange={set("jenisKelamin")}>

      {!lockIdentity && (
        <Field label="Madrasah">

            onChangeText={setMadrasahText}

        </Field>
      )}
      {lockIdentity && <p className="text-xs text-stone-400 -mt-1 mb-3">Madrasah: <strong>{lockIdentity.madrasah}</strong></p>}

      <div className="mt-2 pt-3 border-t border-stone-100">
        <p className="text-xs font-semibold text-stone-500 uppercase tracking-wide mb-1">Identifikasi Kesulitan Fungsional</p>
        <p className="text-[11px] text-stone-400 mb-2">Sesuai pendekatan Profil Belajar Siswa (PBS) Kemenag — berbasis kesulitan fungsional, bukan label diagnosis.</p>
        {FUNGSIONAL_DOMAINS.map((d) => (
          <div key={d.key} className="mb-2">
            <label className="block text-xs text-stone-600 mb-1">{d.label}</label>

              {FUNGSIONAL_LEVELS.map((l) => <option key={l}>{l}</option>)}
            </select>
          </div>
        ))}
        {potensiDisabilitas && (
          <p className="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mt-2">
            Berdasarkan isian di atas, siswa ini terindikasi sebagai <strong>Penyandang Disabilitas</strong> yang memerlukan layanan pendukung. Lengkapi bagian di bawah bila memungkinkan.

      <div className="mt-3 pt-3 border-t border-stone-100">
        <p className="text-xs font-semibold text-stone-500 uppercase tracking-wide mb-2">Jenis Ketunaan (opsional — catatan tambahan)</p>

function DataSiswaInklusiTab({ list, lockIdentity, masterList, guruData, activeYear }) {
  const { data, setData } = list;
  const [modal, setModal] = useState(null);
  const [q, setQ] = useState("");
  const [filterKab, setFilterKab] = useState("");
  const [filterJenjang, setFilterJenjang] = useState("");
  const [filterKetunaan, setFilterKetunaan] = useState("");

  const scopedData = useMemo(() => {
    let base = data.filter((r) => (r.tahunAjaran || defaultTahunAjaran()) === activeYear);
    if (lockIdentity) base = base.filter((r) => regKey(r.nsm, r.madrasah, r.kabkota) === regKey(lockIdentity.nsm, lockIdentity.madrasah, lockIdentity.kabkota));
    return base;
  }, [data, lockIdentity, activeYear]);

  const filtered = useMemo(() => scopedData.filter((r) =>
    (!q || r.nama.toLowerCase().includes(q.toLowerCase()) || (r.nisn || "").includes(q)) &&
    (lockIdentity || !filterKab || r.kabkota === filterKab) &&
    (!filterJenjang || r.jenjang === filterJenjang) &&
    (!filterKetunaan || (r.jenisKetunaan || []).includes(filterKetunaan) || (filterKetunaan === "__terindikasi__" && deteksiKemungkinanDisabilitas(r)))
  ), [scopedData, q, filterKab, filterJenjang, filterKetunaan, lockIdentity]);

  const save = (form) => {
    const exists = data.some((d) => d.id === form.id);
    setData(exists ? data.map((d) => (d.id === form.id ? form : d)) : [...data, form]);
    setModal(null);
  };
  const remove = (id) => setData(data.filter((d) => d.id !== id));
  const newEntry = () => {
    const base = emptySiswaInklusi(activeYear);
    if (lockIdentity) return { ...base, nsm: lockIdentity.nsm, madrasah: lockIdentity.madrasah, kabkota: lockIdentity.kabkota, jenjang: lockIdentity.jenjang };
    return base;
  };

  const totalTerindikasi = scopedData.filter((r) => deteksiKemungkinanDisabilitas(r)).length;
  const totalGPK = scopedData.filter((r) => r.didampingiGPK === "Ya").length;

  const doExport = () => exportData(filtered, "data-siswa-inklusi.xlsx", (r) => ({
    Nama: r.nama, NISN: r.nisn, "NIS Lokal": r.nisLokal, "Jenis Kelamin": r.jenisKelamin, "Tanggal Lahir": r.tanggalLahir,
    Madrasah: r.madrasah, "Kab/Kota": r.kabkota, Jenjang: r.jenjang, Kelas: r.kelas,
    "Terindikasi Disabilitas": deteksiKemungkinanDisabilitas(r) ? "Ya" : "Belum Terindikasi",
    "Jenis Ketunaan (opsional)": (r.jenisKetunaan || []).join(", "),
    "Didampingi GPK": r.didampingiGPK, "Nama GPK": r.namaGPK, "Alat Bantu": r.alatBantu,
    "Sumber Asesmen": r.sumberAsesmen, Status: r.statusAktif,
  }));

  return (
    <div className="space-y-4">
      <Card className="p-5">
        <div className="flex items-start justify-between flex-wrap gap-3 mb-1">
          <div>
            <h3 className="font-semibold font-display flex items-center gap-2"><Icon name="heart" size={16} /> Data Siswa Inklusi</h3>
            <p className="text-xs text-stone-500 mt-1 max-w-2xl">Pendataan mengikuti pendekatan <strong>Profil Belajar Siswa (PBS)</strong> Kemenag — berbasis kesulitan fungsional (UU 8/2016, PP 13/2020, PMA 1/2024), bukan sekadar label diagnosis. Data ini bersifat sensitif — akses dibatasi sesuai peran (madrasah hanya lihat siswanya sendiri).</p>
          </div>
          <button onClick={() => setModal({ add: newEntry() })} className="px-3 py-2 text-sm rounded-lg bg-[#0B4D3E] text-white hover:bg-[#0d5c4a] flex items-center gap-1.5 shrink-0"><Icon name="plus" size={14} /> Tambah Siswa</button>
        </div>
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-4">
          <div className="border border-stone-200 rounded-lg p-3"><p className="text-[10px] uppercase text-stone-400 font-medium">Total Tercatat</p><p className="text-xl font-semibold text-stone-800 font-display">{scopedData.length}</p></div>
          <div className="border border-stone-200 rounded-lg p-3"><p className="text-[10px] uppercase text-amber-600 font-medium">Terindikasi Disabilitas</p><p className="text-xl font-semibold text-amber-700 font-display">{totalTerindikasi}</p></div>
          <div className="border border-stone-200 rounded-lg p-3"><p className="text-[10px] uppercase text-emerald-600 font-medium">Didampingi GPK</p><p className="text-xl font-semibold text-emerald-700 font-display">{totalGPK}</p></div>

      </Card>

      <Card className="p-4">

            <input placeholder="Cari nama / NISN" value={q} onChange={(e) => setQ(e.target.value)} className={inputCls + " pl-8 w-52"} />

          {!lockIdentity && (
            <select className={inputCls + " w-44"} value={filterKab} onChange={(e) => setFilterKab(e.target.value)}>

            <option value="">Semua Jenis Ketunaan</option>

        </div>
      </Card>

      <Card className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-stone-50 text-stone-500 text-xs uppercase">
            <tr>
              <th className="text-left px-4 py-2.5 font-medium">Nama</th>
              <th className="text-left px-4 py-2.5 font-medium">Madrasah</th>
              <th className="text-left px-4 py-2.5 font-medium">Kelas</th>
              <th className="text-left px-4 py-2.5 font-medium">Indikasi</th>
              <th className="text-left px-4 py-2.5 font-medium">GPK</th>
              <th className="text-right px-4 py-2.5 font-medium">Aksi</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map((s) => (
              <tr key={s.id} className="border-t border-stone-100 hover:bg-stone-50/60">
                <td className="px-4 py-2.5">
                  <p className="font-medium text-stone-700">{s.nama} {s.statusAktif === "Non-Aktif" && <Badge tone="bad">Non-Aktif</Badge>}</p>
                  <p className="text-xs text-stone-400">{s.nisn || "NISN belum diisi"}</p>
                </td>
                <td className="px-4 py-2.5 text-stone-600">{s.madrasah}<p className="text-xs text-stone-400">{s.kabkota} · {s.jenjang}</p></td>
                <td className="px-4 py-2.5 text-stone-600">{s.kelas || "-"}</td>
                <td className="px-4 py-2.5">
                  {deteksiKemungkinanDisabilitas(s) ? <Badge tone="warn">Terindikasi</Badge> : <Badge>Belum Terindikasi</Badge>}
                  {(s.jenisKetunaan || []).length > 0 && <p className="text-[10px] text-stone-400 mt-0.5">{s.jenisKetunaan.join(", ")}</p>}
                </td>
                <td className="px-4 py-2.5">{s.didampingiGPK === "Ya" ? <Badge tone="good">Ya{s.namaGPK ? " — " + s.namaGPK : ""}</Badge> : <span className="text-stone-400 text-xs">Belum</span>}</td>
                <td className="px-4 py-2.5 text-right whitespace-nowrap">
                  <button onClick={() => setModal({ edit: s })} className="text-stone-400 hover:text-[#0B4D3E] p-1"><Icon name="edit" size={14} /></button>
                  <button onClick={() => remove(s.id)} className="text-stone-400 hover:text-rose-600 p-1"><Icon name="trash" size={14} /></button>
                </td>
              </tr>
            ))}
            {filtered.length === 0 && <tr><td colSpan={6} className="text-center py-10 text-stone-400 text-sm">Belum ada data siswa inklusi{q || filterKab || filterJenjang || filterKetunaan ? " yang cocok dengan filter." : "."}</td></tr>}
          </tbody>
        </table>
      </Card>

      {modal && (
        <Modal title={modal.add ? "Tambah Siswa Inklusi" : "Edit Data Siswa Inklusi"} onClose={() => setModal(null)} wide>
          <SiswaInklusiForm initial={modal.add || modal.edit} onSave={save} onCancel={() => setModal(null)} lockIdentity={lockIdentity} masterList={masterList} guruData={guruData} activeYear={activeYear} />
        </Modal>
      )}
    </div>
  );
}

function KelasJtmEditor({ table, onChange }) {
  const [newMapel, setNewMapel] = useState("");
  const entries = Object.entries(table || {});
  const rowInputCls = inputCls.replace("w-full ", "");
  const updateJtm = (mapel, v) => onChange({ ...table, [mapel]: v === "" ? 0 : Number(v) });
  const removeMapel = (mapel) => { const next = { ...table }; delete next[mapel]; onChange(next); };
  const addMapel = () => {
    const name = newMapel.trim();
    if (!name || Object.keys(table || {}).some((m) => norm(m) === norm(name))) return;
    onChange({ ...table, [name]: 2 });
    setNewMapel("");
  };
  const renameMapel = (oldKey, e) => {
    const newKey = e.target.value.trim();
    if (!newKey || newKey === oldKey || Object.keys(table || {}).some((m) => norm(m) === norm(newKey))) {
      e.target.value = oldKey;
      return;
    }
    const next = {};
    Object.entries(table).forEach(([k, v]) => { next[k === oldKey ? newKey : k] = v; });

function BackupRestoreCard({ guruList, rombelList, isianList, masterList, profilList, tendikList, pilihanList, pengawasList, siswaInklusiList, settings }) {
  const [lastBackup, setLastBackup] = useState(null);
  const [restoring, setRestoring] = useState(false);
  const [msg, setMsg] = useState("");
  const [confirmFile, setConfirmFile] = useState(null);
  const daysSince = lastBackup ? Math.floor((Date.now() - new Date(lastBackup).getTime()) / 86400000) : null;

  const downloadBackup = () => {
    const payload = {
      appName: "PETA-GTK Aceh", exportedAt: new Date().toISOString(), version: 1,
      guru: guruList.data, rombel: rombelList.data, isianGuru: isianList.data,
      masterMadrasah: masterList.data, profilMadrasah: profilList.data, tendik: tendikList.data,
      pilihanMapel: pilihanList.data, pengawas: pengawasList.data, siswaInklusi: siswaInklusiList.data, settings
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const tanggal = new Date().toISOString().slice(0, 10);
    a.href = url; a.download = `Cadangan_PETA-GTK-Aceh_${tanggal}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setLastBackup(new Date().toISOString());
    setMsg("Cadangan JSON berhasil diunduh.");
    setTimeout(() => setMsg(""), 3000);
  };

  const flattenForExcel = (row) => {
    const out = {};
    Object.entries(row || {}).forEach(([k, v]) => {
      out[k] = (v !== null && typeof v === "object") ? JSON.stringify(v) : v;
    });
    return out;
  };
  const downloadBackupExcel = () => {
    const wb = XLSX.utils.book_new();
    const sheets = [
      ["Guru", guruList.data], ["Tendik", tendikList.data], ["Pengawas", pengawasList.data],
      ["Rombel", rombelList.data], ["Master Madrasah", masterList.data], ["Profil Madrasah", profilList.data],
      ["Isian Kebutuhan", isianList.data], ["Mapel Pilihan", pilihanList.data], ["Siswa Inklusi", siswaInklusiList.data],
    ];
    sheets.forEach(([name, rows]) => {
      const ws = XLSX.utils.json_to_sheet((rows && rows.length ? rows : [{}]).map(flattenForExcel));
      XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
    });
    const wsSettings = XLSX.utils.json_to_sheet([flattenForExcel(settings)]);
    XLSX.utils.book_append_sheet(wb, wsSettings, "Pengaturan");
    const tanggal = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `Cadangan_PETA-GTK-Aceh_${tanggal}.xlsx`);
    setLastBackup(new Date().toISOString());
    setMsg("Cadangan Excel berhasil diunduh (1 file, tiap tabel jadi sheet terpisah).");
    setTimeout(() => setMsg(""), 4000);
  };

  const handlePickFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed || parsed.appName !== "PETA-GTK Aceh") { setMsg("File ini bukan file cadangan PETA-GTK Aceh yang valid."); return; }
        setConfirmFile(parsed);
      } catch { setMsg("Gagal membaca file — pastikan file cadangan (.json) tidak rusak."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const doRestore = () => {
    if (!confirmFile) return;
    setRestoring(true);
    guruList.setData(confirmFile.guru || []);
    rombelList.setData(confirmFile.rombel || []);
    isianList.setData(confirmFile.isianGuru || []);
    masterList.setData(confirmFile.masterMadrasah || []);
    profilList.setData(confirmFile.profilMadrasah || []);
    tendikList.setData(confirmFile.tendik || []);
    pilihanList.setData(confirmFile.pilihanMapel || []);
    pengawasList.setData(confirmFile.pengawas || []);
    siswaInklusiList.setData(confirmFile.siswaInklusi || []);
    setRestoring(false);
    setConfirmFile(null);
    setMsg("Pemulihan selesai — semua data sudah diganti dari file cadangan.");
  };

  return (
    <Card className="p-5 border-amber-200">
      <h3 className="font-semibold mb-1 flex items-center gap-2 font-display"><Icon name="download" size={16} /> Cadangan &amp; Pemulihan Data</h3>
      <p className="text-xs text-stone-500 mb-4">Data tersimpan online di Supabase — bisa diakses dari perangkat mana pun. Tetap disarankan unduh cadangan secara berkala sebagai arsip/jaga-jaga.</p>
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <button onClick={downloadBackup} className="px-4 py-2 text-sm rounded-lg bg-[#0B4D3E] text-white hover:bg-[#0d5c4a] flex items-center gap-1.5"><Icon name="download" size={14} /> Unduh Cadangan (JSON — untuk Pulihkan)</button>
        <button onClick={downloadBackupExcel} className="px-4 py-2 text-sm rounded-lg border border-stone-300 hover:bg-stone-50 flex items-center gap-1.5"><Icon name="download" size={14} /> Unduh Cadangan (Excel — untuk dibaca manual)</button>
        <label className="px-4 py-2 text-sm rounded-lg border border-stone-300 hover:bg-stone-50 cursor-pointer flex items-center gap-1.5">
          <Icon name="upload" size={14} /> Pulihkan dari File Cadangan (JSON)
          <input type="file" accept=".json" className="hidden" onChange={handlePickFile} />
        </label>
      </div>
      <p className="text-xs text-stone-500">
        Terakhir diunduh: {lastBackup ? new Date(lastBackup).toLocaleString("id-ID") : "belum pernah"}
        {daysSince !== null && daysSince >= 7 && <Badge tone="warn"> Sudah {daysSince} hari — sebaiknya unduh cadangan baru</Badge>}
      </p>
      {msg && <p className="text-xs text-emerald-700 mt-2">{msg}</p>}
      {confirmFile && (
        <div className="mt-4 p-4 border border-rose-300 bg-rose-50 rounded-lg">
          <p className="text-sm font-semibold text-rose-800 mb-1">Konfirmasi Pemulihan</p>
          <p className="text-xs text-rose-700 mb-1">
            File cadangan tanggal <strong>{confirmFile.exportedAt ? new Date(confirmFile.exportedAt).toLocaleString("id-ID") : "tidak diketahui"}</strong> berisi:
            {" "}{(confirmFile.guru || []).length} data guru, {(confirmFile.rombel || []).length} baris rombel, {(confirmFile.isianGuru || []).length} isian kebutuhan, {(confirmFile.masterMadrasah || []).length} master madrasah, {(confirmFile.siswaInklusi || []).length} siswa inklusi.
          </p>
          <p className="text-xs text-rose-700 mb-3"><strong>Semua data yang ada sekarang akan digantikan sepenuhnya</strong> oleh isi file ini. Tindakan ini tidak bisa dibatalkan.</p>
          <div className="flex gap-2">
            <button onClick={() => setConfirmFile(null)} className="px-3 py-1.5 text-xs rounded-lg border border-stone-300 hover:bg-stone-50">Batal</button>
            <button onClick={doRestore} disabled={restoring} className="px-3 py-1.5 text-xs rounded-lg bg-rose-600 text-white hover:bg-rose-700 disabled:opacity-50">{restoring ? "Memulihkan..." : "Ya, Timpa Semua Data Sekarang"}</button>
          </div>
        </div>
      )}
    </Card>
  );
}
function nextTahunAjaran(current) {

      <h3 className="font-semibold mb-1 font-display text-rose-700 flex items-center gap-2"><Icon name="trash" size={16} /> Bersihkan Data</h3>
      <p className="text-xs text-stone-500 mb-4">
        Menghapus data <strong>langsung dari server (Supabase)</strong>, berlaku untuk <strong>semua tahun ajaran</strong> pada kategori yang dipilih —
        bukan cuma tampilan di perangkat ini. Cocok dipakai untuk membersihkan data uji coba/salah impor sebelum data sungguhan mulai dipakai luas.
        <span className="text-rose-600 font-medium"> Tindakan ini tidak bisa dibatalkan.</span>
      </p>
      <div className="grid grid-cols-2 gap-2 mb-4">
        {CATEGORIES.map((c) => (
          <label key={c.key} className="flex items-center gap-2 text-sm text-stone-600 border border-stone-200 rounded-lg px-3 py-2 cursor-pointer hover:bg-stone-50">
            <input type="checkbox" checked={!!selected[c.key]} onChange={() => toggle(c.key)} />
            {c.label} <span className="text-xs text-stone-400 ml-auto">({c.list.data.length})</span>
          </label>
        ))}
      </div>
      {anySelected && (
        <div className="bg-rose-50 border border-rose-200 rounded-lg p-3 mb-3">
          <p className="text-xs text-rose-800 mb-2">
            Akan menghapus permanen: <strong>{selectedLabels.join(", ")}</strong>. Ketik <strong>HAPUS</strong> di bawah untuk mengaktifkan tombol konfirmasi.
          </p>
          <input className={inputCls + " max-w-[200px]"} value={confirmText} onChange={(e) => setConfirmText(e.target.value)} placeholder="Ketik HAPUS" />
        </div>
      )}
      <button
        onClick={doClear}
        disabled={!anySelected || confirmText.trim().toUpperCase() !== "HAPUS"}
        className="px-4 py-2 text-sm rounded-lg bg-rose-600 text-white hover:bg-rose-700 disabled:opacity-40 disabled:cursor-not-allowed"
      >Hapus Data Terpilih</button>
      {msg && <p className="text-xs text-emerald-700 mt-3">{msg}</p>}
    </Card>
  );
}

function PengaturanTab({ settings, onSave, guruList, rombelList, isianList, masterList, profilList, tendikList, pilihanList, pengawasList, siswaInklusiList, setViewYear }) {
  const [form, setForm] = useState(settings);
  const [saved, setSaved] = useState(false);
  const [activeJenjang, setActiveJenjang] = useState("MI");
  const setRasio = (j, v) => setForm({ ...form, idealRasio: { ...form.idealRasio, [j]: Number(v) } });
  const setTargetIPG = (j, v) => setForm({ ...form, targetIPG: { ...(form.targetIPG || {}), [j]: v } });
  const setJtmTable = (jenjang, table) => setForm({ ...form, jtmMapel: { ...form.jtmMapel, [jenjang]: table } });
  const handleSave = () => { onSave(form); setSaved(true); setTimeout(() => setSaved(false), 2000); };

  return (
    <div className="max-w-3xl space-y-4">
      <TahunAjaranCard form={form} setForm={setForm} onSave={onSave} guruList={guruList} setViewYear={setViewYear} />
      <Card className="p-5">
        <h3 className="font-semibold mb-1 font-display">Rasio Ideal Siswa per Guru</h3>
        <p className="text-xs text-stone-500 mb-4">Digunakan sebagai acuan perhitungan status kekurangan/kelebihan guru per jenjang (analisis beban kerja umum).</p>
        <div className="grid grid-cols-2 gap-4">
          {JENJANG_LIST.map((j) => (
            <Field key={j} label={`Jenjang ${j}`}>
              <div className="flex items-center gap-2"><span className="text-sm text-stone-400">1 :</span><input type="number" className={inputCls} value={form.idealRasio[j]} onChange={(e) => setRasio(j, e.target.value)} /></div>
            </Field>
          ))}
        </div>
      </Card>
      <Card className="p-5">
        <h3 className="font-semibold mb-1 font-display">Target Indeks Pemerataan Guru (IPG)</h3>
        <p className="text-xs text-stone-500 mb-4">Target kebijakan yang ditetapkan Kanwil untuk tahun berjalan (bukan hasil hitung otomatis) — dibandingkan dengan IPG aktual di tab Analisis Beban Kerja.</p>
        <div className="grid grid-cols-3 gap-4">
          {MAPEL_JENJANG_LIST.map((j) => (
            <Field key={j} label={`Jenjang ${j}`}>
              <input type="number" step="0.01" min="0" max="1" placeholder="cth. 0.20" className={inputCls} value={(form.targetIPG && form.targetIPG[j]) || ""} onChange={(e) => setTargetIPG(j, e.target.value)} />
            </Field>
          ))}
        </div>
      </Card>
      <Card className="p-5">
        <h3 className="font-semibold mb-1 font-display">Target Guru yang Ditingkatkan Kompetensinya</h3>
        <p className="text-xs text-stone-500 mb-4">Target jumlah atau persentase guru yang mengikuti peningkatan kompetensi (Bimtek/Diklat/PPG/dst.) tahun ini — kebijakan Kanwil, dibandingkan dengan realisasi di tab Analisis Beban Kerja.</p>
        <Field label="Target (boleh diisi angka atau persentase, mis. '500' atau '30%')">
          <input className={inputCls + " max-w-[220px]"} value={form.targetKompetensiGuru || ""} onChange={(e) => setForm({ ...form, targetKompetensiGuru: e.target.value })} />
        </Field>
      </Card>
      <Card className="p-5">
        <h3 className="font-semibold mb-1 font-display">Ambang Batas Toleransi</h3>
        <p className="text-xs text-stone-500 mb-4">Persentase penyimpangan dari rasio ideal sebelum ditandai kekurangan/kelebihan.</p>
        <div className="grid grid-cols-2 gap-4">
          <Field label="Ambang Kekurangan (%)"><input type="number" className={inputCls} value={Math.round(form.ambangKurang * 100)} onChange={(e) => setForm({ ...form, ambangKurang: Number(e.target.value) / 100 })} /></Field>
          <Field label="Ambang Kelebihan (%)"><input type="number" className={inputCls} value={Math.round(form.ambangLebih * 100)} onChange={(e) => setForm({ ...form, ambangLebih: Number(e.target.value) / 100 })} /></Field>
        </div>
      </Card>
      <Card className="p-5">
        <h3 className="font-semibold mb-1 flex items-center gap-2 font-display"><Icon name="book" size={16} /> Jam Tatap Muka (JTM) per Mata Pelajaran</h3>
        <p className="text-xs text-stone-500 mb-4">Dasar perhitungan tab "Kebutuhan per Mapel" dan alat cek mutasi. Angka = <strong>Total JP per minggu</strong> (intrakurikuler + kokurikuler digabung) sesuai struktur kurikulum resmi KMA 1503/2025, per tingkat kelas — sengaja tidak seragam antar tingkat karena memang begitu aturannya. Klik nama mapel untuk mengubah namanya, supaya cocok otomatis saat import EMIS.</p>
        <Field label="Beban Wajib Mengajar Guru (jam/minggu)">
          <input type="number" className={inputCls + " max-w-[140px]"} value={form.bebanWajib} onChange={(e) => setForm({ ...form, bebanWajib: Number(e.target.value) })} />
        </Field>
        <Field label="Usia Pensiun Guru (tahun) — dasar Proyeksi Pensiun">
          <input type="number" className={inputCls + " max-w-[140px]"} value={form.usiaPensiun || 60} onChange={(e) => setForm({ ...form, usiaPensiun: Number(e.target.value) })} />
        </Field>
        <Field label="Faktor Pengali Kolom 'Total Jam' pada Dokumen Cetak">
          <input type="number" className={inputCls + " max-w-[140px]"} value={form.totalJamFactor} onChange={(e) => setForm({ ...form, totalJamFactor: Number(e.target.value) })} />
        </Field>
        <div className="mt-2 pt-3 border-t border-stone-100">
          <div className="flex gap-2 mb-3">
            {MAPEL_JENJANG_LIST.map((j) => (
              <button key={j} onClick={() => setActiveJenjang(j)} className={`px-4 py-2 text-sm font-medium rounded-lg transition-colors ${activeJenjang === j ? "bg-[#0B4D3E] text-white" : "bg-stone-100 text-stone-600 hover:bg-stone-200"}`}>{j}</button>
            ))}
          </div>
          <JtmJenjangPanel jenjang={activeJenjang} jenjangTable={form.jtmMapel[activeJenjang]} onChange={(t) => setJtmTable(activeJenjang, t)} />
        </div>
      </Card>
      <BackupRestoreCard guruList={guruList} rombelList={rombelList} isianList={isianList} masterList={masterList} profilList={profilList} tendikList={tendikList} pilihanList={pilihanList} pengawasList={pengawasList} siswaInklusiList={siswaInklusiList} settings={settings} />
      <BersihkanDataCard guruList={guruList} rombelList={rombelList} isianList={isianList} masterList={masterList} profilList={profilList} tendikList={tendikList} pilihanList={pilihanList} pengawasList={pengawasList} />
      <div className="flex items-center gap-3">
        <button onClick={handleSave} className="px-4 py-2 text-sm rounded-lg bg-[#0B4D3E] text-white hover:bg-[#0d5c4a]">Simpan Pengaturan</button>
        {saved && <span className="text-xs text-emerald-700 flex items-center gap-1"><Icon name="check" size={13} /> Tersimpan</span>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  // Terjemahkan kode JSX di atas secara EKSPLISIT dengan mode "classic" — dikunci supaya
  // tidak bergantung pada perilaku default Babel versi terbaru yang bisa berubah sewaktu-waktu
  // (versi baru sempat mengubah default ke mode "automatic" yang menghasilkan kode tidak kompatibel
  // dengan cara file offline ini dijalankan langsung di browser).
  (function () {
    // Kalau salah satu skrip dari internet (React/Babel/dst) gagal termuat — biasanya karena
    // koneksi internet putus-nyambung saat halaman dibuka — tampilkan pesan jelas, bukan halaman kosong.
    if (typeof Babel === "undefined" || typeof React === "undefined" || typeof ReactDOM === "undefined") {
      document.getElementById("root").innerHTML =
        '<div style="max-width:420px;margin:60px auto;padding:24px;text-align:center;font-family:sans-serif;color:#57534e;">' +
        '<p style="font-size:15px;font-weight:600;margin-bottom:8px;">Gagal memuat komponen aplikasi</p>' +
        '<p style="font-size:13px;line-height:1.5;">Ini biasanya karena koneksi internet terputus sesaat saat halaman dibuka ' +
        '(aplikasi ini perlu memuat beberapa komponen dari internet setiap kali dibuka). ' +
        'Coba periksa koneksi internet, lalu muat ulang halaman ini.</p>' +
        '<button onclick="location.reload()" style="margin-top:14px;padding:8px 20px;background:#0B4D3E;color:white;border:none;border-radius:8px;font-size:13px;">Muat Ulang</button>' +
        '</div>';
      return;
    }
    var source = document.getElementById("app-source").textContent;
    var output = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]]
    }).code;
    var script = document.createElement("script");
    script.textContent = output;
    document.body.appendChild(script);
  })();
</script>

// Koleksi data (guru, rombel, madrasah, dst) — SATU BARIS PER RECORD, bukan satu baris berisi
// seluruh daftar. Ini penting supaya dua orang yang menyimpan data BERBEDA di waktu bersamaan
// tidak pernah saling menimpa — masing-masing hanya menyentuh barisnya sendiri.
// PENTING: Supabase (PostgREST) secara default HANYA mengirim maksimal 1000 baris per
// permintaan, walau datanya jauh lebih banyak — tidak ada error, cuma diam-diam terpotong.
// Fungsi ini "meminta lanjutannya" berulang (pakai header Range) sampai semua baris terambil.
async function supabaseFetchAll(table) {
  const pageSize = 1000;
  let allRows = [];
  let from = 0;
  while (true) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=id,data&order=id`, {
      headers: { ...authHeaders(), Range: `${from}-${from + pageSize - 1}` }
    });
    if (!res.ok) throw new Error(`Gagal memuat "${table}" (${res.status})`);
    const rows = await res.json();
    allRows = allRows.concat(rows);
    if (rows.length < pageSize) break; // halaman terakhir — sudah tidak ada lagi
    from += pageSize;
  }
  return allRows.map((r) => r.data);
}
// Dikirim bertahap (per 500 baris), bukan sekaligus 29.000 dalam satu permintaan — supaya
// tidak kena batas ukuran permintaan dan supaya lebih tahan kalau koneksi sempat terputus
// di tengah jalan (yang sudah terkirim tetap tersimpan, tidak perlu ulang dari nol).
async function supabaseUpsertRows(table, records) {
  if (!records.length) return;
  const CHUNK_SIZE = 500;
  for (let i = 0; i < records.length; i += CHUNK_SIZE) {
    const chunk = records.slice(i, i + CHUNK_SIZE);
    const rows = chunk.map((r) => ({ id: String(r.id), data: r, updated_at: new Date().toISOString() }));
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=id`, {
      method: "POST",
      headers: { ...authHeaders(), "Content-Type": "application/json", Prefer: "resolution=merge-duplicates" },
      body: JSON.stringify(rows)
    });
    if (!res.ok) throw new Error(`Gagal menyimpan ke "${table}" (${res.status}) pada baris ke-${i + 1} sampai ${i + chunk.length}`);
  }
}
// Dipecah per 200 ID setiap permintaan hapus — daftar ID yang sangat panjang (ribuan) bisa
// membuat alamat permintaannya kepanjangan dan ditolak server kalau dikirim sekaligus.
async function supabaseDeleteRows(table, ids) {
  if (!ids.length) return;
  const CHUNK_SIZE = 200;
  for (let i = 0; i < ids.length; i += CHUNK_SIZE) {
    const chunk = ids.slice(i, i + CHUNK_SIZE).map((id) => String(id)).join(",");
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=in.(${chunk})`, { method: "DELETE", headers: authHeaders() });
    if (!res.ok) throw new Error(`Gagal menghapus di "${table}" (${res.status})`);
  }
}

// Menggantikan useLocalList — setiap record punya barisnya sendiri di Supabase. setData(array)
// membandingkan dengan data sebelumnya, lalu HANYA mengirim record yang benar-benar berubah/baru
// (upsert) dan yang dihapus (delete) — bukan menulis ulang seluruh daftar setiap kali.
function useSupabaseTable(table) {
  const [data, setDataState] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [retryTick, setRetryTick] = useState(0);
  const prevRef = useRef([]);

  useEffect(() => {
    let mounted = true;
    setLoading(true);
    (async () => {
      try {
        const records = await supabaseFetchAll(table);
        if (mounted) { setDataState(records); prevRef.current = records; setError(null); }
      } catch (e) {
        console.error("Gagal memuat dari Supabase:", table, e);
        if (mounted) setError(e.message);
      } finally {
        if (mounted) setLoading(false);
      }
    })();
    return () => { mounted = false; };
  }, [table, retryTick]);
  const refetch = useCallback(() => setRetryTick((t) => t + 1), []);

  // Setiap record yang KONTENnya benar-benar berubah (bukan cuma stempel lama) otomatis dibubuhi
  // "siapa mengubah, kapan" — terpusat di sini supaya berlaku ke semua tab tanpa perlu diulang
  // di tiap form. Record yang tidak berubah tetap mempertahankan stempel lamanya.
  const setData = useCallback((next) => {
    const prev = prevRef.current;
    const prevMap = new Map(prev.map((r) => [String(r.id), r]));
    const nextIds = new Set(next.map((r) => String(r.id)));

    const toUpsert = [];
    const stamped = next.map((r) => {
      const old = prevMap.get(String(r.id));
      const { _lastModifiedBy: obOld, _lastModifiedAt: oaOld, ...oldRest } = old || {};
      const { _lastModifiedBy: obNew, _lastModifiedAt: oaNew, ...newRest } = r;
      const contentChanged = !old || JSON.stringify(oldRest) !== JSON.stringify(newRest);
      if (!contentChanged) return r;
      const record = { ...r, _lastModifiedBy: currentIdentityLabel || "Tidak diketahui", _lastModifiedAt: new Date().toISOString() };
      toUpsert.push(record);
      return record;
    });

    setDataState(stamped); // tampil langsung (optimistic), lalu disimpan ke Supabase di belakang layar
    prevRef.current = stamped;
    const toDelete = prev.filter((r) => !nextIds.has(String(r.id))).map((r) => r.id);

    if (toUpsert.length) supabaseUpsertRows(table, toUpsert).catch((e) => { console.error("Gagal menyimpan:", table, e); setError(e.message); });
    if (toDelete.length) supabaseDeleteRows(table, toDelete).catch((e) => { console.error("Gagal menghapus:", table, e); setError(e.message); });
  }, [table]);

  return { data, setData, loading, error, refetch };
}

function MadrasahAutocomplete({ masterList, value, onChangeText, onSelect }) {
  const [open, setOpen] = useState(false);
  const list = (masterList || []).filter((m) => norm(m.status) !== norm("Non-Aktif"));
  const matches = value && value.trim().length >= 2
    ? list.filter((m) => m.nama.toLowerCase().includes(value.toLowerCase()) || (m.nsm || "").includes(value)).slice(0, 12)
    : [];
  return (
    <div className="relative">
      <input
        className={inputCls} value={value}
        placeholder={list.length ? "Ketik nama madrasah..." : "Nama madrasah (Master Madrasah belum diunggah)"}
        onChange={(e) => { onChangeText(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
      />
      {open && matches.length > 0 && (
        <div className="absolute z-20 w-full bg-white border border-stone-200 rounded-lg shadow-lg mt-1 max-h-56 overflow-y-auto">
          {matches.map((m) => (
            <button key={m.id} type="button" onMouseDown={() => { onSelect(m); setOpen(false); }} className="w-full text-left px-3 py-2 text-sm hover:bg-stone-50 border-b border-stone-50 last:border-0">
              <p className="font-medium text-stone-700">{m.nama}</p>
              <p className="text-xs text-stone-400">{m.jenjang} · {m.kabkota}{m.nsm ? ` · NSM ${m.nsm}` : ""}</p>
            </button>
          ))}
        </div>
      )}
      {list.length > 0 && <p className="text-[11px] text-stone-400 mt-1">Pilih dari daftar supaya NSM, Kab/Kota, dan Jenjang otomatis terisi dan tidak salah ketik.</p>}

}

function MutasiGuruForm({ guru, onSave, onCancel, settings, masterList }) {

/* ============================== ANALISIS HELPER ============================== */
function computeGini(values) {
  const arr = values.filter((v) => Number.isFinite(v) && v >= 0);
  const n = arr.length;
  if (n < 2) return null;
  const mean = arr.reduce((s, v) => s + v, 0) / n;
  if (mean === 0) return 0;
  let sumAbsDiff = 0;
  for (let i = 0; i < n; i++) { for (let j = 0; j < n; j++) sumAbsDiff += Math.abs(arr[i] - arr[j]); }
  return sumAbsDiff / (2 * n * n * mean);
}
function buildIPG(mapelAnalysis) {
  const perMadrasah = {};
  mapelAnalysis.forEach((r) => {
    const key = regKey(r.nsm, r.madrasah, r.kabkota) + "|" + r.jenjang;
    if (!perMadrasah[key]) perMadrasah[key] = { madrasah: r.madrasah, kabkota: r.kabkota, jenjang: r.jenjang, kebutuhan: 0, tersedia: 0 };
    perMadrasah[key].kebutuhan += r.kebutuhanEfektif;
    perMadrasah[key].tersedia += r.tersedia;
  });
  const madrasahRows = Object.values(perMadrasah).map((m) => ({ ...m, kecukupan: m.kebutuhan > 0 ? m.tersedia / m.kebutuhan : 1 }));
  const perJenjang = MAPEL_JENJANG_LIST.map((j) => {
    const rows = madrasahRows.filter((m) => m.jenjang === j);
    return { jenjang: j, ipg: computeGini(rows.map((r) => r.kecukupan)), jumlahMadrasah: rows.length };
  });
  const perKabJenjang = [];
  KABKOTA_LIST.forEach((k) => {
    MAPEL_JENJANG_LIST.forEach((j) => {
      const rows = madrasahRows.filter((m) => m.kabkota === k && m.jenjang === j);
      if (rows.length === 0) return;
      perKabJenjang.push({ kabkota: k, jenjang: j, ipg: computeGini(rows.map((r) => r.kecukupan)), jumlahMadrasah: rows.length });
    });
  });
  return { perJenjang, perKabJenjang };
}
function buildRekapPenyebab(isianList, kabkotaFilter) {
  const tally = {};
  isianList.forEach((i) => {
    if (!i.penyebabUtama) return;
    if (kabkotaFilter && i.kabkota !== kabkotaFilter) return;
    tally[i.penyebabUtama] = (tally[i.penyebabUtama] || 0) + 1;
  });
  return Object.entries(tally).map(([penyebab, jumlah]) => ({ penyebab, jumlah })).sort((a, b) => b.jumlah - a.jumlah);
}
function buildProgresPengisian(masterList, rombelData, guruData, isianList, activeYear) {
  const madrasahAktif = masterList.filter((m) => norm(m.status) !== norm("Non-Aktif"));
  const rombelSet = new Set();
  rombelData.filter((r) => (r.tahunAjaran || defaultTahunAjaran()) === activeYear).forEach((r) => rombelSet.add(regKey(r.nsm, r.madrasah, r.kabkota)));
  const guruSet = new Set();
  guruData.filter((g) => (g.tahunAjaran || defaultTahunAjaran()) === activeYear).forEach((g) => guruSet.add(regKey(g.nsm, g.madrasah, g.kabkota)));
  const isianSet = new Set();
  isianList.filter((i) => (i.tahunAjaran || defaultTahunAjaran()) === activeYear).forEach((i) => isianSet.add(regKey(i.nsm, i.madrasah, i.kabkota)));

  // Kapan terakhir madrasah ini "disentuh" (rombel/guru/isian mana pun diubah) — dari stempel
  // Riwayat Perubahan. Dipakai untuk menandai data yang sudah lama tidak diperbarui, bukan cuma
  // yang belum pernah diisi sama sekali.
  const lastTouchMap = {};
  const noteTouch = (key, iso) => {
    if (!iso) return;
    if (!lastTouchMap[key] || new Date(iso) > new Date(lastTouchMap[key])) lastTouchMap[key] = iso;
  };
  [...rombelData, ...guruData, ...isianList].forEach((r) => noteTouch(regKey(r.nsm, r.madrasah, r.kabkota), r._lastModifiedAt));

  const perKab = KABKOTA_LIST.map((k) => {
    const madrasahDiKab = madrasahAktif.filter((m) => m.kabkota === k);
    const total = madrasahDiKab.length;
    if (total === 0) return null;
    let sudahRombel = 0, sudahGuru = 0, sudahIsian = 0;
    madrasahDiKab.forEach((m) => {
      const key = regKey(m.nsm, m.nama, m.kabkota);
      if (rombelSet.has(key)) sudahRombel++;
      if (guruSet.has(key)) sudahGuru++;
      if (isianSet.has(key)) sudahIsian++;
    });
    return { kabkota: k, total, sudahRombel, sudahGuru, sudahIsian, persen: total > 0 ? Math.round((sudahRombel / total) * 100) : 0 };
  }).filter(Boolean).sort((a, b) => a.persen - b.persen);
  const totalMadrasah = madrasahAktif.length;
  const totalSudahRombel = perKab.reduce((s, r) => s + r.sudahRombel, 0);
  const totalSudahGuru = perKab.reduce((s, r) => s + r.sudahGuru, 0);
  const totalSudahIsian = perKab.reduce((s, r) => s + r.sudahIsian, 0);

  const AMBANG_KADALUARSA_HARI = 90;
  const sekarang = Date.now();
  const daftarKadaluarsa = madrasahAktif.map((m) => {
    const key = regKey(m.nsm, m.nama, m.kabkota);
    const pernahDiisi = rombelSet.has(key) || guruSet.has(key) || isianSet.has(key);
    if (!pernahDiisi) return null; // sudah tercakup di "belum isi sama sekali", tidak perlu dobel di sini
    const last = lastTouchMap[key];
    const hariLalu = last ? Math.floor((sekarang - new Date(last).getTime()) / 86400000) : null;
    if (hariLalu === null || hariLalu < AMBANG_KADALUARSA_HARI) return null;
    return { nama: m.nama, kabkota: m.kabkota, jenjang: m.jenjang, hariLalu };
  }).filter(Boolean).sort((a, b) => b.hariLalu - a.hariLalu);

  return { perKab, totalMadrasah, totalSudahRombel, totalSudahGuru, totalSudahIsian, daftarKadaluarsa, ambangKadaluarsaHari: AMBANG_KADALUARSA_HARI };
}
// Proyeksi Pensiun — dari tanggal lahir guru aktif, hitung tahun pensiun (lahir + usia pensiun),
// lalu kelompokkan per tahun ke depan, per kab/kota, dan per mapel — untuk perencanaan formasi
// jangka panjang (bukan reaktif), dan nanti dipakai juga di Profil Satu Halaman Madrasah.
function buildProyeksiPensiun(guruData, settings, tahunRentang = 10) {
  const usiaPensiun = Number(settings.usiaPensiun) || 60;
  const tahunSekarang = new Date().getFullYear();
  const bulanSekarang = new Date().getMonth();

  const withTanggal = guruData.filter((g) => g.statusAktif !== "Non-Aktif" && g.tanggalLahir);
  const proyeksi = withTanggal.map((g) => {
    const lahir = new Date(g.tanggalLahir);
    if (isNaN(lahir.getTime())) return null;
    let tahunPensiun = lahir.getFullYear() + usiaPensiun;
    // Kalau bulan lahirnya sudah lewat di tahun pensiun itu, sebenarnya masih di tahun itu juga (ulang tahun sudah lewat berarti sudah genap usianya) — jadi tahunPensiun tetap tahun itu; tidak perlu penyesuaian bulan untuk granularitas per tahun.
    return { ...g, tahunPensiun, usiaSekarang: tahunSekarang - lahir.getFullYear() };
  }).filter(Boolean).filter((g) => g.tahunPensiun >= tahunSekarang && g.tahunPensiun <= tahunSekarang + tahunRentang);

  const perTahun = [];
  for (let y = tahunSekarang; y <= tahunSekarang + tahunRentang; y++) {
    const guruTahunIni = proyeksi.filter((g) => g.tahunPensiun === y);
    perTahun.push({ tahun: y, jumlah: guruTahunIni.length, guru: guruTahunIni });
  }

  const perKabkota = {};
  const perMapel = {};
  proyeksi.forEach((g) => {
    perKabkota[g.kabkota] = (perKabkota[g.kabkota] || 0) + 1;
    const label = g.mapel || "(tidak diketahui)";
    perMapel[label] = (perMapel[label] || 0) + 1;
  });

  return {
    totalTanpaTanggalLahir: guruData.filter((g) => g.statusAktif !== "Non-Aktif" && !g.tanggalLahir).length,
    totalDenganTanggalLahir: withTanggal.length,
    perTahun,
    perKabkota: Object.entries(perKabkota).map(([kabkota, jumlah]) => ({ kabkota, jumlah })).sort((a, b) => b.jumlah - a.jumlah),
    perMapel: Object.entries(perMapel).map(([mapel, jumlah]) => ({ mapel, jumlah })).sort((a, b) => b.jumlah - a.jumlah),
    daftarLengkap: proyeksi.sort((a, b) => a.tahunPensiun - b.tahunPensiun)
  };
}

function buildKebutuhanPengawas(masterList, pengawasList) {
  const madrasahAktif = masterList.filter((m) => norm(m.status) !== norm("Non-Aktif"));
  const pengawasAktif = pengawasList.filter((p) => p.statusAktif !== "Non-Aktif");
  const perKelompok = KELOMPOK_BINAAN_LIST.map((kelompok) => {
    const jenjangSet = KELOMPOK_JENJANG_MAP[kelompok];
    const jumlahMadrasah = madrasahAktif.filter((m) => jenjangSet.includes(m.jenjang)).length;
    const jumlahPengawas = pengawasAktif.filter((p) => p.kelompokBinaan === kelompok).length;
    const kebutuhan = Math.ceil(jumlahMadrasah / RASIO_PENGAWAS[kelompok]);
    const kekurangan = Math.max(0, kebutuhan - jumlahPengawas);
    const rasioAktual = jumlahPengawas > 0 ? jumlahMadrasah / jumlahPengawas : null;
    return { kelompok, jumlahMadrasah, jumlahPengawas, kebutuhan, kekurangan, rasioAktual };
  });
  const perKabKelompok = [];
  KABKOTA_LIST.forEach((k) => {
    KELOMPOK_BINAAN_LIST.forEach((kelompok) => {
      const jenjangSet = KELOMPOK_JENJANG_MAP[kelompok];
      const jumlahMadrasah = madrasahAktif.filter((m) => m.kabkota === k && jenjangSet.includes(m.jenjang)).length;
      if (jumlahMadrasah === 0) return;

function buildAnalysis(guruData, rombelData, settings) {

function buildMapelAnalysis(guruData, rombelData, settings, isianList, pilihanList) {
  isianList = isianList || [];

  rombelData.forEach((r) => {
    if (!MAPEL_JENJANG_LIST.includes(r.jenjang)) return;
    const gKey = regKey(r.nsm, r.madrasah, r.kabkota) + "|" + r.jenjang;
    if (!groupMap[gKey]) groupMap[gKey] = { madrasah: r.madrasah, kabkota: r.kabkota, jenjang: r.jenjang, nsm: r.nsm, kelasGroups: {} };
    const kelasKey = r.kelas || "_agregat_";
    groupMap[gKey].kelasGroups[kelasKey] = (groupMap[gKey].kelasGroups[kelasKey] || 0) + (Number(r.jumlahRombel) || 0);
  });
  const guruMap = {};

    if (!MAPEL_JENJANG_LIST.includes(g.jenjang) || !g.mapel) return;
    const key = regKey(g.nsm, g.madrasah, g.kabkota) + "|" + g.jenjang + "|" + norm(g.mapel);
    guruMap[key] = (guruMap[key] || 0) + 1;
  });
  const isianMap = {};
  isianList.forEach((i) => {
    const key = regKey(i.nsm, i.madrasah, i.kabkota) + "|" + i.jenjang + "|" + norm(i.mapel);
    isianMap[key] = i;
  });

    const key = regKey(p.nsm, p.madrasah, p.kabkota) + "|" + p.jenjang + "|" + p.kelas;
    if (!pilihanMap[key]) pilihanMap[key] = {};
    pilihanMap[key][p.mapel] = p.jtm;
  });

  Object.values(groupMap).forEach((g) => {
    const jenjangTable = (settings.jtmMapel && settings.jtmMapel[g.jenjang]) || {};

    const paiSet = new Set(PAI_MAPEL_CLUSTER.map(norm));

        if (paiSet.has(nMapel)) { paiJamThisKelas += jam; paiJamTotal += jam; paiHadirThisKelas = true; return; }
        if (gkSet.has(nMapel)) { guruKelasJamTotal += jam; return; }
        if (!perMapel[mapel]) perMapel[mapel] = { kebutuhan: 0, jamMgg: 0, totalRombel: 0, breakdown: [] };
        // Jam mentah dikumpulkan dulu dari SEMUA tingkat kelas — pembulatan ke jumlah guru
        // (÷ bebanWajib) dilakukan SEKALI di akhir, bukan per tingkat kelas lalu dijumlah,
        // karena satu guru bisa mengajar lintas tingkat kelas untuk menggenapi 24 jam.
        perMapel[mapel].jamMgg += jam;
        perMapel[mapel].totalRombel += rombelKelas;
        perMapel[mapel].breakdown.push({ kelas: kelasKey, rombel: rombelKelas, jtm: Number(jtm) || 0, jam, kebutuhan: Math.ceil(jam / (settings.bebanWajib || 24)) });
      });
      if (paiHadirThisKelas) {
        paiRombelTotal += rombelKelas;
        paiBreakdown.push({ kelas: kelasKey, rombel: rombelKelas, jam: paiJamThisKelas, kebutuhan: Math.ceil(paiJamThisKelas / (settings.bebanWajib || 24)) });
      }
      if (g.jenjang === "MI" && rombelKelas > 0) {
        guruKelasBreakdown.push({ kelas: kelasKey, rombel: rombelKelas, jam: 0, kebutuhan: rombelKelas });
      }
    });
    // Pembulatan jumlah guru dilakukan SEKALI di sini, dari total jam gabungan seluruh tingkat kelas.
    paiKebutuhanTotal = Math.ceil(paiJamTotal / (settings.bebanWajib || 24));
    Object.keys(perMapel).forEach((mapel) => {
      perMapel[mapel].kebutuhan = Math.ceil(perMapel[mapel].jamMgg / (settings.bebanWajib || 24));
    });
    if (paiJamTotal > 0) perMapel[GURU_PAI_LABEL] = { kebutuhan: paiKebutuhanTotal, jamMgg: paiJamTotal, totalRombel: paiRombelTotal, isCluster: true, breakdown: paiBreakdown };
    if (g.jenjang === "MI" && totalRombelAll > 0 && guruKelasJamTotal > 0) perMapel[GURU_KELAS_LABEL] = { kebutuhan: totalRombelAll, jamMgg: guruKelasJamTotal, totalRombel: totalRombelAll, isCluster: true, isGuruKelas: true, breakdown: guruKelasBreakdown };

    Object.entries(perMapel).forEach(([mapel, agg]) => {
      const namesToMatch = resolveClusterMapelNames(mapel, g.jenjang).map(norm);
      const tersediaEmis = namesToMatch.reduce((sum, nm) => sum + (guruMap[regKey(g.nsm, g.madrasah, g.kabkota) + "|" + g.jenjang + "|" + nm] || 0), 0);
      const key = regKey(g.nsm, g.madrasah, g.kabkota) + "|" + g.jenjang + "|" + norm(mapel);
      const isian = isianMap[key] || null;
      const tersediaManual = isian ? isianJml(isian) : null;
      const tersedia = tersediaManual !== null ? tersediaManual : tersediaEmis;
      const kebutuhanManualNum = isian && isian.kebutuhanManual !== "" && isian.kebutuhanManual != null ? Number(isian.kebutuhanManual) : null;
      const kebutuhanEfektif = kebutuhanManualNum !== null ? kebutuhanManualNum : agg.kebutuhan;
      const selisih = tersedia - kebutuhanEfektif;
      let status = "ideal";
      if (selisih < 0) status = "kurang"; else if (selisih > 0) status = "lebih";
      const avgJtm = agg.totalRombel > 0 ? Math.round((agg.jamMgg / agg.totalRombel) * 10) / 10 : 0;
      rows.push({
        madrasah: g.madrasah, kabkota: g.kabkota, jenjang: g.jenjang, nsm: g.nsm, mapel,
        rombel: agg.totalRombel, jtm: avgJtm, jamMgg: agg.jamMgg,
        kebutuhan: agg.kebutuhan, kebutuhanEfektif, tersedia, tersediaEmis, tersediaManual, isian,

   Mengikuti konvensi yang sama dengan App(): pilihanList TIDAK difilter per tahun (sama seperti

function buildTrendPerTahun(guruData, rombelData, isianData, pilihanData, settings) {
  const years = (settings.daftarTahunAjaran && settings.daftarTahunAjaran.length ? settings.daftarTahunAjaran : [defaultTahunAjaran()]).slice().sort();
  return years.map((thn) => {

    const r = rombelData.filter((x) => (x.tahunAjaran || defaultTahunAjaran()) === thn);
    const i = isianData.filter((x) => (x.tahunAjaran || defaultTahunAjaran()) === thn);

      tahun: thn, kebutuhan, tersedia, selisih: tersedia - kebutuhan,

   Mencocokkan madrasah yang kelebihan guru (selisih > 0) dengan madrasah yang kekurangan

   satu kab/kota dulu (prioritas — meminimalkan jarak pindah), sisanya baru dicocokkan lintas

function buildRekomendasiMutasi(mapelAnalysis) {
  const groups = {};
  mapelAnalysis.forEach((r) => {
    if (r.status === "ideal" || !r.selisih) return;
    const key = r.jenjang + "|" + norm(r.mapel);
    if (!groups[key]) groups[key] = { jenjang: r.jenjang, mapel: r.mapel, isCluster: r.isCluster, isGuruKelas: r.isGuruKelas, surplus: [], deficit: [] };
    if (r.selisih > 0) groups[key].surplus.push({ madrasah: r.madrasah, kabkota: r.kabkota, nsm: r.nsm, sisa: r.selisih });
    else groups[key].deficit.push({ madrasah: r.madrasah, kabkota: r.kabkota, nsm: r.nsm, sisa: -r.selisih });
  });

  const rekomendasi = [];
  Object.values(groups).forEach((g) => {
    const runMatch = (sameKab) => {
      g.surplus.sort((a, b) => b.sisa - a.sisa);
      g.deficit.sort((a, b) => b.sisa - a.sisa);
      g.surplus.forEach((s) => {
        if (s.sisa <= 0) return;
        g.deficit.forEach((d) => {
          if (s.sisa <= 0 || d.sisa <= 0) return;
          const kabSama = d.kabkota === s.kabkota;
          if (sameKab !== kabSama) return;
          const jumlah = Math.min(s.sisa, d.sisa);
          if (jumlah <= 0) return;

            jenjang: g.jenjang, mapel: g.mapel, isCluster: g.isCluster, isGuruKelas: g.isGuruKelas,
            asalMadrasah: s.madrasah, asalKabkota: s.kabkota, asalNsm: s.nsm, asalSisaSebelum: s.sisa,
            tujuanMadrasah: d.madrasah, tujuanKabkota: d.kabkota, tujuanNsm: d.nsm, tujuanSisaSebelum: d.sisa,
            jumlah, prioritas: sameKab ? "Sama Kab/Kota" : "Lintas Kab/Kota"
          });
          s.sisa -= jumlah; d.sisa -= jumlah;
        });
      });
    };
    runMatch(true);  // tahap 1: pasangkan dalam kab/kota yang sama dulu
    runMatch(false); // tahap 2: sisanya, pasangkan lintas kab/kota
  });

  return rekomendasi.sort((a, b) =>

  );

function countGuruGender(guruData, nsm, madrasah, kabkota, jenjang, mapel) {
  let lk = 0, pr = 0;
  const target = regKey(nsm, madrasah, kabkota);
  const names = resolveClusterMapelNames(mapel, jenjang).map(norm);
  guruData.forEach((g) => {
    if (regKey(g.nsm, g.madrasah, g.kabkota) === target && g.jenjang === jenjang && names.includes(norm(g.mapel))) {
      if (g.jenisKelamin === "P") pr += 1; else lk += 1;
    }
  });
  return { lk, pr, jlh: lk + pr };
}

/* ============================== IMPORT / EXPORT (SheetJS) ============================== */
function parseSheet(file, onRows) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      onRows(XLSX.utils.sheet_to_json(ws, { defval: "" }));
    } catch (err) { onRows(null); }
  };
  reader.readAsArrayBuffer(file);
}
function downloadTemplate(type) {
  let ws;
  if (type === "guru") {
    ws = XLSX.utils.json_to_sheet([{ NIP: "", NSM: "", Nama: "", "Jenis Kelamin": "L", Madrasah: "", "Kab/Kota": KABKOTA_LIST[0], Jenjang: "MI", "Mata Pelajaran": "", TUGAS: "", "Status Kepegawaian": "PNS", "Pendidikan Terakhir": "S1", Jurusan: "", Sertifikasi: "Belum", "Tahun Sertifikasi": "", "Jam Mengajar": "", "Tahun Ajaran": "" }]);
  } else if (type === "tendik") {
    ws = XLSX.utils.json_to_sheet([{ "Jenis Tendik": "Kepala Madrasah", NIP: "", NSM: "", Nama: "", "Jenis Kelamin": "L", Madrasah: "", "Kab/Kota": KABKOTA_LIST[0], Jenjang: "MI", "Status Kepegawaian": "PNS", "Pendidikan Terakhir": "S1", Jurusan: "", "Tahun Ajaran": "" }]);
  } else {
    ws = XLSX.utils.json_to_sheet([{ NSM: "", Madrasah: "", "Kab/Kota": KABKOTA_LIST[0], Jenjang: "MI", Kelas: "", "Jumlah Rombel": "", "Jumlah Siswa": "", "Tahun Ajaran": "" }]);
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Template");
  XLSX.writeFile(wb, `Template_${type === "guru" ? "Data_Guru" : type === "tendik" ? "Data_Tendik" : "Rombel_Siswa"}.xlsx`);
}
function exportData(rows, filename, mapper) {
  const ws = XLSX.utils.json_to_sheet(rows.map(mapper));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Data");
  XLSX.writeFile(wb, filename);
}

                Daftar master madrasah belum tersedia. Hubungi admin Kanwil untuk mengunggahnya terlebih dahulu.
              </p>
            )}
            <div className="max-h-64 overflow-y-auto divide-y divide-stone-100">
              {filtered.map((m) => (
                <button key={m.id} onClick={() => pickMadrasah(m)} className="w-full text-left py-2.5 hover:bg-stone-50 px-1 rounded">
                  <p className="text-sm font-medium text-stone-700">{m.nama}</p>
                  <p className="text-xs text-stone-400">{m.jenjang} · {m.kabkota}{m.nsm ? ` · NSM ${m.nsm}` : ""}</p>
                </button>
              ))}
              {q.trim().length >= 2 && filtered.length === 0 && (
                <p className="text-xs text-stone-400 py-2">Tidak ditemukan. Cek ejaan, atau hubungi Kanwil kalau madrasah belum terdaftar di master data.</p>
              )}
            </div>
            <button onClick={() => setShowKanwil(true)} className="w-full text-center text-xs text-stone-400 hover:text-stone-600 mt-3 pt-3 border-t border-stone-100">
              Saya admin Kanwil / Kab-Kota →
            </button>
          </div>
        ) : (
          <div className="bg-white border border-stone-200 rounded-xl p-5 shadow-sm">
            <h3 className="font-semibold text-stone-700 text-sm mb-1">Masuk sebagai Admin Kanwil</h3>
            <p className="text-xs text-stone-500 mb-4">Akun ini dibuat khusus oleh Kanwil dan tidak bisa didaftar sendiri lewat halaman ini.</p>
            <div className="space-y-2 mb-3">
              <Field label="Email"><input type="email" className={inputCls} value={email} onChange={(e) => setEmail(e.target.value)} placeholder="nama@kemenag.go.id" /></Field>
              <Field label="Kata Sandi"><input type="password" className={inputCls} value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => e.key === "Enter" && doLogin()} /></Field>
            </div>
            {loginError && <p className="text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded-lg p-2 mb-3">{loginError}</p>}
            <button onClick={doLogin} disabled={loggingIn || !email || !password} className="w-full px-4 py-2.5 text-sm rounded-lg bg-[#0B4D3E] text-white hover:bg-[#0d5c4a] disabled:opacity-40 mb-2 flex items-center justify-center gap-1.5">
              {loggingIn && <Icon name="loader" size={14} className="animate-spin" />} Masuk
            </button>
            <button onClick={() => { setShowKanwil(false); setLoginError(""); }} className="w-full text-center text-xs text-stone-400 hover:text-stone-600">← Kembali cari madrasah</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================== APLIKASI UTAMA ============================== */
function App() {
  const [tab, setTab] = useState(() => {
    try {
      const raw = localStorage.getItem("peta-gtk-identity");
      const stored = raw ? JSON.parse(raw) : null;
      return stored && stored.role === "madrasah" ? "rombel" : "dashboard";
    } catch { return "dashboard"; }
  });
  const guruList = useSupabaseTable("guru");
  const rombelList = useSupabaseTable("rombel");
  const profilList = useSupabaseTable("profil_madrasah");
  const masterList = useSupabaseTable("master_madrasah");
  const isianList = useSupabaseTable("isian_guru");
  const tendikList = useSupabaseTable("tendik");
  const pilihanList = useSupabaseTable("pilihan_mapel");
  const pengawasList = useSupabaseTable("pengawas");
  const siswaInklusiList = useSupabaseTable("siswa_inklusi");

  const [settings, setSettingsState] = useState(DEFAULT_SETTINGS);
  const [settingsLoaded, setSettingsLoaded] = useState(false);
  const [settingsError, setSettingsError] = useState(null);
  const [settingsRetryTick, setSettingsRetryTick] = useState(0);
  useEffect(() => {
    (async () => {
      try {
        const loaded = await supabaseGetSingle("settings");
        setSettingsState(migrateSettings(loaded));
        setSettingsError(null);
      } catch (e) {
        console.error("Gagal memuat pengaturan dari Supabase:", e);
        setSettingsError(e.message);
      } finally {
        setSettingsLoaded(true);
      }
    })();
  }, [settingsRetryTick]);

  const saveSettings = (next) => {
    setSettingsState(next);
    supabaseSetSingle("settings", next).catch((e) => console.error("Gagal menyimpan pengaturan:", e));
  };

  const [viewYear, setViewYear] = useState(null);
  useEffect(() => { if (!viewYear && settingsLoaded) setViewYear(settings.tahunAjaranAktif); }, [settingsLoaded]);
  const activeYear = viewYear || settings.tahunAjaranAktif;

  // Identitas "siapa saya" — murni per-perangkat (browser ini saja), disimpan di localStorage,
  // BUKAN di Supabase, karena ini bukan data bersama, cuma preferensi tampilan perangkat ini.
  const [identity, setIdentity] = useState(() => {
    try {
      const raw = localStorage.getItem("peta-gtk-identity");
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  });
  const saveIdentity = (next) => {
    setIdentity(next);
    setTab(next && next.role === "kanwil" ? "dashboard" : "rombel");
    authToken = next && next.role === "kanwil" ? next.accessToken : null;
    currentIdentityLabel = next ? (next.role === "kanwil" ? `Admin Kanwil${next.email ? " (" + next.email + ")" : ""}` : next.madrasah) : null;
    try { localStorage.setItem("peta-gtk-identity", JSON.stringify(next)); } catch {}
  };
  const clearIdentity = () => {
    if (identity && identity.role === "kanwil" && identity.accessToken) {
      supabaseSignOut(identity.accessToken); // beri tahu server, tidak perlu ditunggu
    }
    setIdentity(null);
    authToken = null;
    currentIdentityLabel = null;
    try { localStorage.removeItem("peta-gtk-identity"); } catch {}
  };

  const yearGuruActive = useMemo(() => guruList.data.filter((g) => (g.tahunAjaran || defaultTahunAjaran()) === activeYear && g.statusAktif !== "Non-Aktif"), [guruList.data, activeYear]);
  const yearRombel = useMemo(() => rombelList.data.filter((r) => (r.tahunAjaran || defaultTahunAjaran()) === activeYear), [rombelList.data, activeYear]);
  const yearIsian = useMemo(() => isianList.data.filter((i) => (i.tahunAjaran || defaultTahunAjaran()) === activeYear), [isianList.data, activeYear]);

  const analysis = useMemo(() => buildAnalysis(yearGuruActive, yearRombel, settings), [yearGuruActive, yearRombel, settings]);
  const mapelAnalysis = useMemo(() => buildMapelAnalysis(yearGuruActive, yearRombel, settings, yearIsian, pilihanList.data), [yearGuruActive, yearRombel, settings, yearIsian, pilihanList.data]);
  const ipg = useMemo(() => buildIPG(mapelAnalysis), [mapelAnalysis]);
  const rekapPenyebab = useMemo(() => buildRekapPenyebab(yearIsian), [yearIsian]);
  const kompetensiSummary = useMemo(() => {
    const total = yearGuruActive.length;
    const sudah = yearGuruActive.filter((g) => g.ikutPeningkatanKompetensi === "Ya").length;
    return { total, sudah, persen: total > 0 ? Math.round((sudah / total) * 100) : 0 };

/* ============================== DASHBOARD ============================== */
function Dashboard({ guruData, rombelData, analysis, progresPengisian, allLists }) {
  const totalGuru = guruData.length;
  const totalSiswa = rombelData.reduce((s, r) => s + (Number(r.jumlahSiswa) || 0), 0);
  const totalRombel = rombelData.reduce((s, r) => s + (Number(r.jumlahRombel) || 0), 0);
  const kurang = analysis.filter((a) => a.status === "kurang");
  const lebih = analysis.filter((a) => a.status === "lebih");

  const chartData = KABKOTA_LIST.map((k) => {
    const rows = analysis.filter((a) => a.kabkota === k);
    const selisih = rows.reduce((s, r) => s + r.selisihGuru, 0);
    return { kabkota: k.replace("Kota ", "").replace("Aceh ", "A. "), selisih };
  }).filter((d) => d.selisih !== 0).sort((a, b) => a.selisih - b.selisih);
  const maxAbs = Math.max(1, ...chartData.map((d) => Math.abs(d.selisih)));

  const aktivitasTerbaru = useMemo(() => {
    if (!allLists) return [];
    const all = [];
    Object.entries(allLists).forEach(([kategori, list]) => {
      list.forEach((r) => { if (r._lastModifiedAt) all.push({ kategori, nama: r.nama || r.madrasah || "(tanpa nama)", oleh: r._lastModifiedBy || "Tidak diketahui", waktu: r._lastModifiedAt }); });
    });
    return all.sort((a, b) => new Date(b.waktu) - new Date(a.waktu)).slice(0, 15);
  }, [allLists]);

  const waktuRelatif = (iso) => {
    const detik = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (detik < 60) return "baru saja";
    if (detik < 3600) return `${Math.floor(detik / 60)} menit lalu`;
    if (detik < 86400) return `${Math.floor(detik / 3600)} jam lalu`;
    return `${Math.floor(detik / 86400)} hari lalu`;
  };

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard label="Total Guru Tercatat" value={totalGuru.toLocaleString("id-ID")} icon="users" accent="#0B4D3E" />
        <StatCard label="Total Siswa" value={totalSiswa.toLocaleString("id-ID")} icon="school" accent="#0E6B54" />
        <StatCard label="Total Rombel" value={totalRombel.toLocaleString("id-ID")} icon="chart" accent="#B8860B" />
        <StatCard label="Rasio Siswa : Guru" value={totalGuru > 0 ? (totalSiswa / totalGuru).toFixed(1) : "-"} sub="rata-rata provinsi" icon="trendUp" accent="#0B4D3E" />
      </div>

      {aktivitasTerbaru.length > 0 && (
        <Card className="p-5">
          <h3 className="font-semibold mb-1 flex items-center gap-2 font-display"><Icon name="clipboard" size={16} /> Aktivitas Terbaru</h3>
          <p className="text-xs text-stone-500 mb-4">15 perubahan data terakhir di seluruh aplikasi — siapa mengubah apa, kapan.</p>
          <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
            {aktivitasTerbaru.map((a, i) => (
              <div key={i} className="flex items-start justify-between text-xs border-b border-stone-100 pb-2 last:border-0">
                <div>
                  <span className="text-stone-700 font-medium">{a.nama}</span>
                  <span className="text-stone-400"> ({a.kategori})</span>
                  <p className="text-stone-500">diubah oleh <strong>{a.oleh}</strong></p>
                </div>
                <span className="text-stone-400 shrink-0 ml-2 text-right">{waktuRelatif(a.waktu)}</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      {progresPengisian && (
        <Card className="p-5">
          <h3 className="font-semibold mb-1 flex items-center gap-2 font-display"><Icon name="clipboard" size={16} /> Progres Pengisian Data (Tahun Ajaran Aktif)</h3>
          <p className="text-xs text-stone-500 mb-4">Berapa dari {progresPengisian.totalMadrasah} madrasah aktif yang sudah mengisi datanya. Diurutkan dari kab/kota yang paling tertinggal.</p>
          <div className="grid grid-cols-3 gap-3 mb-4">
            <div className="text-center">
              <p className="text-xl font-semibold text-stone-800">{progresPengisian.totalSudahRombel}/{progresPengisian.totalMadrasah}</p>
              <p className="text-[11px] text-stone-400">Sudah Isi Rombel & Siswa</p>
            </div>
            <div className="text-center">
              <p className="text-xl font-semibold text-stone-800">{progresPengisian.totalSudahGuru}/{progresPengisian.totalMadrasah}</p>
              <p className="text-[11px] text-stone-400">Sudah Isi Data Guru</p>
            </div>
            <div className="text-center">
              <p className="text-xl font-semibold text-stone-800">{progresPengisian.totalSudahIsian}/{progresPengisian.totalMadrasah}</p>
              <p className="text-[11px] text-stone-400">Sudah Isi Kebutuhan Guru</p>
            </div>
          </div>
          <div className="max-h-64 overflow-y-auto pr-1 space-y-1.5">
            {progresPengisian.perKab.map((row) => (
              <div key={row.kabkota} className="flex items-center gap-2 text-xs">
                <span className="w-36 shrink-0 text-stone-600 truncate">{row.kabkota}</span>
                <div className="flex-1 bg-stone-100 rounded-full h-2 overflow-hidden">
                  <div className={`h-2 rounded-full ${row.persen < 30 ? "bg-rose-500" : row.persen < 70 ? "bg-amber-500" : "bg-emerald-500"}`} style={{ width: `${row.persen}%` }} />
                </div>
                <span className="w-24 shrink-0 text-right text-stone-500">{row.sudahRombel}/{row.total} ({row.persen}%)</span>
              </div>
            ))}
          </div>
          {progresPengisian.daftarKadaluarsa && progresPengisian.daftarKadaluarsa.length > 0 && (
            <div className="mt-4 pt-4 border-t border-stone-100">
              <p className="text-xs font-semibold text-amber-700 uppercase tracking-wide mb-1 flex items-center gap-1.5">
                <Icon name="alert" size={13} /> {progresPengisian.daftarKadaluarsa.length} Madrasah Sudah Isi Tapi Datanya Kadaluarsa (&gt;{progresPengisian.ambangKadaluarsaHari} hari)
              </p>
              <p className="text-[11px] text-stone-400 mb-2">Sudah pernah diisi, tapi sudah lama tidak diperbarui — beda dengan yang belum isi sama sekali di atas.</p>
              <div className="max-h-40 overflow-y-auto space-y-1">
                {progresPengisian.daftarKadaluarsa.slice(0, 50).map((m, i) => (
                  <div key={i} className="flex justify-between text-xs py-1 border-b border-stone-50">
                    <span className="text-stone-600">{m.nama} <span className="text-stone-400">({m.jenjang} · {m.kabkota})</span></span>
                    <span className="text-amber-700 font-medium shrink-0 ml-2">{m.hariLalu} hari lalu</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </Card>
      )}

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Card className="p-5">
          <h3 className="font-semibold mb-1 flex items-center gap-2 text-rose-800 font-display"><Icon name="alert" size={16} /> Wilayah Kekurangan Guru</h3>
          <p className="text-xs text-stone-500 mb-3">{kurang.length} kombinasi kab/kota-jenjang teridentifikasi kekurangan</p>
          <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
            {kurang.slice(0, 8).map((r, i) => (
              <div key={i} className="flex items-center justify-between text-sm border-b border-stone-100 pb-1.5">
                <span>{r.kabkota} <span className="text-stone-400">· {r.jenjang}</span></span>
                <Badge tone="bad">kekurangan ~{Math.abs(r.selisihGuru)} guru</Badge>
              </div>
            ))}
            {kurang.length === 0 && <p className="text-sm text-stone-400 italic">Belum ada data cukup untuk analisis.</p>}
          </div>
        </Card>
        <Card className="p-5">
          <h3 className="font-semibold mb-1 flex items-center gap-2 text-amber-800 font-display"><Icon name="trendDown" size={16} /> Wilayah Kelebihan Guru</h3>
          <p className="text-xs text-stone-500 mb-3">{lebih.length} kombinasi kab/kota-jenjang berpotensi kelebihan</p>
          <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
            {lebih.slice(0, 8).map((r, i) => (
              <div key={i} className="flex items-center justify-between text-sm border-b border-stone-100 pb-1.5">
                <span>{r.kabkota} <span className="text-stone-400">· {r.jenjang}</span></span>
                <Badge tone="warn">lebih ~{Math.abs(r.selisihGuru)} guru</Badge>
              </div>
            ))}
            {lebih.length === 0 && <p className="text-sm text-stone-400 italic">Belum ada data cukup untuk analisis.</p>}
          </div>
        </Card>
      </div>

      {chartData.length > 0 && (
        <Card className="p-5">
          <h3 className="font-semibold mb-3 font-display">Selisih Kebutuhan Guru per Kab/Kota</h3>
          <p className="text-xs text-stone-500 mb-4">Nilai negatif = kekurangan guru, nilai positif = kelebihan guru (dibanding rasio ideal)</p>
          <div>{chartData.map((d, i) => <SimpleBarRow key={i} label={d.kabkota} value={d.selisih} max={maxAbs} />)}</div>
        </Card>
      )}

      {totalGuru === 0 && totalSiswa === 0 && (
        <Card className="p-8 text-center">
          <Icon name="sheet" size={36} className="mx-auto text-stone-300 mb-3" />
          <p className="text-stone-500 text-sm">Belum ada data. Mulai dengan menambah data guru dan rombel/siswa secara manual, atau import dari Excel di tab masing-masing.</p>
        </Card>
      )}
    </div>
  );
}

/* ============================== DATA GURU TAB ============================== */
function DataGuruTab({ list, settings, lockIdentity, masterList, activeYear }) {
  const { data, setData } = list;
  const [modal, setModal] = useState(null);
  const [q, setQ] = useState("");
  const [filterKab, setFilterKab] = useState("");
  const [filterJenjang, setFilterJenjang] = useState("");
  const [showNonAktif, setShowNonAktif] = useState(false);
  const [importMsg, setImportMsg] = useState("");
  const [page, setPage] = useState(1);
  const PER_PAGE = 100;

  const scopedData = useMemo(() => {
    let base = data.filter((g) => (g.tahunAjaran || defaultTahunAjaran()) === activeYear);
    if (lockIdentity) {
      const target = regKey(lockIdentity.nsm, lockIdentity.madrasah, lockIdentity.kabkota);
      base = base.filter((g) => regKey(g.nsm, g.madrasah, g.kabkota) === target);
    }
    if (!showNonAktif) base = base.filter((g) => g.statusAktif !== "Non-Aktif");
    return base;
  }, [data, lockIdentity, activeYear, showNonAktif]);

  const filtered = useMemo(() => {
    const qLower = q.trim().toLowerCase();
    return scopedData.filter((g) =>
      (!qLower || g.nama.toLowerCase().includes(qLower) || g.madrasah.toLowerCase().includes(qLower) || (g.nip || "").includes(qLower) || (g.pegId || "").includes(qLower) || (g.nsm || "").includes(qLower)) &&
      (lockIdentity || !filterKab || g.kabkota === filterKab) &&
      (lockIdentity || !filterJenjang || g.jenjang === filterJenjang)
    );
  }, [scopedData, q, filterKab, filterJenjang, lockIdentity]);

  useEffect(() => { setPage(1); }, [q, filterKab, filterJenjang]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  const currentPage = Math.min(page, totalPages);
  const pageRows = useMemo(() => filtered.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE), [filtered, currentPage]);

  const save = (form) => {
    const exists = data.some((d) => d.id === form.id);
    setData(exists ? data.map((d) => (d.id === form.id ? form : d)) : [...data, form]);
    setModal(null);
  };
  const remove = (id) => setData(data.filter((d) => d.id !== id));
  const prosesMutasi = (guru, hasil) => {
    const oldUpdated = {
      ...guru, statusAktif: "Non-Aktif", alasanNonAktif: "Mutasi",
      tanggalNonAktif: hasil.tanggalEfektif,
      tujuanMutasi: hasil.tujuanMadrasah + (hasil.keterangan ? " — " + hasil.keterangan : "")
    };
    const newRecord = {
      ...guru, id: uid(),
      nsm: hasil.tujuanNsm, madrasah: hasil.tujuanMadrasah, kabkota: hasil.tujuanKabkota, jenjang: hasil.tujuanJenjang,
      mapel: hasil.mapelBaru, tugas: hasil.tugasBaru, mapelLatarBelakang: hasil.mapelLatarBelakang || "",
      jamMengajar: hasil.jamMengajarBaru !== undefined ? hasil.jamMengajarBaru : guru.jamMengajar,
      statusAktif: "Aktif", alasanNonAktif: "", tanggalNonAktif: "", tujuanMutasi: "",
      tahunAjaran: activeYear,
      asalMutasi: `${guru.madrasah}${guru.kabkota ? " (" + guru.kabkota + ")" : ""} — efektif ${hasil.tanggalEfektif}${hasil.keterangan ? ", " + hasil.keterangan : ""}`
    };
    setData([...data.map((d) => (d.id === guru.id ? oldUpdated : d)), newRecord]);
    setModal(null);
  };
  const newEntry = (prefill) => {
    const base = { ...emptyGuru(activeYear), ...(prefill || {}) };
    if (lockIdentity) return { ...base, nsm: lockIdentity.nsm, madrasah: lockIdentity.madrasah, kabkota: lockIdentity.kabkota, jenjang: lockIdentity.jenjang };
    return base;
  };

  // Field yang dikelola manual oleh Kanwil/admin madrasah (status aktif, mutasi, kompetensi) —
  // TIDAK ditimpa saat impor ulang EMIS, supaya catatan itu tidak hilang begitu saja.
  const LOCAL_FIELDS = ["statusAktif", "alasanNonAktif", "tanggalNonAktif", "tujuanMutasi", "asalMutasi", "mapelLatarBelakang", "ikutPeningkatanKompetensi", "namaPelatihan"];

  // Cocokkan data impor dengan data yang sudah ada berdasar PEG ID (kunci utama dari EMIS,
  // lebih diandalkan daripada NIK yang kadang masih ganda karena belum sinkron Disdukcapil).
  // Kalau PEG ID sudah ada (tahun ajaran yang sama) → perbarui baris itu (bukan bikin baru).
  // Kalau belum ada / PEG ID kosong → tetap dibuat baris baru seperti biasa.
  const mergeGuruImport = (fullData, importedRows, targetYear) => {
    const byPegId = new Map();
    fullData.forEach((g) => {
      if (g.pegId && (g.tahunAjaran || defaultTahunAjaran()) === targetYear) byPegId.set(g.pegId, g);
    });
    const matchedIds = new Set();
    let updatedCount = 0, newCount = 0;
    const resultNew = importedRows.map((row) => {
      if (row.pegId && byPegId.has(row.pegId)) {
        const existing = byPegId.get(row.pegId);
        matchedIds.add(existing.id);
        updatedCount++;
        const merged = { ...row, id: existing.id };
        LOCAL_FIELDS.forEach((f) => { merged[f] = existing[f]; });
        return merged;
      }
      newCount++;
      return row;
    });
    const untouched = fullData.filter((g) => !matchedIds.has(g.id));
    return { merged: [...untouched, ...resultNew], updatedCount, newCount };
  };

  const [importing, setImporting] = useState(false);
  const handleFile = (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setImporting(true);
    let allMapped = [];
    let filesLeft = files.length;
    let hadError = false;
    files.forEach((file) => {
      parseSheet(file, (rows) => {
        filesLeft -= 1;
        if (!rows) { hadError = true; }
        else {
          const mapped = rows.map((r) => {
            const jenjang = normalizeJenjang(findColumnValue(r, ["Jenjang"]) || "MI");
            const mapelNamesList = validGuruMapelNames(settings, jenjang);
            const rawMapel = findColumnValue(r, ["Mata Pelajaran", "MAPEL UTAMA", "Mapel"]);
            const rawTugas = findColumnValue(r, ["TUGAS", "Tugas"]);
            const rawStatus = (findColumnValue(r, ["Status Kepegawaian", "STATUS PEGAWAI"]) || "PNS").toString().trim().replace(/\s+/g, " ").replace(/\/\s+/g, "/");
            const mapelFinal = (jenjang === "MI" && (isGuruKelasTugas(rawTugas) || isGuruKelasTugas(rawMapel))) ? GURU_KELAS_LABEL : normalizeMapel(rawMapel, mapelNamesList);
            const pegId = findColumnValue(r, ["PEGID", "PEG ID", "Peg Id"]).toString().trim();
            const nsm = findColumnValue(r, ["NSM"]).toString().trim();
            const nama = findColumnValue(r, ["Nama", "NAMA"]).toString().trim();
            const madrasah = findColumnValue(r, ["Madrasah", "MADRASAH"]).toString().trim();
            const kabkotaRaw = findColumnValue(r, ["Kab/Kota", "KOTA MADRASAH", "Kabupaten/Kota"]) || KABKOTA_LIST[0];
            const pangkat = findColumnValue(r, ["Pangkat", "Pangkat/Golongan", "Pangkat Golongan", "Golongan"]).toString().trim();
            const tanggalLahir = parseExcelDateToISO(findColumnValue(r, ["Tanggal Lahir", "TGL LAHIR", "Tgl Lahir"]));
            return {
              id: uid(),
              pegId,
              nip: String(r.NIP || r.nip || r.NIK || r.NUPTK || ""),
              nsm,
              nama,
              pangkat,
              tanggalLahir,
              jenisKelamin: (r["Jenis Kelamin"] || r.KELAMIN || r.jenisKelamin || "L").toString().toUpperCase().startsWith("P") ? "P" : "L",
              madrasah,
              kabkota: normalizeKabKota(kabkotaRaw),
              jenjang, mapel: mapelFinal, tugas: rawTugas, statusKepegawaian: rawStatus,
              pendidikan: findColumnValue(r, ["Pendidikan Terakhir", "Kualifikasi"]) || "S1", jurusan: r.Jurusan || "",
              sertifikasi: r.Sertifikasi || r["STATUS SERTIFIKASI"] || "Belum",
              tahunSertifikasi: String(r["Tahun Sertifikasi"] || r["THN SERTIFIKASI"] || ""),
              jamMengajar: String(r["Jam Mengajar"] || ""),
              statusAktif: "Aktif", alasanNonAktif: "", tanggalNonAktif: "", tujuanMutasi: "",
              ikutPeningkatanKompetensi: "Tidak", namaPelatihan: "",
              tahunAjaran: r["Tahun Ajaran"] || activeYear
            };
          }).filter((r) => r.nama);
          allMapped = allMapped.concat(mapped);
        }
        if (filesLeft === 0) {
          setImporting(false);
          if (allMapped.length) {
            const { merged, updatedCount, newCount } = mergeGuruImport(data, allMapped, activeYear);
            setData(merged);
            setImportMsg(
              (hadError ? "Sebagian file gagal dibaca. " : "") +
              `${newCount} guru baru ditambahkan, ${updatedCount} guru yang sudah ada diperbarui (dicocokkan lewat PEG ID) — status aktif/mutasi/kompetensi yang sudah dicatat sebelumnya tidak ikut tertimpa.`
            );
          } else {
            setImportMsg(hadError ? "Gagal membaca file — tidak ada data yang bisa diimpor." : "Tidak ada baris data yang valid ditemukan.");
          }
        }
      });
    });
    e.target.value = "";
  };

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center gap-2 justify-between">
        <div className="flex flex-wrap gap-2 items-center flex-1">
          <div className="relative">
            <span className="absolute left-2.5 top-2.5 text-stone-400"><Icon name="search" size={14} /></span>
            <input placeholder="Cari nama / madrasah / NIP" value={q} onChange={(e) => setQ(e.target.value)} className={inputCls + " pl-8 w-64"} />
          </div>
          <select className={inputCls + " w-44"} value={filterKab} onChange={(e) => setFilterKab(e.target.value)} style={{ display: lockIdentity ? "none" : undefined }}>
            <option value="">Semua Kab/Kota</option>{KABKOTA_LIST.map((k) => <option key={k}>{k}</option>)}
          </select>
          <select className={inputCls + " w-28"} value={filterJenjang} onChange={(e) => setFilterJenjang(e.target.value)} style={{ display: lockIdentity ? "none" : undefined }}>
            <option value="">Semua Jenjang</option>{JENJANG_LIST.map((j) => <option key={j}>{j}</option>)}
          </select>
          <label className="flex items-center gap-1.5 text-xs text-stone-500 px-1">
            <input type="checkbox" checked={showNonAktif} onChange={(e) => setShowNonAktif(e.target.checked)} /> Tampilkan Non-Aktif
          </label>
        </div>
        <div className="flex gap-2">
          <label className="px-3 py-2 text-sm rounded-lg border border-stone-300 hover:bg-stone-50 cursor-pointer flex items-center gap-1.5">
            <Icon name="upload" size={14} /> Import Excel / EMIS
            <input type="file" accept=".xlsx,.xls,.csv" multiple className="hidden" onChange={handleFile} />
          </label>
          <button onClick={() => downloadTemplate("guru")} className="px-3 py-2 text-sm rounded-lg border border-stone-300 hover:bg-stone-50 flex items-center gap-1.5"><Icon name="download" size={14} /> Template</button>
          <button onClick={() => exportData(filtered, "Data_Guru.xlsx", (g) => ({ "PEG ID": g.pegId || "", NIP: g.nip, "Pangkat/Golongan": g.pangkat || "", "Tanggal Lahir": g.tanggalLahir || "", NSM: g.nsm || "", Nama: g.nama, "Jenis Kelamin": g.jenisKelamin === "P" ? "P" : "L", Madrasah: g.madrasah, "Kab/Kota": g.kabkota, Jenjang: g.jenjang, "Mata Pelajaran": g.mapel, TUGAS: g.tugas || "", "Status Kepegawaian": g.statusKepegawaian, "Pendidikan Terakhir": g.pendidikan, Jurusan: g.jurusan, Sertifikasi: g.sertifikasi, "Tahun Sertifikasi": g.tahunSertifikasi, "Jam Mengajar": g.jamMengajar, "Status Aktif": g.statusAktif || "Aktif", "Tahun Ajaran": g.tahunAjaran || "" }))} className="px-3 py-2 text-sm rounded-lg border border-stone-300 hover:bg-stone-50 flex items-center gap-1.5"><Icon name="sheet" size={14} /> Export</button>
          {!lockIdentity && (
            <button onClick={() => setModal("add")} className="px-3 py-2 text-sm rounded-lg bg-[#0B4D3E] text-white hover:bg-[#0d5c4a] flex items-center gap-1.5"><Icon name="plus" size={14} /> Tambah Guru</button>
          )}
        </div>
      </div>
      {importing && <p className="text-xs text-stone-500 flex items-center gap-1.5"><Icon name="loader" size={12} className="animate-spin" /> Mengimpor...</p>}
      {importMsg && <p className="text-xs text-emerald-700">{importMsg}</p>}
      <Card className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-stone-50 text-stone-500 text-xs uppercase">
            <tr>
              <th className="text-left px-4 py-2.5 font-medium">Nama</th><th className="text-left px-4 py-2.5 font-medium">Madrasah</th>
              <th className="text-left px-4 py-2.5 font-medium">Kab/Kota</th><th className="text-left px-4 py-2.5 font-medium">Jenjang</th>
              <th className="text-left px-4 py-2.5 font-medium">Status</th><th className="text-left px-4 py-2.5 font-medium">Sertifikasi</th>
              <th className="text-right px-4 py-2.5 font-medium">Aksi</th>
            </tr>
          </thead>
          <tbody>
            {pageRows.map((g) => (
              <tr key={g.id} className="border-t border-stone-100 hover:bg-stone-50/60">
                <td className="px-4 py-2.5">
                  <p className="font-medium text-stone-700">
                    {g.nama} <span className="text-stone-400 font-normal text-xs">({g.jenisKelamin === "P" ? "P" : "L"})</span>
                    {g.statusAktif === "Non-Aktif" && <Badge tone="bad">Non-Aktif{g.alasanNonAktif ? `: ${g.alasanNonAktif}` : ""}</Badge>}
                  </p>
                  <p className="text-xs text-stone-400">{g.mapel || "—"}{g.tugas ? ` · Tugas: ${g.tugas}` : ""}</p>
                  {!g.mapel && g.mapelLatarBelakang && <p className="text-[10px] text-stone-400">Latar belakang: {g.mapelLatarBelakang}</p>}
                  {g.asalMutasi && <p className="text-[10px] text-[#0B4D3E] bg-[#0B4D3E]/5 inline-block px-1.5 py-0.5 rounded mt-0.5">↳ Pindahan dari {g.asalMutasi}</p>}
                  {g.pegId && <p className="text-[10px] text-stone-400">PEG ID: {g.pegId}</p>}
                  {g.pangkat && <p className="text-[10px] text-stone-400">{g.pangkat}</p>}
                  {g.tanggalLahir && <p className="text-[10px] text-stone-400">Lahir: {g.tanggalLahir}</p>}

        </table>
      </Card>
      <div className="flex items-center justify-between">

            <span className="text-xs text-stone-500">Halaman {currentPage} / {totalPages}</span>

          <MutasiGuruForm guru={modal.mutasi} onSave={(hasil) => prosesMutasi(modal.mutasi, hasil)} onCancel={() => setModal(null)} settings={settings} masterList={masterList} />

function DataPengawasTab({ list, masterList, activeYear }) {
  const { data, setData } = list;
  const [modal, setModal] = useState(null);
  const [q, setQ] = useState("");
  const [filterKab, setFilterKab] = useState("");
  const [filterKelompok, setFilterKelompok] = useState("");
  const [showNonAktif, setShowNonAktif] = useState(false);
  const [importing, setImporting] = useState(false);
  const [importMsg, setImportMsg] = useState("");
  const [page, setPage] = useState(1);
  const PER_PAGE = 100;

  const kebutuhan = useMemo(() => buildKebutuhanPengawas(masterList, data.filter((p) => (p.tahunAjaran || defaultTahunAjaran()) === activeYear)), [masterList, data, activeYear]);

  const scopedData = useMemo(() => {
    let base = data.filter((p) => (p.tahunAjaran || defaultTahunAjaran()) === activeYear);
    if (!showNonAktif) base = base.filter((p) => p.statusAktif !== "Non-Aktif");
    return base;
  }, [data, activeYear, showNonAktif]);

  const filtered = useMemo(() => {
    const qLower = q.trim().toLowerCase();
    return scopedData.filter((p) =>
      (!qLower || p.nama.toLowerCase().includes(qLower) || (p.nip || "").includes(qLower)) &&
      (!filterKab || p.kabkota === filterKab) &&
      (!filterKelompok || p.kelompokBinaan === filterKelompok)
    );
  }, [scopedData, q, filterKab, filterKelompok]);

  useEffect(() => { setPage(1); }, [q, filterKab, filterKelompok]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  const currentPage = Math.min(page, totalPages);
  const pageRows = useMemo(() => filtered.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE), [filtered, currentPage]);

  const save = (form) => {
    const exists = data.some((d) => d.id === form.id);
    setData(exists ? data.map((d) => (d.id === form.id ? form : d)) : [...data, form]);
    setModal(null);
  };
  const remove = (id) => setData(data.filter((d) => d.id !== id));
  const newEntry = () => emptyPengawas(activeYear);

  // Sama seperti Data Guru/Tendik: cocokkan lewat PEG ID supaya impor ulang tidak menggandakan
  // data, dan status aktif/mutasi yang sudah dicatat manual tidak ikut tertimpa.
  const PENGAWAS_LOCAL_FIELDS = ["statusAktif", "alasanNonAktif", "tanggalNonAktif"];
  const mergePengawasImport = (fullData, importedRows, targetYear) => {
    const byPegId = new Map();
    fullData.forEach((p) => {
      if (p.pegId && (p.tahunAjaran || defaultTahunAjaran()) === targetYear) byPegId.set(p.pegId, p);
    });
    const matchedIds = new Set();
    let updatedCount = 0, newCount = 0;
    const resultNew = importedRows.map((row) => {
      if (row.pegId && byPegId.has(row.pegId)) {
        const existing = byPegId.get(row.pegId);
        matchedIds.add(existing.id);
        updatedCount++;
        const merged = { ...row, id: existing.id };
        PENGAWAS_LOCAL_FIELDS.forEach((f) => { merged[f] = existing[f]; });
        return merged;
      }
      newCount++;
      return row;
    });
    const untouched = fullData.filter((p) => !matchedIds.has(p.id));
    return { merged: [...untouched, ...resultNew], updatedCount, newCount };
  };

  const handleFile = (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setImporting(true);
    let allMapped = [];
    let filesLeft = files.length;
    let hadError = false;
    files.forEach((file) => {
      parseSheet(file, (rows) => {
        filesLeft -= 1;
        if (!rows) { hadError = true; }
        else {
          const mapped = rows.map((r) => {
            const kelRaw = findColumnValue(r, ["Kelompok Binaan", "Kelompok", "Binaan"]).toString().trim();
            const kelompokBinaan = KELOMPOK_BINAAN_LIST.find((k) => norm(k) === norm(kelRaw)) || "RA & MI";
            const kabkotaRaw = findColumnValue(r, ["Kab/Kota", "Wilayah Kerja", "Kabupaten/Kota", "KOTA MADRASAH"]) || KABKOTA_LIST[0];
            return {
              id: uid(),
              pegId: findColumnValue(r, ["PEGID", "PEG ID", "Peg Id"]).toString().trim(),
              nip: String(r.NIP || r.nip || ""),
              nama: findColumnValue(r, ["Nama", "NAMA"]).toString().trim(),
              pangkat: findColumnValue(r, ["Pangkat", "Pangkat/Golongan", "Pangkat Golongan", "Golongan"]).toString().trim(),
              jenisKelamin: (r["Jenis Kelamin"] || "L").toString().toUpperCase().startsWith("P") ? "P" : "L",
              kelompokBinaan, kabkota: normalizeKabKota(kabkotaRaw),
              noSK: findColumnValue(r, ["No. SK", "No SK", "Nomor SK"]).toString().trim(), tanggalSK: r["Tanggal SK"] || "",
              statusKepegawaian: (findColumnValue(r, ["Status Kepegawaian", "STATUS PEGAWAI", "Status Pegawai"]) || "PNS").toString().trim(),
              pendidikan: findColumnValue(r, ["Pendidikan Terakhir", "Kualifikasi"]) || "S1", jurusan: r.Jurusan || "",
              statusAktif: "Aktif", alasanNonAktif: "", tanggalNonAktif: "",
              tahunAjaran: r["Tahun Ajaran"] || activeYear
            };
          }).filter((r) => r.nama);
          allMapped = allMapped.concat(mapped);
        }
        if (filesLeft === 0) {
          setImporting(false);
          if (allMapped.length) {
            const { merged, updatedCount, newCount } = mergePengawasImport(data, allMapped, activeYear);
            setData(merged);
            setImportMsg(
              (hadError ? "Sebagian file gagal dibaca. " : "") +
              `${newCount} pengawas baru ditambahkan, ${updatedCount} yang sudah ada diperbarui (dicocokkan lewat PEG ID) — status aktif/mutasi yang sudah dicatat sebelumnya tidak ikut tertimpa.`
            );
          } else {
            setImportMsg(hadError ? "Gagal membaca file — tidak ada data yang bisa diimpor." : "Tidak ada baris data yang valid ditemukan.");
          }
        }
      });
    });
    e.target.value = "";
  };

  const downloadPengawasTemplate = () => {
    const ws = XLSX.utils.json_to_sheet([{ NIP: "", Nama: "", "Jenis Kelamin": "L", "Kelompok Binaan": "RA & MI", "Kab/Kota": KABKOTA_LIST[0], "No. SK": "", "Tanggal SK": "", "Status Kepegawaian": "PNS", "Pendidikan Terakhir": "S1", Jurusan: "", "Tahun Ajaran": "" }]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Template");
    XLSX.writeFile(wb, "Template_Data_Pengawas.xlsx");
  };

  return (
    <div className="space-y-4">
      <Card className="p-5">
        <h3 className="font-semibold mb-1 flex items-center gap-2 font-display"><Icon name="users" size={16} /> Kebutuhan &amp; Kekurangan Pengawas Madrasah</h3>
        <p className="text-xs text-stone-500 mb-4">
          Rasio ideal berdasarkan Keputusan Dirjen Pendis Nomor 3933 Tahun 2021 tentang Juknis Rekrutmen, Seleksi, dan Pengangkatan Pengawas Sekolah pada Madrasah:
          <strong> RA &amp; MI 1:10</strong>, <strong>MTs &amp; MA 1:7</strong> (satu pengawas maksimal membina sekian madrasah dalam kelompok itu). Dihitung dari Master Madrasah aktif dan Data Pengawas aktif tahun ajaran ini.
        </p>
        <div className="grid grid-cols-2 gap-4">
          {kebutuhan.perKelompok.map((row) => (
            <div key={row.kelompok} className="border border-stone-200 rounded-lg p-4">
              <p className="text-xs text-stone-400 mb-1">{row.kelompok} · rasio ideal 1:{RASIO_PENGAWAS[row.kelompok]}</p>
              <div className="grid grid-cols-3 gap-2 text-center">
                <div><p className="text-lg font-semibold text-stone-800">{row.jumlahMadrasah}</p><p className="text-[10px] text-stone-400">Madrasah</p></div>
                <div><p className="text-lg font-semibold text-stone-800">{row.jumlahPengawas}</p><p className="text-[10px] text-stone-400">Pengawas Ada</p></div>
                <div><p className={`text-lg font-semibold ${row.kekurangan > 0 ? "text-rose-600" : "text-emerald-600"}`}>{row.kekurangan}</p><p className="text-[10px] text-stone-400">Kekurangan</p></div>
              </div>
              <p className="text-[11px] text-stone-400 mt-2 text-center">Rasio aktual: {row.rasioAktual === null ? "-" : `1:${row.rasioAktual.toFixed(1)}`} · Kebutuhan ideal: {row.kebutuhan} pengawas</p>
            </div>
          ))}
        </div>
        <details className="text-xs mt-4">
          <summary className="cursor-pointer text-[#0B4D3E] font-medium hover:underline">Lihat rincian per Kab/Kota</summary>
          <div className="mt-2 overflow-x-auto">
            <table className="w-full text-xs">
              <thead className="text-stone-400">
                <tr><th className="text-left font-medium pb-1 pr-3">Kab/Kota</th><th className="text-left font-medium pb-1 pr-3">Kelompok</th><th className="text-right font-medium pb-1 pr-3">Madrasah</th><th className="text-right font-medium pb-1 pr-3">Pengawas Ada</th><th className="text-right font-medium pb-1 pr-3">Kebutuhan</th><th className="text-right font-medium pb-1">Kekurangan</th></tr>
              </thead>
              <tbody>
                {kebutuhan.perKabKelompok.map((row, i) => (

          <label className="flex items-center gap-1.5 text-xs text-stone-500 px-1">

        <div className="flex gap-2">

      (lockIdentity || !filterKab || t.kabkota === filterKab) &&

    );

  const newEntry = (prefill) => {
    const base = { ...emptyTendik(activeYear), ...(prefill || {}) };
    if (lockIdentity) return { ...base, nsm: lockIdentity.nsm, madrasah: lockIdentity.madrasah, kabkota: lockIdentity.kabkota, jenjang: lockIdentity.jenjang };
    return base;
  };

  // Sama seperti Data Guru: cocokkan lewat PEG ID supaya impor ulang EMIS Tendik tidak menggandakan
  // data, dan status aktif/mutasi/diklat yang sudah dicatat manual tidak ikut tertimpa.
  const TENDIK_LOCAL_FIELDS = ["statusAktif", "alasanNonAktif", "tanggalNonAktif", "tujuanMutasi", "sudahDiklatKepala", "lembagaDiklat", "tahunDiklat"];
  const mergeTendikImport = (fullData, importedRows, targetYear) => {
    const byPegId = new Map();
    fullData.forEach((t) => {
      if (t.pegId && (t.tahunAjaran || defaultTahunAjaran()) === targetYear) byPegId.set(t.pegId, t);
    });
    const matchedIds = new Set();
    let updatedCount = 0, newCount = 0;
    const resultNew = importedRows.map((row) => {
      if (row.pegId && byPegId.has(row.pegId)) {
        const existing = byPegId.get(row.pegId);
        matchedIds.add(existing.id);
        updatedCount++;
        const merged = { ...row, id: existing.id };
        TENDIK_LOCAL_FIELDS.forEach((f) => { merged[f] = existing[f]; });
        return merged;
      }
      newCount++;
      return row;
    });
    const untouched = fullData.filter((t) => !matchedIds.has(t.id));
    return { merged: [...untouched, ...resultNew], updatedCount, newCount };
  };

  const handleFile = (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setImporting(true);
    let allMapped = [];
    let filesLeft = files.length;
    let hadError = false;
    files.forEach((file) => {
      parseSheet(file, (rows) => {
        filesLeft -= 1;
        if (!rows) { hadError = true; }
        else {
          const mapped = rows.map((r) => {
            const jenisTendik = findColumnValue(r, ["Status Tugas", "Jenis Tendik", "Jenis Tugas", "Tugas"]).toString().trim();
            const pegId = findColumnValue(r, ["PEGID", "PEG ID", "Peg Id", "pegId"]).toString().trim();
            const nsm = findColumnValue(r, ["NSM"]).toString().trim();
            const nama = findColumnValue(r, ["Nama", "NAMA"]).toString().trim();
            const pangkat = findColumnValue(r, ["Pangkat", "Pangkat/Golongan", "Pangkat Golongan", "Golongan"]).toString().trim();
            // File EMIS Tendik biasanya hanya menyertakan NSM (bukan nama madrasah/kab-kota sebagai teks
            // terpisah) — cari otomatis dari Master Madrasah berdasarkan NSM supaya selalu akurat & konsisten,
            // baru pakai kolom teks di file itu sendiri sebagai cadangan kalau NSM tidak ditemukan di master.
            const masterMatch = nsm ? masterList.find((m) => m.nsm === nsm) : null;
            const madrasah = (masterMatch && masterMatch.nama) || findColumnValue(r, ["Madrasah", "MADRASAH", "Nama Madrasah"]).toString().trim();
            const kabkotaRaw = (masterMatch && masterMatch.kabkota) || findColumnValue(r, ["Kab/Kota", "KOTA MADRASAH", "Kabupaten/Kota", "Kabkota"]) || KABKOTA_LIST[0];
            const jenjangRaw = (masterMatch && masterMatch.jenjang) || findColumnValue(r, ["Jenjang", "JENJANG"]) || "MI";
            return {
              id: uid(),
              pegId,
              nip: String(r.NIP || r.nip || r.NUPTK || ""),
              nsm,
              nama,
              pangkat,
              jenisKelamin: (r["Jenis Kelamin"] || r.KELAMIN || r.jenisKelamin || "L").toString().toUpperCase().startsWith("P") ? "P" : "L",
              madrasah,
              kabkota: normalizeKabKota(kabkotaRaw),
              jenjang: normalizeJenjang(jenjangRaw),
              jenisTendik,
              statusKepegawaian: (findColumnValue(r, ["Status Kepegawaian", "STATUS PEGAWAI", "Status Pegawai"]) || "PNS").toString().trim(),
              pendidikan: findColumnValue(r, ["Pendidikan Terakhir", "Kualifikasi"]) || "S1",
              jurusan: r.Jurusan || "",
              statusAktif: "Aktif", alasanNonAktif: "", tanggalNonAktif: "", tujuanMutasi: "",
              sudahDiklatKepala: "Tidak", lembagaDiklat: "", tahunDiklat: "",
              tahunAjaran: r["Tahun Ajaran"] || activeYear
            };
          }).filter((r) => r.nama);
          allMapped = allMapped.concat(mapped);
        }
        if (filesLeft === 0) {
          setImporting(false);
          if (allMapped.length) {
            const { merged, updatedCount, newCount } = mergeTendikImport(data, allMapped, activeYear);
            setData(merged);
            setImportMsg(
              (hadError ? "Sebagian file gagal dibaca. " : "") +
              `${newCount} tendik baru ditambahkan, ${updatedCount} yang sudah ada diperbarui (dicocokkan lewat PEG ID) — status aktif/mutasi/diklat yang sudah dicatat sebelumnya tidak ikut tertimpa.`
            );
          } else {
            setImportMsg(hadError ? "Gagal membaca file — tidak ada data yang bisa diimpor." : "Tidak ada baris data yang valid ditemukan.");
          }
        }
      });
    });
    e.target.value = "";
  };

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center gap-2 justify-between">
        <div className="flex flex-wrap gap-2 items-center flex-1">
          <div className="relative">
            <Icon name="search" size={14} className="absolute left-2.5 top-2.5 text-stone-400" />
            <input placeholder="Cari nama / madrasah / NIP" value={q} onChange={(e) => setQ(e.target.value)} className={inputCls + " pl-8 w-64"} />
          </div>
          <select className={inputCls + " w-44"} value={filterKab} onChange={(e) => setFilterKab(e.target.value)} style={{ display: lockIdentity ? "none" : undefined }}>
            <option value="">Semua Kab/Kota</option>{KABKOTA_LIST.map((k) => <option key={k}>{k}</option>)}
          </select>
          <select className={inputCls + " w-40"} value={filterJenis} onChange={(e) => setFilterJenis(e.target.value)}>
            <option value="">Semua Jenis Tendik</option>{jenisTendikOptions.map((j) => <option key={j}>{j}</option>)}
          </select>
          <label className="flex items-center gap-1.5 text-xs text-stone-500 px-1">
            <input type="checkbox" checked={showNonAktif} onChange={(e) => setShowNonAktif(e.target.checked)} /> Tampilkan Non-Aktif
          </label>
        </div>
        <div className="flex gap-2">
          <label className="px-3 py-2 text-sm rounded-lg border border-stone-300 hover:bg-stone-50 cursor-pointer flex items-center gap-1.5">
            <Icon name="upload" size={14} /> Import Excel
            <input type="file" accept=".xlsx,.xls,.csv" multiple className="hidden" onChange={handleFile} />
          </label>
          <button onClick={() => downloadTemplate("tendik")} className="px-3 py-2 text-sm rounded-lg border border-stone-300 hover:bg-stone-50 flex items-center gap-1.5"><Icon name="download" size={14} /> Template</button>
          <button
            onClick={() => exportData(filtered, "Data_Tendik.xlsx", (t) => ({
              "PEG ID": t.pegId || "", "Jenis Tendik": t.jenisTendik, NIP: t.nip, "Pangkat/Golongan": t.pangkat || "", NSM: t.nsm || "", Nama: t.nama, "Jenis Kelamin": t.jenisKelamin === "P" ? "P" : "L",
              Madrasah: t.madrasah, "Kab/Kota": t.kabkota, Jenjang: t.jenjang, "Status Kepegawaian": t.statusKepegawaian,
              "Pendidikan Terakhir": t.pendidikan, Jurusan: t.jurusan, "Status Aktif": t.statusAktif || "Aktif",
              "Sudah Diklat Kepala": t.sudahDiklatKepala || "", "Lembaga Diklat": t.lembagaDiklat || "", "Tahun Diklat": t.tahunDiklat || "",
              "Tahun Ajaran": t.tahunAjaran || ""
            }))}
            className="px-3 py-2 text-sm rounded-lg border border-stone-300 hover:bg-stone-50 flex items-center gap-1.5"
          ><Icon name="sheet" size={14} /> Export</button>
          {!lockIdentity && (

          )}

      </div>

      {importing && <p className="text-xs text-stone-500 flex items-center gap-1.5"><Icon name="loader" size={12} className="animate-spin" /> Mengimpor...</p>}
      {importMsg && <p className="text-xs text-emerald-700">{importMsg}</p>}

      <Card className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-stone-50 text-stone-500 text-xs uppercase">

              <th className="text-left px-4 py-2.5 font-medium">Nama</th>

              <th className="text-left px-4 py-2.5 font-medium">Madrasah</th>
              <th className="text-left px-4 py-2.5 font-medium">Kab/Kota</th>
              <th className="text-left px-4 py-2.5 font-medium">Jenjang</th>
              <th className="text-left px-4 py-2.5 font-medium">Status Kepegawaian</th>
              <th className="text-right px-4 py-2.5 font-medium">Aksi</th>
            </tr>
          </thead>
          <tbody>
            {pageRows.map((t) => (
              <tr key={t.id} className="border-t border-stone-100 hover:bg-stone-50/60">
                <td className="px-4 py-2.5">
                  <p className="font-medium text-stone-700">
                    {t.nama} <span className="text-stone-400 font-normal text-xs">({t.jenisKelamin === "P" ? "P" : "L"})</span>
                    {t.statusAktif === "Non-Aktif" && <Badge tone="bad">Non-Aktif{t.alasanNonAktif ? `: ${t.alasanNonAktif}` : ""}</Badge>}
                  </p>
                  <p className="text-xs text-stone-400">{t.nip || "—"}</p>
                  {t.pegId && <p className="text-[10px] text-stone-400">PEG ID: {t.pegId}</p>}

                  {!lockIdentity && t.statusAktif === "Non-Aktif" && t.alasanNonAktif === "Mutasi" && (
                    <button onClick={() => setModal({ add: newEntry({ nama: t.nama, pegId: t.pegId, nip: t.nip, jenisKelamin: t.jenisKelamin, jenisTendik: t.jenisTendik, statusKepegawaian: t.statusKepegawaian, pendidikan: t.pendidikan, jurusan: t.jurusan, madrasah: t.tujuanMutasi || "" }) })} className="text-[11px] text-[#0B4D3E] hover:underline mt-0.5">+ Salin ke Madrasah Baru (mutasi)</button>
                  )}
                </td>
                <td className="px-4 py-2.5">
                  <Badge tone="gold">{t.jenisTendik}</Badge>
                  {t.jenisTendik === "Kepala Madrasah" && t.sudahDiklatKepala !== "Ya" && (

                <td className="px-4 py-2.5 text-right whitespace-nowrap">
                  <button onClick={() => setModal({ edit: t })} className="text-stone-400 hover:text-[#0B4D3E] p-1"><Icon name="edit" size={14} /></button>
                  {!lockIdentity && <button onClick={() => remove(t.id)} className="text-stone-400 hover:text-rose-600 p-1"><Icon name="trash" size={14} /></button>}
                </td>
              </tr>
            ))}
            {filtered.length === 0 && <tr><td colSpan={7} className="text-center py-10 text-stone-400 text-sm">Belum ada data tendik.</td></tr>}
          </tbody>
        </table>
      </Card>
      <div className="flex items-center justify-between">
        <p className="text-xs text-stone-400">Menampilkan {filtered.length === 0 ? 0 : (currentPage - 1) * PER_PAGE + 1}–{Math.min(currentPage * PER_PAGE, filtered.length)} dari {filtered.length} tendik (total {data.length}).</p>
        {totalPages > 1 && (
          <div className="flex items-center gap-2">
            <button onClick={() => setPage((p) => Math.max(1, p - 1))} disabled={currentPage <= 1} className="px-3 py-1.5 text-xs rounded-lg border border-stone-300 hover:bg-stone-50 disabled:opacity-40">Sebelumnya</button>
            <span className="text-xs text-stone-500">Halaman {currentPage} / {totalPages}</span>

      {modal && (
        <Modal title={modal === "add" || modal.add ? "Tambah Data Tendik" : "Edit Data Tendik"} onClose={() => setModal(null)} wide>
          <TendikForm initial={modal === "add" ? newEntry() : (modal.add || modal.edit)} onSave={save} onCancel={() => setModal(null)} lockIdentity={lockIdentity} masterList={masterList} jenisTendikOptions={jenisTendikOptions} />
        </Modal>
      )}
    </div>
  );
}
